<title>Jöntuka: A Viking Tale</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Comic+Neue:wght@400;700&family=Kalam:wght@700&display=swap">
<style>
/* Layout: a comic-shop reading stand. Dark ink backdrop, one newsprint page at a time, panels in justified rows (stacked on phones). */
:root {
  --stand: #1a1130;       /* the dark stand behind the page */
  --stand-2: #2a1a4a;
  --paper: #fbf7ec;       /* newsprint */
  --ink: #120a1a;
  --pop: #ffe14a;         /* SFX yellow, used for controls */
  --rune: #5fe8ff;        /* Jon's rune glow */
  --hot: #ff3fa4;
  --font-bang: "Bangers", Impact, "Arial Black", sans-serif;
  --font-letter: "Comic Neue", "Comic Sans MS", "Chalkboard SE", sans-serif;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html { background: var(--stand); }
body {
  background: var(--stand);
  background-image: radial-gradient(circle at 1px 1px, rgba(255,255,255,.07) 1.2px, transparent 1.6px), linear-gradient(180deg, var(--stand-2), var(--stand) 420px);
  background-size: 9px 9px, 100% 100%;
  color: #f4eedb;
  font-family: var(--font-letter);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 24px;
  min-height: 100%;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--ink); }
.bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px))) calc(-1 * max(16px, env(safe-area-inset-right, 0px)));
  padding: 8px max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px));
  background: var(--ink); border-bottom: 3px solid var(--pop);
  display: flex; align-items: center; gap: 10px;
}
.bar .logo { font-family: var(--font-bang); font-size: 22px; letter-spacing: 1px; color: var(--pop); -webkit-text-stroke: 1px #000; text-shadow: 2px 2px 0 var(--hot); white-space: nowrap; margin-right: auto; }
.bar .logo small { color: #f4eedb; text-shadow: none; font-size: 15px; -webkit-text-stroke: 0; margin-left: 4px; }
.count { font-family: var(--font-bang); font-size: 18px; letter-spacing: 1px; color: #f4eedb; white-space: nowrap; font-variant-numeric: tabular-nums; }
button {
  font-family: var(--font-bang); font-size: 18px; letter-spacing: 1px; line-height: 1;
  color: var(--ink); background: var(--pop); border: 3px solid #000; border-radius: 4px;
  padding: 8px 12px; box-shadow: 3px 3px 0 #000; cursor: pointer; touch-action: manipulation;
}
button:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 #000; }
button:disabled { opacity: .35; cursor: default; }
button:focus-visible { outline: 3px solid var(--rune); outline-offset: 2px; }
#mode { background: #f4eedb; }
.bar .arrow { padding: 8px 11px; }
#book { max-width: 760px; margin: 18px auto 0; display: grid; gap: 28px; }
.page {
  background: var(--paper); color: var(--ink);
  padding: 12px; border-radius: 2px;
  box-shadow: 0 0 0 2px #000, 10px 12px 0 rgba(0,0,0,.45);
  display: flex; flex-direction: column; gap: 10px; position: relative;
  overflow: hidden;
}
.page.turn { animation: turn .28s ease-out; }
@keyframes turn { from { opacity: .3; transform: translateX(14px) rotate(.4deg); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .page.turn { animation: none; } }
.row { display: flex; gap: 10px; align-items: stretch; }
.pnl { margin: 0; flex: 0 0 var(--basis); min-width: 0; aspect-ratio: var(--ar); max-width: 100%; position: relative; }
.pnl svg { display: block; width: 100%; height: 100%; overflow: visible; }
.pnl:nth-child(2) { z-index: 1; } .pnl:nth-child(3) { z-index: 2; }
.pagehead { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; padding: 2px 4px 0; }
.pagehead span { font-family: var(--font-bang); font-size: 30px; letter-spacing: 1.5px; color: var(--pop); -webkit-text-stroke: 1.5px #000; text-shadow: 3px 3px 0 #000; line-height: 1; }
.pagehead small { font-family: "Kalam", "Comic Neue", cursive; font-weight: 700; font-size: 16px; color: #1d2a5a; }
.flash { background: #efe6f7; }
.endnote { margin: 0; text-align: center; font-family: var(--font-bang); font-size: 20px; letter-spacing: 1px; color: var(--ink); }
.folio { font-family: var(--font-bang); font-size: 14px; letter-spacing: 1px; text-align: center; color: #6a5a7a; margin-top: -2px; }
.cover { padding: 10px; background: #0d0820; }
.cover .folio { display: none; }
.nav { max-width: 760px; margin: 22px auto 0; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.nav button { font-size: 22px; padding: 12px 18px; }
.credit { max-width: 760px; margin: 18px auto 0; text-align: center; font-size: 13px; color: #b8a8d0; }
.scrollmode .nav .arrow { visibility: hidden; }
.scrollmode .bar .arrow { display: none; }
@media (max-width: 600px) {
  .row { flex-direction: column; }
  .pnl { flex: none; width: 100%; }
  .page { padding: 8px; gap: 8px; }
  .row { gap: 8px; }
  .bar .logo small { display: none; }
  .bar { gap: 6px; }
  button { font-size: 16px; padding: 7px 9px; }
  #book { gap: 20px; margin-top: 14px; }
}
@media (max-width: 370px) { .bar .logo { font-size: 18px; } .count { font-size: 15px; } }
</style>

<header class="bar">
  <div class="logo">JÖNTUKA <small>A Viking Tale #1</small></div>
  <button class="arrow" id="prev" aria-label="Previous page">◀</button>
  <span class="count" id="count" aria-live="polite">Cover</span>
  <button class="arrow" id="next" aria-label="Next page">▶</button>
  <button id="mode" aria-pressed="false">Read all</button>
</header>

<main id="book" aria-label="Jöntuka: A Viking Tale, the comic"></main>

<nav class="nav" aria-label="Page turning">
  <button class="arrow" id="prev2">◀ Back</button>
  <span class="count" id="count2">Cover</span>
  <button class="arrow" id="next2">Next ▶</button>
</nav>
<p class="credit">Written by Owen. Drawn in the world of the game. Swipe, tap the arrows, or use the arrow keys to turn pages.</p>

<script src="js/art.js"></script>
<script src="js/pages.js"></script>
<script src="js/reader.js"></script>
