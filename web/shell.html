<title>Jöntuka</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  /* Layout: one centered 8:7 game screen, a short key legend under it, touch pad only on touch devices. */
  :root {
    --bg: #14121f;
    --panel: #221d38;
    --ink: #f3ecd2;
    --muted: #a79fc4;
    --axe: #8fd0ff;
    --gold: #ffd84a;
    --pixel: "Press Start 2P", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    color-scheme: dark;
  }
  html, body { background: var(--bg); color: var(--ink); }
  body { margin: 0; padding-inline: 16px; padding-block: 16px 24px; font-family: var(--pixel); font-size: 10px; line-height: 1.7; }
  main { max-width: 768px; margin-inline: auto; display: flex; flex-direction: column; gap: 14px; }
  .screen { position: relative; width: 100%; aspect-ratio: 8 / 7; background: #000; border: 3px solid var(--panel); outline: 2px solid var(--axe); }
  canvas { display: block; width: 100%; height: 100%; image-rendering: auto; touch-action: none; }
  .legend { display: flex; flex-wrap: wrap; gap: 8px 20px; color: var(--muted); }
  .legend b { color: var(--gold); font-weight: normal; }
  .pad { display: none; justify-content: space-between; align-items: center; gap: 16px; user-select: none; -webkit-user-select: none; }
  @media (pointer: coarse) { .pad { display: flex; } .legend { display: none; } }
  .stick { position: relative; width: 150px; height: 150px; flex: none; border-radius: 50%; touch-action: none;
    background: radial-gradient(circle, var(--panel) 0 55%, #2c2648 56% 100%); border: 2px solid var(--axe); }
  .stick::before { content: ''; position: absolute; inset: 22%; border-radius: 50%; border: 1px dashed #4a4570; }
  .knob { position: absolute; left: 50%; top: 50%; width: 64px; height: 64px; margin: -32px 0 0 -32px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #cfefff, var(--axe) 45%, #3a6a9a); border: 2px solid #0d0d33; pointer-events: none; }
  .stick.on .knob { box-shadow: 0 0 0 4px rgba(143,208,255,.35); }
  .btn { background: var(--panel); color: var(--ink); border: 2px solid var(--axe); font-family: var(--pixel); font-size: 12px; touch-action: none; border-radius: 4px; }
  .btn:active, .btn.on { background: var(--axe); color: var(--bg); }
  .btn:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
  .ab { display: grid; grid-template-columns: repeat(2, 76px); gap: 10px; }
  .ab .btn { width: 76px; height: 56px; border-radius: 28px; font-size: 9px; }
  .bar { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; color: var(--muted); }
  .bar .btn { font-size: 9px; padding: 8px 12px; }
  #padnote { display: none; color: var(--gold); }
  #padnote.on { display: inline; }
  /* Theater: fills the whole viewport (and real full screen where the browser allows it).
     Canvas scales to fit; the thumbstick and buttons float over the bottom corners. */
  body.theater { padding: 0; overflow: hidden; }
  body.theater main { max-width: none; position: fixed; inset: 0; display: block; }
  body.theater .screen { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: min(100vw, calc(100vh * 8 / 7)); height: min(100vh, calc(100vw * 7 / 8)); border: 0; outline: 0; }
  body.theater .legend, body.theater .bar { display: none; }
  body.theater .pad { display: flex; position: fixed; left: 0; right: 0; bottom: max(12px, env(safe-area-inset-bottom, 0px)); padding: 0 18px; pointer-events: none; }
  body.theater .pad > * { pointer-events: auto; }
  body.theater .stick, body.theater .ab .btn { opacity: 0.55; }
  body.theater .stick.on, body.theater .ab .btn.on { opacity: 0.95; }
  body.theater #exitfs { display: block; position: fixed; top: max(8px, env(safe-area-inset-top, 0px)); right: 8px; opacity: 0.6; z-index: 2; }
  #exitfs { display: none; }
  body.theater.nopad .pad { display: none; }
  @media (hover: hover) and (pointer: fine) { body.theater .pad { display: none; } }
  /* Owen's Script: a writer's notebook under the game screen. Pixel font for headings, a readable face for writing. */
  .btns { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
  .script { --paper: #1b1830; --line: #2e2a4c; background: var(--paper); border: 3px solid var(--panel); outline: 2px solid var(--gold); padding: 14px; display: flex; flex-direction: column; gap: 12px; position: relative;
    font-family: "Nunito", ui-rounded, system-ui, sans-serif; font-size: 15px; line-height: 1.45; color: var(--ink); }
  .script h2, .script h3, .script .tabs button, .script b { font-family: var(--pixel); font-weight: normal; }
  .st-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .st-head h2 { margin: 0; font-size: 12px; color: var(--gold); letter-spacing: .04em; }
  .script h3 { margin: 0; font-size: 9px; color: var(--axe); line-height: 1.6; min-width: 0; }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; border-bottom: 2px solid var(--line); padding-bottom: 8px; }
  .tabs button { background: none; border: 2px solid var(--line); color: var(--muted); font-size: 9px; padding: 8px 10px; border-radius: 4px; cursor: pointer; }
  .tabs button[aria-selected="true"] { border-color: var(--gold); color: var(--gold); }
  .script button { cursor: pointer; }
  .script button:focus-visible, .script input:focus-visible, .script textarea:focus-visible { outline: 3px solid var(--gold); outline-offset: 1px; }
  #st-save, .psave, #ch4-new { background: var(--gold); color: #1a1208; border: 0; border-radius: 4px; padding: 9px 14px; font-weight: 800; font-family: inherit; font-size: 14px; }
  .ghost { background: none; border: 2px solid var(--line); color: var(--ink); border-radius: 4px; padding: 7px 12px; font-family: inherit; font-size: 14px; }
  .ghost:hover { border-color: var(--axe); }
  .hint { margin: 0; color: var(--muted); }
  .empty { margin: 0; color: var(--ink); }
  .scenes { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 6px; }
  .scene { width: 100%; text-align: left; display: flex; justify-content: space-between; gap: 8px; align-items: baseline; background: #221d3a; border: 1px solid var(--line); color: var(--ink); padding: 9px 10px; border-radius: 4px; font: inherit; }
  .scene:hover { border-color: var(--axe); }
  .scene em { font-style: normal; font-size: 12px; color: #9be08a; flex: none; }
  .row { display: flex; align-items: center; gap: 8px; }
  .row.wrap { flex-wrap: wrap; }
  .grow { flex: 1; }
  .line { display: grid; grid-template-columns: minmax(84px, 130px) 1fr auto; gap: 6px; align-items: start; }
  .line input, .line textarea, .ptitle { background: #0f0d1e; color: var(--ink); border: 1px solid var(--line); border-radius: 4px; padding: 7px 8px; font: inherit; min-width: 0; }
  .line textarea { resize: vertical; }
  .line input { color: var(--gold); font-weight: 700; }
  .ptitle { flex: 1; }
  .page .line { grid-template-columns: minmax(84px, 130px) 1fr; }
  .x { background: none; border: 0; color: var(--muted); font-size: 14px; padding: 7px; }
  .x:hover { color: #ff8a8a; }
  .page { display: flex; flex-direction: column; gap: 6px; padding: 10px; border: 1px solid var(--line); border-radius: 4px; background: #221d3a; }
  .page b { font-size: 9px; color: var(--gold); flex: none; }
  .st-status { margin: 0; font-size: 13px; color: var(--muted); }
  .note { display: flex; flex-direction: column; gap: 4px; background: #f4eedb; color: #26305a; padding: 8px 10px 10px 26px; border-radius: 3px; background-image: linear-gradient(90deg, transparent 16px, #e08a8a 16px, #e08a8a 17px, transparent 17px); }
  .note span { font-weight: 800; font-size: 13px; } .note i { font-weight: 400; color: #5a5a6e; }
  .note textarea { background: transparent; border: 0; border-bottom: 1px solid #a9c0de; color: #26305a; font: inherit; resize: vertical; }
  .slots { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
  .slot { display: flex; flex-direction: column; gap: 6px; padding: 8px; background: #221d3a; border: 1px solid var(--line); border-radius: 4px; }
  .slot b { font-size: 8px; color: var(--gold); }
  .thumb { aspect-ratio: 4 / 3; max-width: 100%; background: #f4eedb; border-radius: 2px; display: grid; place-items: center; overflow: hidden; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; } .thumb span { color: #8a8098; font-size: 12px; }
  .up { text-align: center; font-size: 13px; padding: 6px; cursor: pointer; }
  .thumb img { cursor: zoom-in; }
  .lightbox { position: fixed; inset: 0; z-index: 20; background: rgba(10,8,18,.92); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
  .lightbox img { max-width: 100%; max-height: calc(100% - 56px); object-fit: contain; border-radius: 3px; }
  .toast { position: absolute; right: 14px; top: 12px; background: #9be08a; color: #102010; font-weight: 800; padding: 6px 10px; border-radius: 4px; }
  @media (max-width: 480px) { .line { grid-template-columns: 1fr auto; } .line input { grid-column: 1 / -1; } .page .line { grid-template-columns: 1fr; } }
</style>
<main>
  <div class="screen"><canvas id="g" width="256" height="224" tabindex="0" aria-label="Jöntuka game screen"></canvas></div>
  <div class="bar">
    <span>Controller: <b>stick</b> move · <b>A</b> swing · <b>B</b> throw · <b>X</b> thunder · <b>Y</b> horn · <b>RB/RT</b> dash · <b>Start</b> gear <span id="padnote">· connected ✓</span></span>
    <span class="btns"><button class="btn" id="scriptbtn" aria-controls="script">OWEN'S SCRIPT</button><button class="btn" id="fsbtn" aria-label="Play full screen">FULL SCREEN</button></span>
  </div>
  <button class="btn" id="exitfs" aria-label="Leave full screen">✕</button>
  <div class="legend">
    <span><b>Arrows / WASD</b> move</span>
    <span><b>Z / Space</b> swing Jon</span>
    <span><b>X</b> throw Jon</span>
    <span><b>Shift / F</b> Voodoo Dash</span>
    <span><b>C</b> Thunder Strike</span>
    <span><b>V</b> Demon Horn</span>
    <span><b>Enter</b> gear and quest</span>
    <span><b>M</b> all sound</span>
    <span><b>N</b> music</span>
  </div>
  <section id="script" class="script" hidden aria-label="Owen's Script">
    <header class="st-head"><h2>OWEN'S SCRIPT</h2><button class="ghost" id="st-close">Close ✕</button></header>
    <div class="tabs" role="tablist"><button role="tab" id="tab-scenes" aria-selected="true">Every scene</button><button role="tab" id="tab-ch4" aria-selected="false">Chapter 4: Walter's Forge</button><button role="tab" id="tab-notebook" aria-selected="false">Notebook photos</button></div>
    <div id="st-body"></div>
    <p class="st-status" id="st-status"></p>
    <div class="toast" id="st-toast" hidden role="status"></div>
  </section>
  <div class="pad" aria-label="Touch controls">
    <div class="stick" id="stick" aria-label="Move: drag the thumbstick"><div class="knob" id="knob"></div></div>
    <div class="ab">
      <button class="btn" data-a="horn" aria-label="Demon Horn">HORN</button>
      <button class="btn" data-a="dash" aria-label="Voodoo Dash">DASH</button>
      <button class="btn" data-a="menu" aria-label="Gear menu">GEAR</button>
      <button class="btn" data-a="c" aria-label="Thunder Strike">RUNE</button>
      <button class="btn" data-a="b" aria-label="Throw Jon">THROW</button>
      <button class="btn" data-a="a" aria-label="Swing Jon or talk">SWING</button>
    </div>
  </div>
</main>
<script>
/*SCRIPT*/
</script>
