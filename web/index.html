<title>Jöntuka</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  /* Layout: one centered 8:7 game screen, a short key legend under it, touch pad only on touch devices. */
  :root {
    --bg: #14121f;
    --panel: #221d38;
    --ink: #f3ecd2;
    --muted: #a79fc4;
    --axe: #8fd0ff;
    --gold: #ffd84a;
    --pixel: "Press Start 2P", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    color-scheme: dark;
  }
  html, body { background: var(--bg); color: var(--ink); }
  body { margin: 0; padding-inline: 16px; padding-block: 16px 24px; font-family: var(--pixel); font-size: 10px; line-height: 1.7; }
  main { max-width: 768px; margin-inline: auto; display: flex; flex-direction: column; gap: 14px; }
  .screen { position: relative; width: 100%; aspect-ratio: 8 / 7; background: #000; border: 3px solid var(--panel); outline: 2px solid var(--axe); }
  canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; image-rendering: crisp-edges; touch-action: none; }
  .legend { display: flex; flex-wrap: wrap; gap: 8px 20px; color: var(--muted); }
  .legend b { color: var(--gold); font-weight: normal; }
  .pad { display: none; justify-content: space-between; align-items: center; gap: 16px; user-select: none; -webkit-user-select: none; }
  @media (pointer: coarse) { .pad { display: flex; } }
  .dpad { display: grid; grid-template-columns: repeat(3, 56px); grid-template-rows: repeat(3, 56px); gap: 4px; }
  .btn { background: var(--panel); color: var(--ink); border: 2px solid var(--axe); font-family: var(--pixel); font-size: 12px; touch-action: none; border-radius: 4px; }
  .btn:active, .btn.on { background: var(--axe); color: var(--bg); }
  .btn:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
  .ab { display: flex; gap: 14px; }
  .ab .btn { width: 76px; height: 76px; border-radius: 50%; font-size: 10px; }
</style>
<main>
  <div class="screen"><canvas id="g" width="256" height="224" tabindex="0" aria-label="Jöntuka game screen"></canvas></div>
  <div class="legend">
    <span><b>Arrows / WASD</b> move</span>
    <span><b>Z / Space</b> swing Jon</span>
    <span><b>X / Shift</b> throw Jon</span>
  </div>
  <div class="pad" aria-label="Touch controls">
    <div class="dpad">
      <span></span><button class="btn" data-a="up" aria-label="Up">▲</button><span></span>
      <button class="btn" data-a="left" aria-label="Left">◀</button><span></span><button class="btn" data-a="right" aria-label="Right">▶</button>
      <span></span><button class="btn" data-a="down" aria-label="Down">▼</button><span></span>
    </div>
    <div class="ab">
      <button class="btn" data-a="throw" aria-label="Throw Jon">THROW</button>
      <button class="btn" data-a="swing" aria-label="Swing Jon">SWING</button>
    </div>
  </div>
</main>
<script>
const MAP = ["TTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTT", "TTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTT", "TT..................T...T.............TT", "TT..sssssssspssssssssssssspssssssssss.TT", "TT..ssssssssssssssspsssssssssssssssss.TT", "TT...........ssssssssssssssssssssssss.TT", "TT.......##..s~~~~~~~~~~~~~~sssspssss.TT", "TT...........s~~~~~~~~~~~~~~sssssssss.TT", "TT...TT......s~~~~~~~~~~~~~~sssssssss.TT", "TT...T.......s~~~~~~~~~~~~~~sssssssss.TT", "TT...........s~~~~~~~~~~~~~~ssssspsss.TT", "TT...@.......s~~~~~~~~~~~~~~sssssssss.TT", "TTTT.........s~~~~~~~~~~~~~~ssssssssssTT", "TT...........s~~~~~~~~~~~~~~ssLsssssssTT", "TT......TT...s~~~~~~~~~~~~~~ssssssssssTT", "TT......T....s~~~~~~~~~~~~~~sss#ss#ss#TT", "TT...........s~~~~~~~~~~~~~~ssssssssssTT", "TT...........s~~~~~~~~~~~~~~ssssssssssTT", "TT..TT.......s~~~~~~~~~~~~~~ssssssssssTT", "TT...........s~~~~~~~~~~~~~~ss#ss#ss#sTT", "TT.....#.....s~~~~~~~~~~~~~~ssssssssssTT", "TT...........sssssssssssssssssssssssssTT", "TT........TT.................ssssssBssTT", "TT........T..................sssssssssTT", "TT...........................sssssssssTT", "TT...........................sssssssssTT", "TTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTT", "TTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTT"];
const LINES = {
  "intro": [
    ["Jon", "Get up, you oaf!"],
    ["Owen", "Jon is a flying axe that can talk. If you think that's weird, he can also recite Rush E note for note."],
    ["Jon", "TA DA! Norway! Time to get going."],
    ["Owen", "Norway was where I got Jon, but also where I was killed and brought back to life."],
    ["Jon", "Arrows move you. Z swings me. X throws me. I always come back. Because I'm loyal."]
  ],
  "dive": [
    ["Owen", "I jumped in the lake to get away from the penguin."],
    ["Jon", "Found you! Rocketing you out like the lady of the lake!"]
  ],
  "boss": [
    ["Owen", "The possessed, rabid, crazy penguin. He's waiting on the shore."],
    ["Jon", "Dodge his charge, then chop him! Stay on the move!"]
  ],
  "revive": [
    ["Owen", "He killed me. (Not going into details about that.)"],
    ["Jon", "Voodoo magic! Now we're bonded for eternity. Get up, zombie!"],
    ["Owen", "I'm an undead voodoo magic zombie now. I hit harder, but I can't die twice."]
  ],
  "win": [
    ["Jon", "You killed the penguin while he was shocked about the zombie thing!"],
    ["Owen", "Ever since, Jon has been making penguin noises in the middle of the night."],
    ["Jon", "Next stop: Flight 364. Don't look at the flight attendant."]
  ],
  "quips": [
    "Get up, you oaf!",
    "da da da... (Rush E)",
    "World's best owner!",
    "I'm loyal!",
    "Penguin noises: ak ak ak",
    "You can't get rid of me."
  ],
  "game_over": "Un-unalived once. Not twice. Press Z to try again.",
  "to_be_continued": "TO BE CONTINUED..."
};
const TUNE = {
  "player": { "hearts": 3, "speed": 72, "swing_damage": 1, "zombie_bonus": 1 },
  "jon": { "throw_range": 110, "throw_speed": 190, "throw_damage": 1 },
  "penguin": { "hp": 2, "speed": 38, "touch_damage": 1, "sight": 140 },
  "boss": { "hp": 14, "speed": 30, "charge_speed": 150, "touch_damage": 2 }
};

const T = 16, VW = 256, VH = 224;
const COLS = MAP[0].length, ROWS = MAP.length;
const cv = document.getElementById('g');
const ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;
const FONT = '8px "Press Start 2P", ui-monospace, Menlo, Consolas, monospace';

// ---------- input ----------
const ACTIONS = {
  left: ['ArrowLeft', 'KeyA'], right: ['ArrowRight', 'KeyD'], up: ['ArrowUp', 'KeyW'], down: ['ArrowDown', 'KeyS'],
  swing: ['KeyZ', 'Space', 'KeyJ'], throw: ['KeyX', 'KeyK', 'ShiftLeft', 'ShiftRight'],
  confirm: ['KeyZ', 'Space', 'Enter', 'KeyJ'],
};
const keys = {}, virt = {}, edge = {};
const held = a => !!virt[a] || ACTIONS[a].some(c => keys[c]);
const just = a => !!edge[a];
window.addEventListener('keydown', e => {
  if (e.code.startsWith('Arrow') || e.code === 'Space') e.preventDefault();
  if (e.repeat) return;
  keys[e.code] = true;
  for (const a in ACTIONS) if (ACTIONS[a].includes(e.code)) edge[a] = true;
});
window.addEventListener('keyup', e => { keys[e.code] = false; });
window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; for (const k in virt) virt[k] = false; });
cv.addEventListener('pointerdown', () => { cv.focus(); if (G.state === 'title') edge.confirm = true; });
document.querySelectorAll('.btn[data-a]').forEach(b => {
  const a = b.dataset.a;
  const on = e => { e.preventDefault(); virt[a] = true; b.classList.add('on'); edge[a] = true; if (a === 'swing') edge.confirm = true; };
  const off = e => { e.preventDefault(); virt[a] = false; b.classList.remove('on'); };
  b.addEventListener('pointerdown', on);
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(t => b.addEventListener(t, off));
});

// ---------- world ----------
const G = { state: 'title', t: 0, player: null, jon: null, enemies: [], boss: null, launch: { x: 0, y: 0 },
  bossSeen: false, dived: false, queue: [], done: null, who: '', text: '', talking: false, banner: '' };

const tileAt = (x, y) => {
  const tx = Math.floor(x / T), ty = Math.floor(y / T);
  if (tx < 0 || ty < 0 || tx >= COLS || ty >= ROWS) return 'T';
  return MAP[ty][tx];
};
const solid = (x, y) => { const c = tileAt(x, y); return c === 'T' || c === '#'; };
const blocked = (x, y, r) => solid(x - r, y - r) || solid(x + r, y - r) || solid(x - r, y + r) || solid(x + r, y + r);
function tryMove(n, mx, my, r) {
  if (!blocked(n.x + mx, n.y, r)) n.x += mx;
  if (!blocked(n.x, n.y + my, r)) n.y += my;
}
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);

function start() {
  G.enemies = []; G.boss = null; G.bossSeen = false; G.dived = false; G.banner = ''; G.talking = false;
  let sp = { x: 0, y: 0 };
  MAP.forEach((row, ty) => [...row].forEach((c, tx) => {
    const p = { x: tx * T + 8, y: ty * T + 8 };
    if (c === '@') sp = p;
    if (c === 'L') G.launch = p;
    if (c === 'p' || c === 'B') {
      const boss = c === 'B', d = boss ? TUNE.boss : TUNE.penguin;
      const e = { x: p.x, y: p.y, boss, hp: d.hp, speed: d.speed, touch: d.touch_damage, sight: d.sight || 0,
        charge: d.charge_speed || 0, active: !boss, r: boss ? 11 : 6, flash: 0, kx: 0, ky: 0, st: 'chase', t: 0, dx: 0, dy: 0, wob: 0 };
      G.enemies.push(e); if (boss) G.boss = e;
    }
  }));
  G.player = { x: sp.x, y: sp.y, fx: 0, fy: 1, max: TUNE.player.hearts * 2, hp: TUNE.player.hearts * 2, inv: 0, cd: 0,
    zombie: false, kx: 0, ky: 0, walk: 0, launching: false, lp: 0, from: null, to: null };
  G.jon = { x: sp.x + 10, y: sp.y - 14, mode: 'follow', vx: 0, vy: 0, trav: 0, hit: [], t: 0, st: 0, base: 0, spin: 0,
    quip: '', qt: 0, nq: 6 };
  say(LINES.intro);
}

// ---------- dialogue ----------
function say(lines, done) { G.queue = lines.slice(); G.done = done || null; G.state = 'talk'; nextLine(); }
function nextLine() {
  if (!G.queue.length) {
    G.talking = false; G.state = 'play'; G.player.cd = 0.25;
    const cb = G.done; G.done = null; if (cb) cb(); return;
  }
  const [who, text] = G.queue.shift();
  G.who = who; G.text = text; G.talking = true; G.shown = 0;
}

// ---------- events ----------
function dive(p) {
  p.launching = true; p.lp = 0; p.from = { x: p.x, y: p.y }; p.to = G.launch; p.inv = 1.5;
  G.jon.mode = 'follow';
  if (!G.dived) { G.dived = true; say(LINES.dive); }
}
function hurt(dmg, from) {
  const p = G.player;
  if (p.inv > 0 || p.launching || G.state !== 'play') return;
  p.hp -= dmg; p.inv = 1;
  const d = Math.hypot(p.x - from.x, p.y - from.y) || 1;
  p.kx = (p.x - from.x) / d * 160; p.ky = (p.y - from.y) / d * 160;
  if (p.hp <= 0) {
    p.hp = 0;
    if (!p.zombie) { p.zombie = true; p.hp = p.max; p.inv = 2; say(LINES.revive); }
    else { G.state = 'over'; G.banner = LINES.game_over; }
  }
}
function hitEnemy(e, dmg, from) {
  e.hp -= dmg; e.flash = 0.15;
  const d = Math.hypot(e.x - from.x, e.y - from.y) || 1, k = e.boss ? 80 : 140;
  e.kx = (e.x - from.x) / d * k; e.ky = (e.y - from.y) / d * k;
  if (e.hp <= 0) {
    e.active = false; G.enemies = G.enemies.filter(o => o !== e);
    if (e === G.boss) say(LINES.win, () => { G.state = 'win'; G.banner = LINES.to_be_continued + '\nPress Z to restart'; });
  }
}

// ---------- update ----------
function update(dt) {
  G.t += dt;
  const p = G.player, j = G.jon;
  if (G.state === 'title') { if (just('confirm')) start(); return; }
  if (G.state === 'talk') {
    G.shown += dt * 60;
    if (just('confirm')) { if (G.shown < G.text.length) G.shown = G.text.length; else nextLine(); }
    return;
  }
  if (G.state === 'over' || (G.state === 'win' && G.banner)) { if (just('confirm')) start(); return; }
  p.inv = Math.max(0, p.inv - dt); p.cd = Math.max(0, p.cd - dt);

  if (p.launching) {
    p.lp += dt / 0.6;
    const k = Math.min(p.lp, 1);
    p.x = p.from.x + (p.to.x - p.from.x) * k; p.y = p.from.y + (p.to.y - p.from.y) * k;
    if (p.lp >= 1) p.launching = false;
  } else {
    let vx = (held('right') ? 1 : 0) - (held('left') ? 1 : 0), vy = (held('down') ? 1 : 0) - (held('up') ? 1 : 0);
    const m = Math.hypot(vx, vy);
    if (m > 0) {
      vx /= m; vy /= m; p.fx = vx; p.fy = vy; p.walk += dt * 10;
      tryMove(p, vx * TUNE.player.speed * dt, vy * TUNE.player.speed * dt, 5);
    }
    const kl = Math.hypot(p.kx, p.ky);
    if (kl > 1) {
      tryMove(p, p.kx * dt, p.ky * dt, 5);
      const nl = Math.max(0, kl - 500 * dt); p.kx *= nl / kl; p.ky *= nl / kl;
    }
    if (tileAt(p.x, p.y) === '~') dive(p);
    else if (p.cd <= 0 && j.mode === 'follow') {
      if (just('swing')) { j.mode = 'swing'; j.st = 0; j.base = Math.atan2(p.fy, p.fx); j.hit = []; }
      else if (just('throw')) {
        j.mode = 'out'; j.x = p.x; j.y = p.y; j.trav = 0; j.hit = [];
        const l = Math.hypot(p.fx, p.fy) || 1; j.vx = p.fx / l * TUNE.jon.throw_speed; j.vy = p.fy / l * TUNE.jon.throw_speed;
      }
    }
  }
  updateJon(dt);
  for (const e of G.enemies.slice()) updateEnemy(e, dt);
  if (!G.bossSeen && G.boss && dist(p, G.boss) < 110) { G.bossSeen = true; G.boss.active = true; say(LINES.boss); }
}

function jonHits(dmg, reach, from) {
  const j = G.jon;
  for (const e of G.enemies.slice()) {
    if (j.hit.includes(e) || !e.active) continue;
    if (dist(j, e) < reach + e.r) { j.hit.push(e); hitEnemy(e, dmg, from); }
  }
}
function updateJon(dt) {
  const j = G.jon, p = G.player;
  const bonus = p.zombie ? TUNE.player.zombie_bonus : 0;
  j.t += dt;
  if (j.mode === 'follow') {
    const tx = p.x + 10, ty = p.y - 14 + Math.sin(j.t * 3) * 2, k = Math.min(1, 8 * dt);
    j.x += (tx - j.x) * k; j.y += (ty - j.y) * k; j.spin = 0;
  } else if (j.mode === 'swing') {
    j.st += dt;
    const k = j.st / 0.22, a = j.base + (-1.3 + 2.6 * k);
    j.x = p.x + Math.cos(a) * 15; j.y = p.y + Math.sin(a) * 15; j.spin = a + Math.PI / 2;
    jonHits(TUNE.player.swing_damage + bonus, 10, p);
    if (k >= 1) j.mode = 'follow';
  } else if (j.mode === 'out') {
    j.x += j.vx * dt; j.y += j.vy * dt; j.trav += Math.hypot(j.vx, j.vy) * dt; j.spin += dt * 22;
    jonHits(TUNE.jon.throw_damage + bonus, 9, j);
    if (j.trav > TUNE.jon.throw_range || solid(j.x, j.y)) { j.mode = 'back'; j.hit = []; }
  } else if (j.mode === 'back') {
    const dx = p.x - j.x, dy = p.y - j.y, d = Math.hypot(dx, dy) || 1;
    j.x += dx / d * 230 * dt; j.y += dy / d * 230 * dt; j.spin += dt * 22;
    jonHits(TUNE.jon.throw_damage + bonus, 9, j);
    if (d < 8) j.mode = 'follow';
  }
  j.nq -= dt; j.qt = Math.max(0, j.qt - dt);
  if (j.nq <= 0) { j.nq = 9 + Math.random() * 7; j.quip = LINES.quips[Math.floor(Math.random() * LINES.quips.length)]; j.qt = 2.5; }
}
function updateEnemy(e, dt) {
  e.flash = Math.max(0, e.flash - dt);
  if (!e.active) return;
  e.wob += dt * 8;
  const kl = Math.hypot(e.kx, e.ky);
  if (kl > 1) { tryMove(e, e.kx * dt, e.ky * dt, e.r * 0.6); const nl = Math.max(0, kl - 400 * dt); e.kx *= nl / kl; e.ky *= nl / kl; }
  const p = G.player, dx = p.x - e.x, dy = p.y - e.y, d = Math.hypot(dx, dy) || 1;
  if (e.boss) {
    e.t += dt;
    if (e.st === 'chase') { tryMove(e, dx / d * e.speed * dt, dy / d * e.speed * dt, e.r * 0.6); if (e.t > 2.2) { e.st = 'wind'; e.t = 0; } }
    else if (e.st === 'wind') { e.dx = dx / d; e.dy = dy / d; if (e.t > 0.6) { e.st = 'charge'; e.t = 0; } }
    else {
      const bx = e.x, by = e.y;
      tryMove(e, e.dx * e.charge * dt, e.dy * e.charge * dt, e.r * 0.6);
      if (e.t > 0.7 || Math.hypot(bx - e.x, by - e.y) < 0.1) { e.st = 'chase'; e.t = 0; }
    }
  } else if (d < e.sight) tryMove(e, dx / d * e.speed * dt, dy / d * e.speed * dt, e.r * 0.6);
  if (d < e.r + 4) hurt(e.touch, e);
}

// ---------- drawing ----------
const R = (x, y, w, h, c) => { ctx.fillStyle = c; ctx.fillRect(Math.round(x), Math.round(y), w, h); };
const hash = (x, y) => Math.floor(Math.abs(Math.sin(x * 12.9898 + y * 78.233) * 43758.5453)) % 100;

function drawMap(cx, cy) {
  const x0 = Math.floor(cx / T), y0 = Math.floor(cy / T);
  for (let ty = y0; ty <= y0 + 14; ty++) for (let tx = x0; tx <= x0 + 16; tx++) {
    if (tx < 0 || ty < 0 || tx >= COLS || ty >= ROWS) continue;
    const c = MAP[ty][tx], ox = tx * T - cx, oy = ty * T - cy, h = hash(tx, ty);
    const sand = c === 's' || c === 'L' || c === 'B', water = c === '~';
    R(ox, oy, T, T, water ? '#3366cc' : sand ? '#dbc780' : '#549a3d');
    if (!water && !sand && h < 30) R(ox + h % 12 + 1, oy + (h * 7) % 12 + 1, 2, 3, '#40801d');
    else if (sand && h < 20) R(ox + h % 12 + 1, oy + (h * 5) % 12 + 1, 2, 1, '#bda866');
    else if (water) {
      const w = Math.floor(G.t * 2 + tx + ty) % 4;
      if (w === 0) R(ox + 3, oy + 5, 8, 1, '#73a6f2'); else if (w === 2) R(ox + 5, oy + 11, 7, 1, '#73a6f2');
    } else if (c === 'T') {
      R(ox, oy, T, T, '#145926'); R(ox + 2, oy + 1, 12, 9, '#1f8033'); R(ox + 5, oy + 3, 4, 3, '#33a047'); R(ox + 6, oy + 10, 4, 6, '#66421f');
    } else if (c === '#') {
      R(ox + 1, oy + 3, 14, 12, '#73737f'); R(ox + 3, oy + 3, 8, 3, '#a6a6b3'); R(ox + 1, oy + 12, 14, 3, '#4d4d59');
    }
  }
}

function drawPlayer(cx, cy) {
  const p = G.player;
  const lift = p.launching ? Math.sin(Math.PI * Math.min(p.lp, 1)) * 28 : 0;
  const x = p.x - cx, y = p.y - cy;
  R(x - 5, y + 5, 10, 2, 'rgba(0,0,0,.3)');
  if (p.inv > 0 && Math.floor(p.inv * 20) % 2 === 0 && !p.launching) return;
  const o = y - lift;
  const skin = p.zombie ? '#8cbf80' : '#fac799', tunic = p.zombie ? '#73409c' : '#3380d9';
  const st = Math.floor(p.walk) % 2;
  R(x - 4, o + 3 + st, 3, 3, '#59381a'); R(x + 1, o + 3 + (1 - st), 3, 3, '#59381a');
  R(x - 5, o - 3, 10, 7, tunic); R(x - 5, o + 1, 10, 1, '#664019');
  R(x - 4, o - 9, 8, 7, skin);
  R(x - 5, o - 11, 10, 4, '#9999ad'); R(x - 7, o - 13, 2, 4, '#f2ebcc'); R(x + 5, o - 13, 2, 4, '#f2ebcc');
  const back = p.fy < -0.5 && Math.abs(p.fx) < 0.3;
  if (!back) {
    const ex = p.fy <= 0.5 ? Math.max(-1, Math.min(1, p.fx)) : 0;
    R(x - 3 + ex, o - 6, 1, 2, '#1a1a1a'); R(x + 2 + ex, o - 6, 1, 2, '#1a1a1a');
  }
}

function drawPenguin(e, cx, cy) {
  const s = e.boss ? 2 : 1, x = e.x - cx, y = e.y - cy;
  ctx.save(); ctx.translate(Math.round(x), Math.round(y)); ctx.scale(s, s);
  R(-6, 5, 12, 2, 'rgba(0,0,0,.3)');
  const sw = Math.round(Math.sin(e.wob));
  let body = '#1a1a38';
  if (e.flash > 0) body = '#fff'; else if (e.boss && e.st === 'wind') body = '#8c1a1a';
  R(-5 + sw, -6, 10, 12, body); R(-3 + sw, -2, 6, 7, '#f2f2ff'); R(-4 + sw, -5, 8, 3, body);
  R(-1 + sw, -3, 3, 2, '#ffa61a'); R(-3, 6, 2, 1, '#ffa61a'); R(1, 6, 2, 1, '#ffa61a');
  R(-3 + sw, -5, 2, 2, '#ff1a1a'); R(1 + sw, -5, 2, 2, '#ff1a1a');
  ctx.restore();
}

function drawJon(cx, cy) {
  const j = G.jon, x = Math.round(j.x - cx), y = Math.round(j.y - cy);
  ctx.save(); ctx.translate(x, y); ctx.rotate(j.spin);
  R(-6, -9, 12, 18, 'rgba(77,153,255,.18)');
  R(-1, -8, 2, 17, '#805224'); R(-1, -2, 2, 1, '#4d2e14'); R(-1, 2, 2, 1, '#4d2e14'); R(-1, 8, 2, 2, '#b3b3bf');
  const poly = (pts, fill, stroke) => {
    ctx.beginPath(); pts.forEach(([a, b], i) => i ? ctx.lineTo(a, b) : ctx.moveTo(a, b)); ctx.closePath();
    if (fill) { ctx.fillStyle = fill; ctx.fill(); } if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = 1; ctx.stroke(); }
  };
  poly([[1, -9], [10, -12], [12, -5], [10, 2], [1, -1]], '#d1e0f2');
  poly([[10, -12], [12, -5], [10, 2], [9, -5]], '#f2faff');
  poly([[-1, -8], [-4, -6], [-1, -4]], '#d1e0f2');
  poly([[1, -9], [10, -12], [12, -5], [10, 2], [1, -1]], null, '#40598c');
  R(3, -8, 3, 3, '#fff'); R(7, -8, 3, 3, '#fff'); R(4, -7, 1, 2, '#000'); R(8, -7, 1, 2, '#000'); R(4, -3, 5, 1, '#40598c');
  ctx.restore();
  if (j.qt > 0 && j.quip && G.state === 'play') {
    ctx.font = FONT; ctx.textAlign = 'left';
    const w = Math.ceil(ctx.measureText(j.quip).width) + 6, bx = Math.max(2, Math.min(VW - w - 2, x - w / 2)), by = y - 32;
    R(bx, by, w, 12, 'rgba(10,10,32,.85)'); ctx.fillStyle = '#ffffb3'; ctx.fillText(j.quip, bx + 3, by + 9);
  }
}

function wrap(text, maxW) {
  const out = []; let line = '';
  for (const w of text.split(' ')) {
    const t = line ? line + ' ' + w : w;
    if (ctx.measureText(t).width > maxW && line) { out.push(line); line = w; } else line = t;
  }
  if (line) out.push(line); return out;
}

const HEART = [' ## ## ', '#######', '#######', ' ##### ', '  ###  ', '   #   '];
function drawHud() {
  const p = G.player;
  for (let i = 0; i < p.max / 2; i++) {
    const full = Math.max(0, Math.min(2, p.hp - i * 2));
    HEART.forEach((row, yy) => [...row].forEach((ch, xx) => {
      if (ch !== '#') return;
      const lit = full === 2 || (full === 1 && xx < 4);
      R(8 + i * 9 + xx, 8 + yy, 1, 1, lit ? (p.zombie ? '#9a4dd9' : '#f22633') : '#40191f');
    }));
  }
  if (p.zombie) { ctx.font = FONT; ctx.fillStyle = '#c9a0f0'; ctx.textAlign = 'left'; ctx.fillText('ZOMBIE', 8, 26); }
  ctx.font = FONT; ctx.textAlign = 'left';
  if (G.talking) {
    R(8, 150, 240, 66, '#fff'); R(10, 152, 236, 62, '#0d0d33');
    ctx.fillStyle = '#ffe64d'; ctx.fillText(G.who, 16, 166);
    ctx.fillStyle = '#fff';
    let left = Math.floor(G.shown);
    wrap(G.text, 224).forEach((l, i) => {
      ctx.fillText(l.slice(0, Math.max(0, left)), 16, 180 + i * 10);
      left -= l.length + 1;
    });
    if (G.shown >= G.text.length && Math.floor(G.t * 3) % 2 === 0) ctx.fillText('▼', 232, 210);
  }
  if (G.banner) {
    R(0, 70, VW, 76, 'rgba(0,0,0,.8)'); ctx.textAlign = 'center'; ctx.fillStyle = '#fff';
    let y = 92;
    for (const part of G.banner.split('\n')) for (const l of wrap(part, 232)) { ctx.fillText(l, VW / 2, y); y += 14; }
    ctx.textAlign = 'left';
  }
}

function drawTitle() {
  R(0, 0, VW, VH, '#14121f');
  for (let i = 0; i < 40; i++) R((i * 53) % VW, (i * 97) % 120, 1, 1, i % 3 ? '#4a4570' : '#a79fc4');
  R(0, 150, VW, 74, '#1b3a6b'); R(0, 150, VW, 2, '#73a6f2');
  ctx.textAlign = 'center'; ctx.font = '20px "Press Start 2P", ui-monospace, Menlo, monospace';
  ctx.fillStyle = '#8fd0ff'; ctx.fillText('JÖNTUKA', VW / 2, 70);
  ctx.font = FONT; ctx.fillStyle = '#f3ecd2'; ctx.fillText('A VIKING TALE', VW / 2, 92);
  ctx.fillStyle = '#a79fc4'; ctx.fillText('a game by Owen', VW / 2, 110);
  if (Math.floor(G.t * 2) % 2 === 0) { ctx.fillStyle = '#ffd84a'; ctx.fillText('PRESS Z OR CLICK', VW / 2, 190); }
  ctx.textAlign = 'left';
  G.jon = G.jon || { x: 0, y: 0, mode: 'follow', spin: 0, qt: 0, quip: '', t: 0 };
  const j = { ...G.jon, x: VW / 2 + 70 + Math.sin(G.t * 2) * 3, y: 128, spin: Math.sin(G.t * 1.5) * 0.3, qt: 0 };
  const save = G.jon; G.jon = j; drawJon(0, 0); G.jon = save;
}

function render() {
  ctx.clearRect(0, 0, VW, VH);
  if (G.state === 'title') { drawTitle(); return; }
  const p = G.player;
  const cx = Math.round(Math.max(0, Math.min(COLS * T - VW, p.x - VW / 2)));
  const cy = Math.round(Math.max(0, Math.min(ROWS * T - VH, p.y - VH / 2)));
  drawMap(cx, cy);
  const things = [...G.enemies.map(e => ({ y: e.y, f: () => drawPenguin(e, cx, cy) })), { y: p.y, f: () => drawPlayer(cx, cy) }];
  things.sort((a, b) => a.y - b.y).forEach(t => t.f());
  drawJon(cx, cy);
  drawHud();
}

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  update(dt); render();
  for (const k in edge) edge[k] = false;
  requestAnimationFrame(frame);
}
(document.fonts && document.fonts.load ? document.fonts.load('8px "Press Start 2P"').catch(() => {}) : Promise.resolve())
  .then(() => requestAnimationFrame(t => { last = t; frame(t); }));
window.__game = G;
</script>
