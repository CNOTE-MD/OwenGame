<style>
  /* Layout: one centered 8:7 game screen, a short key legend under it, touch pad only on touch devices. */
  :root {
    --bg: #14121f;
    --panel: #221d38;
    --ink: #f3ecd2;
    --muted: #a79fc4;
    --axe: #8fd0ff;
    --gold: #ffd84a;
    --pixel: "Press Start 2P", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    color-scheme: dark;
  }
  html, body { background: var(--bg); color: var(--ink); }
  body { margin: 0; padding-inline: 16px; padding-block: 16px 24px; font-family: var(--pixel); font-size: 10px; line-height: 1.7; }
  main { max-width: 768px; margin-inline: auto; display: flex; flex-direction: column; gap: 14px; }
  .screen { position: relative; width: 100%; aspect-ratio: 8 / 7; background: #000; border: 3px solid var(--panel); outline: 2px solid var(--axe); }
  canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; image-rendering: crisp-edges; touch-action: none; }
  .legend { display: flex; flex-wrap: wrap; gap: 8px 20px; color: var(--muted); }
  .legend b { color: var(--gold); font-weight: normal; }
  .pad { display: none; justify-content: space-between; align-items: center; gap: 16px; user-select: none; -webkit-user-select: none; }
  @media (pointer: coarse) { .pad { display: flex; } }
  .dpad { display: grid; grid-template-columns: repeat(3, 56px); grid-template-rows: repeat(3, 56px); gap: 4px; }
  .btn { background: var(--panel); color: var(--ink); border: 2px solid var(--axe); font-family: var(--pixel); font-size: 12px; touch-action: none; border-radius: 4px; }
  .btn:active, .btn.on { background: var(--axe); color: var(--bg); }
  .btn:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
  .ab { display: grid; grid-template-columns: repeat(2, 76px); gap: 10px; }
  .ab .btn { width: 76px; height: 56px; border-radius: 28px; font-size: 9px; }
</style>
<main>
  <div class="screen"><canvas id="g" width="256" height="224" tabindex="0" aria-label="Jöntuka game screen"></canvas></div>
  <div class="legend">
    <span><b>Arrows / WASD</b> move</span>
    <span><b>Z / Space</b> swing Jon</span>
    <span><b>X / Shift</b> throw Jon</span>
    <span><b>C</b> Thunder Strike</span>
    <span><b>Enter</b> gear and quest</span>
    <span><b>M</b> all sound</span>
    <span><b>N</b> music</span>
  </div>
  <div class="pad" aria-label="Touch controls">
    <div class="dpad">
      <span></span><button class="btn" data-a="up" aria-label="Up">▲</button><span></span>
      <button class="btn" data-a="left" aria-label="Left">◀</button><span></span><button class="btn" data-a="right" aria-label="Right">▶</button>
      <span></span><button class="btn" data-a="down" aria-label="Down">▼</button><span></span>
    </div>
    <div class="ab">
      <button class="btn" data-a="menu" aria-label="Gear menu">GEAR</button>
      <button class="btn" data-a="c" aria-label="Thunder Strike">RUNE</button>
      <button class="btn" data-a="b" aria-label="Throw Jon">THROW</button>
      <button class="btn" data-a="a" aria-label="Swing Jon or talk">SWING</button>
    </div>
  </div>
</main>

const Sound = {
  ac: null, muted: false,
  unlock() { try { if (!this.ac) this.ac = new (window.AudioContext || window.webkitAudioContext)(); if (this.ac.state === 'suspended') this.ac.resume(); } catch (e) { this.ac = null; } },
  tone(seq, vol = 0.08) {
    if (this.muted || !this.ac) return;
    let t = this.ac.currentTime;
    for (const [f, d, type = 'square', f2] of seq) {
      if (f > 0) {
        const o = this.ac.createOscillator(), g = this.ac.createGain();
        o.type = type; o.frequency.setValueAtTime(f, t);
        if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
        g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0008, t + d);
        o.connect(g).connect(this.ac.destination); o.start(t); o.stop(t + d + 0.02);

    }
  },
  noise(d, vol = 0.12, lp = 1200) {

    const n = Math.floor(this.ac.sampleRate * d), buf = this.ac.createBuffer(1, n, this.ac.sampleRate), ch = buf.getChannelData(0);
    for (let i = 0; i < n; i++) ch[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const s = this.ac.createBufferSource(), f = this.ac.createBiquadFilter(), g = this.ac.createGain();

    s.buffer = buf; s.connect(f).connect(g).connect(this.ac.destination); s.start();
  },
  play(name) {

      case 'hurt': this.tone([[420, 0.18, 'sawtooth', 90]], 0.07); break;

      case 'coin': this.tone([[1320, 0.05], [1980, 0.12]], 0.05); break;
      case 'heart': this.tone([[880, 0.05], [1175, 0.08]], 0.05); break;

      case 'secret': this.tone([[784, 0.09], [740, 0.09], [622, 0.09], [440, 0.09], [415, 0.09], [659, 0.09], [831, 0.09], [1047, 0.3]], 0.06); break;
      case 'door': this.tone([[200, 0.12, 'square', 420]], 0.06); break;

const R = (x, y, w, h, c) => { ctx.fillStyle = c; ctx.fillRect(Math.round(x), Math.round(y), w, h); };
function poly(pts, fill, stroke) {
  ctx.beginPath(); pts.forEach(([a, b], i) => i ? ctx.lineTo(a, b) : ctx.moveTo(a, b)); ctx.closePath();
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = 1; ctx.stroke(); }
}
function text(s, x, y, color = '#fff', align = 'left', shadow = true) {
  ctx.font = FONT; ctx.textAlign = align;
  if (shadow) { ctx.fillStyle = '#000'; ctx.fillText(s, x + 1, y + 1); }
  ctx.fillStyle = color; ctx.fillText(s, x, y);
}
function wrap(s, maxW) {
  ctx.font = FONT;
  const out = []; let line = '';
  for (const w of s.split(' ')) {
    const t = line ? line + ' ' + w : w;
    if (ctx.measureText(t).width > maxW && line) { out.push(line); line = w; } else line = t;
  }
  if (line) out.push(line);
  return out;
}
const hash = (x, y) => Math.floor(Math.abs(Math.sin(x * 12.9898 + y * 78.233) * 43758.5453)) % 100;
const HEART = [' ## ## ', '#######', '#######', ' ##### ', '  ###  ', '   #   '];
function drawHeart(x, y, fill, color = '#f22633') {
  HEART.forEach((row, yy) => [...row].forEach((ch, xx) => {
    if (ch !== '#') return;
    const lit = fill >= 1 || (fill > 0 && xx < 4);
    R(x + xx, y + yy, 1, 1, lit ? color : '#3a1820');
  }));
}

// Music: plays music/score.json (inlined as SCORE) with a small Web Audio band.
// Bass, distorted guitar, saw lead, pads, plucks, bells, flute, and a drum kit with toms.

const Music = {
  on: true, name: null, bus: null, ev: null, len: 0, start: 0, idx: 0, cache: {}, noise: null, dist: null,

  midiFreq(tok) {
    const n = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 }[tok[0]];
    const acc = tok[1] === '#' ? 1 : tok[1] === 'b' ? -1 : 0, oct = parseInt(tok.slice(acc ? 2 : 1), 10);
    return 440 * Math.pow(2, ((oct + 1) * 12 + n + acc - 69) / 12);
  },
  compile(id) {
    if (this.cache[id]) return this.cache[id];
    const tr = SCORE[id], step = 30 / tr.bpm, ev = [];
    let t0 = 0;
    for (const sid of tr.order) {
      const sec = tr.sections[sid], n = sec.steps;
      let bars = 0;
      for (const line in sec) {
        if (line === 'steps') continue;
        if (/^[a-z]$/.test(line)) {
          const chars = sec[line].replace(/[|\s]/g, '');
          bars = chars.length / n;
          [...chars].forEach((c, i) => { if (c !== '.') ev.push({ t: t0 + i * step, inst: 'drum', kind: line === 't' ? 't' + c : line, acc: c === 'X' }); });
        } else {
          const toks = sec[line].split('|').flatMap(b => b.trim().split(/\s+/));
          bars = toks.length / n;
          toks.forEach((tok, i) => {
            if (tok === '-' || tok === '.') return;
            let hold = 1; while (toks[i + hold] === '-') hold++;
            ev.push({ t: t0 + i * step, d: hold * step, inst: line, f: tok.split('+').map(x => this.midiFreq(x)) });
          });
        }
      }
      t0 += bars * n * step;
    }
    ev.sort((a, b) => a.t - b.t);
    return (this.cache[id] = { ev, len: t0, gain: tr.gain || 1 });
  },

  want(id) {
    const ac = Sound.ac;
    if (!ac) return;
    if (!this.on || Sound.muted) id = null;
    if (id === this.name) return;
    const now = ac.currentTime;
    if (this.bus) { const old = this.bus; old.gain.cancelScheduledValues(now); old.gain.setValueAtTime(old.gain.value, now); old.gain.linearRampToValueAtTime(0, now + 0.7); setTimeout(() => old.disconnect(), 900); }
    this.name = id; this.bus = null;
    if (!id) return;
    const c = this.compile(id);
    this.ev = c.ev; this.len = c.len; this.idx = 0; this.start = now + 0.15;
    this.bus = ac.createGain(); this.bus.gain.setValueAtTime(0, now); this.bus.gain.linearRampToValueAtTime(0.32 * c.gain, now + 0.8);
    this.bus.connect(ac.destination);
  },

  tick() {
    const ac = Sound.ac;
    if (!ac || !this.bus || !this.ev) return;
    const now = ac.currentTime, ahead = now + 0.25;
    // after the tab was hidden, rejoin at the start of the loop instead of firing a backlog
    if (this.start + (this.ev[this.idx] ? this.ev[this.idx].t : this.len) < now - 0.3) { this.start = now + 0.1; this.idx = 0; }
    while (true) {
      if (this.idx >= this.ev.length) { this.idx = 0; this.start += this.len; }
      const e = this.ev[this.idx], at = this.start + e.t;
      if (at > ahead) break;
      if (at >= now - 0.05) this.note(e, Math.max(at, now));
      this.idx++;
    }
  },

  // ---------- instruments ----------
  env(g, t, a, peak, d, sus, rel, end) {
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(peak, t + a);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0001, peak * sus), t + a + d);
    g.gain.setValueAtTime(Math.max(0.0001, peak * sus), end); g.gain.exponentialRampToValueAtTime(0.0001, end + rel);
  },
  osc(type, f, t, end, detune = 0) { const o = Sound.ac.createOscillator(); o.type = type; o.frequency.setValueAtTime(f, t); o.detune.setValueAtTime(detune, t); o.start(t); o.stop(end + 0.6); return o; },
  note(e, t) {
    const ac = Sound.ac, out = this.bus;
    if (e.inst === 'drum') return this.drum(e, t);
    const end = t + e.d * 0.92;
    for (const f of e.f) {
      const g = ac.createGain(), flt = ac.createBiquadFilter();
      flt.type = 'lowpass'; g.connect(out); flt.connect(g);
      switch (e.inst) {
        case 'bass': {   // round-wound pick bass: saw + square, filter that snaps shut
          this.osc('sawtooth', f, t, end).connect(flt); this.osc('square', f / 2, t, end, 4).connect(flt);
          flt.frequency.setValueAtTime(2200, t); flt.frequency.exponentialRampToValueAtTime(500, t + 0.18); flt.Q.value = 4;
          this.env(g, t, 0.005, 0.55, 0.2, 0.55, 0.08, end); break; }
        case 'gtr': {    // distorted power chords
          const sh = this.shaper(), o1 = this.osc('sawtooth', f, t, end, -9), o2 = this.osc('sawtooth', f, t, end, 9);
          o1.connect(sh); o2.connect(sh); sh.connect(flt); flt.frequency.value = 2600; flt.Q.value = 1;
          this.env(g, t, 0.004, 0.13, 0.1, 0.7, 0.06, end); break; }
        case 'lead': {   // two detuned saws with delayed vibrato
          const o1 = this.osc('sawtooth', f, t, end, -7), o2 = this.osc('sawtooth', f, t, end, 7);
          const lfo = ac.createOscillator(), lg = ac.createGain(); lfo.frequency.value = 5.5; lg.gain.setValueAtTime(0, t); lg.gain.linearRampToValueAtTime(12, t + 0.35);
          lfo.connect(lg); lg.connect(o1.detune); lg.connect(o2.detune); lfo.start(t); lfo.stop(end + 0.6);
          o1.connect(flt); o2.connect(flt); flt.frequency.setValueAtTime(1200, t); flt.frequency.linearRampToValueAtTime(3400, t + 0.08); flt.Q.value = 2;
          this.env(g, t, 0.02, 0.2, 0.3, 0.75, 0.15, end); break; }
        case 'pad':
          this.osc('triangle', f, t, end, -5).connect(flt); this.osc('sawtooth', f, t, end, 6).connect(flt); flt.frequency.value = 900;
          this.env(g, t, 0.35, 0.12, 0.5, 0.8, 0.6, end); break;
        case 'pluck':
          this.osc('triangle', f, t, end).connect(flt); this.osc('square', f * 2, t, end).connect(flt);
          flt.frequency.setValueAtTime(3000, t); flt.frequency.exponentialRampToValueAtTime(700, t + 0.25);
          this.env(g, t, 0.003, 0.22, 0.35, 0.2, 0.2, end); break;
        case 'bell':
          this.osc('sine', f, t, end).connect(flt); this.osc('sine', f * 2.76, t, end).connect(flt); flt.frequency.value = 6000;
          this.env(g, t, 0.003, 0.25, 0.9, 0.25, 1.2, end); break;
        case 'flute':
          this.osc('sine', f, t, end).connect(flt); this.osc('triangle', f, t, end, 3).connect(flt); flt.frequency.value = 2400;
          this.env(g, t, 0.06, 0.28, 0.2, 0.85, 0.15, end); break;
      }
    }
  },
  shaper() {
    if (!this.curve) { const n = 1024, c = new Float32Array(n); for (let i = 0; i < n; i++) { const x = i / n * 2 - 1; c[i] = Math.tanh(x * 6); } this.curve = c; }
    const s = Sound.ac.createWaveShaper(); s.curve = this.curve; s.oversample = '2x'; return s;
  },
  noiseBuf() {
    if (!this.noise) { const ac = Sound.ac, n = ac.sampleRate, b = ac.createBuffer(1, n, n), d = b.getChannelData(0); for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1; this.noise = b; }
    return this.noise;
  },
  hit(t, dur, hp, lp, vol) {
    const ac = Sound.ac, s = ac.createBufferSource(), f1 = ac.createBiquadFilter(), f2 = ac.createBiquadFilter(), g = ac.createGain();
    s.buffer = this.noiseBuf(); f1.type = 'highpass'; f1.frequency.value = hp; f2.type = 'lowpass'; f2.frequency.value = lp;
    s.connect(f1); f1.connect(f2); f2.connect(g); g.connect(this.bus);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.05);
  },
  thump(t, f0, f1, dur, vol, type = 'sine') {
    const ac = Sound.ac, o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(this.bus); o.start(t); o.stop(t + dur + 0.05);
  },
  drum(e, t) {
    const a = e.acc ? 1.3 : 1;
    switch (e.kind) {
      case 'k': this.thump(t, 140, 42, 0.16, 0.9 * a); break;
      case 's': this.hit(t, 0.14, 1200, 9000, 0.35 * a); this.thump(t, 220, 160, 0.06, 0.25 * a, 'triangle'); break;
      case 'r': this.hit(t, 0.03, 2500, 9000, 0.18); this.thump(t, 900, 700, 0.02, 0.12, 'square'); break;
      case 'h': this.hit(t, 0.035, 7000, 14000, 0.09 * a); break;
      case 'o': this.hit(t, 0.18, 6000, 14000, 0.09); break;
      case 'c': this.hit(t, 1.1, 3500, 14000, 0.16 * a); break;
      case 'th': this.thump(t, 260, 170, 0.22, 0.55); break;
      case 'tm': this.thump(t, 190, 120, 0.25, 0.55); break;
      case 'tl': this.thump(t, 130, 80, 0.3, 0.6); break;
    }
  },
};

// which piece fits what is on screen
function musicFor() {
  const st = G.state;
  if (st === 'title') return 'title';

function enterScreen() {

  G.roomEnemies = G.ents.some(e => e.enemy);

  G.roomEnemies = false;

  if (G.map.dungeon) setFlag(key);

// ---------- factory ----------
function makeEnt(d, x, y) {
  const s = G.save;
  const base = { x, y, def: d, kind: d.t };
  switch (d.t) {
    case 'start': return null;
    case 'runestone': return { ...base, solid: true, talk: true };
    case 'sign': case 'plaque': return { ...base, solid: true, talk: true };
    case 'sealed': case 'cargo': return { ...base, talk: true };
    case 'npc': return { ...base, solid: true, talk: true, id: d.id, bob: Math.random() * 6 };
    case 'shop': return { ...base, talk: true, item: d.item, price: d.price };
    case 'chest': return { ...base, solid: true, talk: true, open: !!s.flags['chest:' + d.id] };
    case 'piece': case 'container': return s.flags['got:' + d.id] ? null : { ...base, kind: 'pickup', what: d.t, id: d.id, permanent: true };
    case 'warp': return { ...base, portal: !!d.portal };
    case 'flight': return { ...base };
    case 'door': return { ...base, talk: true };
    case 'grave': return { ...base, talk: true };
    case 'stairs': return s.flags['grave_open'] ? { ...base, kind: 'warp' } : null;
    case 'qitem': return (s.flags['got:' + d.id] || (d.needs && !s.flags[d.needs])) ? null : { ...base, kind: 'pickup', what: 'qitem', id: d.id, underBush: !!d.underBush, permanent: true };
    case 'switch': return { ...base, solid: true, hittable: true, id: d.id, cd: 0 };
    default: return makeEnemy(d.t, x, y);
  }
}
const ENEMY = {
  penguin: { hp: 2, r: 6, touch: 1, speed: 40 },
  draugr: { hp: 3, r: 6, touch: 1, speed: 18, shield: true },
  wisp: { hp: 1, r: 5, touch: 1, speed: 26, fly: true },
  bat: { hp: 1, r: 5, touch: 1, speed: 75, fly: true },
  knight: { hp: 5, r: 10, touch: 2, speed: 28, shield: true, boss: true },
  king: { hp: 10, r: 16, touch: 2, speed: 26, boss: true },
};
function makeEnemy(type, x, y) {
  const d = ENEMY[type];
  if (!d) return null;
  return { x, y, kind: 'enemy', enemy: true, alive: true, type, ...d, max: d.hp, flash: 0, kx: 0, ky: 0, t: Math.random() * 2,
    st: type === 'king' || type === 'knight' ? 'intro' : 'idle', fx: 0, fy: 1, wob: Math.random() * 6, tx: x, ty: y, bounces: 0, summoned: false };
}

// ---------- particles ----------
function puff(x, y, color = '#fff', n = 7) {
  for (let i = 0; i < n; i++) { const a = Math.random() * Math.PI * 2, s = rnd(20, 60); G.fx.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, t: 0, life: 0.4, color, size: 2 }); }
}
function updateFx(dt) {
  for (const f of G.fx) { f.t += dt; f.x += f.vx * dt; f.y += f.vy * dt; if (f.grav) f.vy += f.grav * dt; else { f.vx *= 0.9; f.vy *= 0.9; } }
  G.fx = G.fx.filter(f => f.t < f.life);
}
function drawFx() {
  for (const f of G.fx) {
    if (f.kind === 'text') { text(f.label, f.x - G.cam.x, f.y - G.cam.y - f.t * 12, f.color, 'center'); continue; }
    if (f.kind === 'poof') { const img = POOF[Math.min(3, Math.floor(f.t / f.life * 4))], s = f.scale; ctx.drawImage(img, Math.round(f.x - G.cam.x - 12 * s), Math.round(f.y - G.cam.y - 12 * s), 24 * s, 24 * s); continue; }
    if (f.kind === 'ripple') { if (f.t < 0) continue; const k = f.t / f.life; ctx.strokeStyle = `rgba(220,240,255,${1 - k})`; ctx.lineWidth = 1; ctx.beginPath(); ctx.ellipse(Math.round(f.x - G.cam.x), Math.round(f.y - G.cam.y + 4), 4 + k * 14, 2 + k * 6, 0, 0, Math.PI * 2); ctx.stroke(); continue; }
    if (f.kind === 'leaf') { R(f.x - G.cam.x, f.y - G.cam.y, 2, 1, f.color); R(f.x - G.cam.x + 1, f.y - G.cam.y + 1, 1, 1, '#205818'); continue; }
    R(f.x - G.cam.x, f.y - G.cam.y, f.size, f.size, f.color);
  }
}
function ripple(x, y, delay = 0) { G.fx.push({ kind: 'ripple', x, y, vx: 0, vy: 0, t: -delay, life: 0.6 }); }
function leaves(x, y, colors) {
  for (let i = 0; i < 8; i++) G.fx.push({ kind: 'leaf', x: x + rnd(-5, 5), y: y + rnd(-5, 3), vx: rnd(-50, 50), vy: rnd(-90, -30), grav: 260, t: 0, life: 0.55, color: pick(colors) });
}
function floatText(x, y, label, color = '#fff') { G.fx.push({ kind: 'text', x, y, vx: 0, vy: 0, t: 0, life: 0.9, label, color }); }

// ---------- Owen ----------
function makePlayer() {
  return { x: 0, y: 0, vx: 0, vy: 0, fx: 0, fy: 1, hp: G.save.hp, inv: 0, cd: 0, kx: 0, ky: 0, walk: 0,
    launching: false, lp: 0, from: null, to: null, falling: 0, bump: 0, hold: null };
}
const facing4 = p => Math.abs(p.fx) > Math.abs(p.fy) ? { x: Math.sign(p.fx), y: 0 } : { x: 0, y: Math.sign(p.fy) || 1 };

function updatePlayer(dt) {
  const p = G.player, s = G.save;
  p.inv = Math.max(0, p.inv - dt); p.cd = Math.max(0, p.cd - dt); p.bump = Math.max(0, p.bump - dt);
  if (p.falling > 0) {
    p.falling -= dt;
    if (p.falling <= 0) {
      p.x = G.entry.x; p.y = G.entry.y; p.vx = p.vy = 0;
      hurtPlayer(1, null, true);
      if (!flag('tip:pit')) { setFlag('tip:pit'); say(STORY.pit_first); }
    }
    return;
  }
  if (p.launching) {
    p.lp += dt / 0.7;
    const k = Math.min(p.lp, 1);
    p.x = p.from.x + (p.to.x - p.from.x) * k; p.y = p.from.y + (p.to.y - p.from.y) * k;
    if (p.lp >= 1) { p.launching = false; puff(p.x, p.y + 6, '#e8e0c8', 6); }
    return;
  }
  const v = inputVec();
  p.moving = !!(v.x || v.y);
  if (p.moving) { p.fx = v.x; p.fy = v.y; p.walk += dt * 14; }
  const onIce = tileAt(p.x, p.y) === 'i';
  const spd = 72 * G.st.speed;
  if (onIce) { const k = Math.min(1, 2.2 * dt); p.vx += (v.x * spd * 1.1 - p.vx) * k; p.vy += (v.y * spd * 1.1 - p.vy) * k; }
  else { p.vx = v.x * spd; p.vy = v.y * spd; }
  const hit = tryMove(p, p.vx * dt, p.vy * dt, 5, 'player');
  if (onIce) {
    if (hit.hitX) p.vx *= -0.3; if (hit.hitY) p.vy *= -0.3;
    // skidding throws up frost
    if (Math.hypot(v.x * spd - p.vx, v.y * spd - p.vy) > 45 && Math.hypot(p.vx, p.vy) > 15 && Math.random() < 0.5)
      G.fx.push({ x: p.x + rnd(-3, 3), y: p.y + 6, vx: -p.vx * 0.2 + rnd(-10, 10), vy: rnd(-20, -5), t: 0, life: 0.35, color: Math.random() < 0.5 ? '#ffffff' : '#cfefff', size: 1 });
  }
  const kl = Math.hypot(p.kx, p.ky);
  if (kl > 1) { tryMove(p, p.kx * dt, p.ky * dt, 5, 'player'); const nl = Math.max(0, kl - 520 * dt); p.kx *= nl / kl; p.ky *= nl / kl; }

  // doors that need keys
  if (v.x || v.y) {
    const f = facing4(p), c = tileAt(p.x + f.x * 9, p.y + f.y * 9);
    if ((c === 'L' || c === 'K') && p.bump <= 0) tryUnlock(Math.floor((p.x + f.x * 9) / T), Math.floor((p.y + f.y * 9) / T), c);
  }
  const here = tileAt(p.x, p.y);
  if (here === '~') {
    p.launching = true; p.lp = 0; p.from = { x: p.x, y: p.y }; p.to = nearestDry(p.x, p.y); p.inv = 1.2;
    ripple(p.x, p.y); ripple(p.x, p.y, 0.15);
    G.jon.mode = 'follow'; Sound.play('splash'); puff(p.x, p.y, '#bfe0ff', 10);
    floatText(p.x, p.y - 20, 'Lady of the Lake!', '#bfe0ff');
    return;
  }
  if (here === 'v') { p.falling = 0.6; Sound.play('fall'); return; }

  // warps and triggers
  for (const e of G.ents) {
    if (e.kind === 'warp' && Math.abs(e.x - p.x) < 8 && Math.abs(e.y - p.y) < 8) return startWarp(e.def.to, e.def.dest);
    if (e.kind === 'flight' && Math.abs(e.x - p.x) < 9 && Math.abs(e.y - p.y) < 10) return startFlight();
  }

  // actions
  if (p.cd > 0) return;
  if (just('a')) {
    const f = facing4(p), px = p.x + f.x * 13, py = p.y + f.y * 13;
    const target = G.ents.find(e => e.talk && Math.abs(e.x - px) < 11 && Math.abs(e.y - py) < 11);
    if (target) return interact(target);
    if (tileAt(px, py) === 'D' && G.mapId === 'overworld') return say(STORY.house);
    if (G.jon.mode === 'follow') { G.jon.swing(Math.atan2(p.fy, p.fx)); Sound.play('swing'); }
  } else if (just('b') && G.jon.mode === 'follow') {
    G.jon.throw(p.x, p.y, p.fx, p.fy); Sound.play('throw');
  } else if (just('c')) {
    if (!s.items.thunder) floatText(p.x, p.y - 18, 'No rune yet', '#aab');
    else if (s.rune < RUNE_MAX) { floatText(p.x, p.y - 18, 'Rune not full', '#7fd4ff'); }
    else startThunder();
  }
}

function tryUnlock(tx, ty, c) {
  const s = G.save, p = G.player;
  p.bump = 0.6;
  if (c === 'L' && !(s.keys[G.mapId] > 0)) return say(STORY.locked);
  if (c === 'K' && !s.bigkeys[G.mapId]) return say(STORY.bossdoor);
  if (c === 'L') s.keys[G.mapId]--;
  // open the whole door (both tiles, both sides)
  const q = [[tx, ty]], seen = new Set();
  while (q.length) {
    const [x, y] = q.pop(); const k = x + ',' + y;
    if (seen.has(k) || tile(x, y) !== c) continue;
    seen.add(k); setTile(x, y, '_'); setFlag(`open:${G.mapId}:${x},${y}`);
    q.push([x + 1, y], [x - 1, y], [x, y + 1], [x, y - 1]);
  }
  Sound.play('door'); puff(tx * T + 8, ty * T + 8, '#ffd84a');
}

function hurtPlayer(dmg, from, force) {
  const p = G.player, s = G.save;
  if (!force && (p.inv > 0 || p.launching || p.falling > 0 || G.state !== 'play')) return;
  if (!force && G.st.armor > 0 && Math.random() < Math.min(0.6, G.st.armor * 0.1)) { p.inv = 0.4; floatText(p.x, p.y - 18, 'BLOCK', '#9fd0ff'); Sound.play('clank'); return; }
  p.hp -= dmg; p.inv = 1; Sound.play('hurt'); G.shake = 0.15;
  if (from) { const d = Math.hypot(p.x - from.x, p.y - from.y) || 1; p.kx = (p.x - from.x) / d * 170; p.ky = (p.y - from.y) / d * 170; }
  if (p.hp > 0) return;
  // A Link to the Past death: Owen spins in place, then juice, voodoo or game over
  p.hp = 0; p.kx = p.ky = 0; G.state = 'dying'; G.dieT = 0; G.jon.mode = 'follow'; Sound.play('fall');
}
function updateDying(dt) {
  const p = G.player;
  G.dieT += dt;
  const dirs = [[0, 1], [1, 0], [0, -1], [-1, 0]], i = Math.floor(G.dieT / 0.07) % 4;
  if (G.dieT < 0.85) { p.fx = dirs[i][0]; p.fy = dirs[i][1]; return; }
  p.fx = 0; p.fy = 1;
  finishDeath();
}
function finishDeath() {
  const p = G.player, s = G.save;
  G.state = 'play';
  if (s.potions > 0) { s.potions--; p.hp = s.maxHp; p.inv = 2; Sound.play('heart'); return say(STORY.juice); }
  if (G.mode === 'arena') return arenaOver(false);
  if (s.voodoo) { s.voodoo = false; p.hp = s.maxHp; p.inv = 2.5; puff(p.x, p.y, '#9a4dd9', 16); Sound.play('secret'); return say(STORY.revive); }
  G.state = 'over'; G.menuSel = 0;
}

function interact(e) {
  const s = G.save, p = G.player;
  p.cd = 0.2;
  switch (e.kind) {
    case 'sign': return say(STORY.signs[e.def.text] || [['', '...']]);
    case 'sealed': return say(STORY.signs[e.def.text]);
    case 'plaque': return say(STORY.plaque, () => setFlag('read_plaque'));
    case 'door': return startWarp(e.def.to, e.def.dest);
    case 'grave':
      if (flag('grave_open')) return say(STORY.grave_open);
      return say(STORY.grave, () => {
        setFlag('grave_open');
        const tx = Math.floor(e.x / T), ty = Math.floor(e.y / T);
        setTile(tx, ty, '>'); setFlag(`tile:${G.mapId}:${tx},${ty}:>`);
        G.ents = G.ents.filter(o => o !== e);
        G.ents.push({ kind: 'warp', x: e.x, y: e.y, def: MAPS[G.mapId].ents.find(d => d.t === 'stairs') });
        Sound.play('secret'); G.shake = 0.3; puff(e.x, e.y, '#c8c8d8', 14); writeSave();
      });
    case 'cargo':
      if (!flag('cargo')) { setFlag('cargo'); Sound.play('creep'); G.flash = 0.25; G.flashColor = '#5a0000'; return say(STORY.cargo); }
      return say(STORY.cargo_later);
    case 'runestone':
      p.hp = s.maxHp; s.voodoo = true; s.cp = { map: G.mapId, x: p.x, y: p.y }; writeSave(); Sound.play('save'); puff(e.x, e.y - 6, '#7fd4ff', 12);
      return say(STORY.saved);
    case 'npc': { const lines = npcLines(e.id), after = G.afterTalk; G.afterTalk = null; return say(lines, after); }
    case 'shop': return buy(e);
    case 'chest':
      if (e.open) return say([['', 'The chest is empty.']]);
      e.open = true; setFlag('chest:' + e.def.id);
      return giveItem(e.def.item);
  }
}

function npcLines(id) {
  if (id === 'astrid') {
    if (!flag('met_astrid')) { setFlag('met_astrid'); G.save.kr += 30; return [...STORY.astrid_1, ['', 'Astrid gave you 30 kroner.']]; }
    return flag('d1done') ? STORY.astrid_3 : STORY.astrid_2;
  }
  if (id === 'sven') {
    if (!flag('met_astrid')) return flag('got:hp_forest') ? STORY.sven_2 : STORY.sven_1;
    if (!flag('quest_sven')) { setFlag('quest_sven'); return STORY.sven_quest; }
    if (flag('got:ship') && !flag('sven_done')) {
      setFlag('sven_done'); G.save.kr += 30; G.save.potions = Math.min(3, G.save.potions + 1);
      return [...STORY.sven_thanks, ['', 'Sven gave you 30 kroner and a Lingonberry Juice!']];
    }
    if (!flag('sven_done')) return STORY.sven_waiting;
    return flag('got:hp_forest') ? STORY.sven_2 : STORY.sven_1;
  }
  if (id === 'bjarne') {
    if (!flag('quest_bjarne')) { setFlag('quest_bjarne'); return STORY.bjarne_quest; }
    if (flag('got:sheet') && !flag('bjarne_done')) {
      setFlag('bjarne_done');
      G.afterTalk = () => { setFlag('got:hp_bjarne'); giveItem('piece'); };
      return STORY.bjarne_thanks;
    }
    return flag('bjarne_done') ? STORY.bjarne_after : STORY.bjarne_waiting;
  }
  return STORY[id] || [['', '...']];
}

function buy(e) {
  const s = G.save, it = ITEMS[e.item];
  if (e.item === 'juice' && s.potions >= 3) return say([['Lars', 'You can only carry three bottles. Drink some first. Or die. Then it drinks itself.']]);
  if (s.kr < e.price) return say([['Lars', `${it.name} costs ${e.price} kroner. You have ${s.kr}. Cut more bushes!`]]);
  s.kr -= e.price; Sound.play('coin');
  applyItem(e.item);
  say([['Lars', `One ${it.name}. Takk!`], ...it.lines]);
}

const RUNE_MAX = 16;
function applyItem(id) {
  const s = G.save, p = G.player;
  switch (id) {
    case 'key': s.keys[G.mapId] = (s.keys[G.mapId] || 0) + 1; break;
    case 'bigkey': s.bigkeys[G.mapId] = true; break;
    case 'homing': s.items.homing = true; break;
    case 'thunder': s.items.thunder = true; s.rune = RUNE_MAX; break;
    case 'piece': s.pieces++; if (s.pieces >= 4) { s.pieces = 0; s.maxHp += 2; p.hp = s.maxHp; } break;
    case 'container': s.maxHp += 2; p.hp = s.maxHp; break;
    case 'kr20': s.kr += 20; break;
    case 'juice': s.potions++; break;
    case 'shard': s.rune = RUNE_MAX; break;
    case 'heart3': p.hp = s.maxHp; break;
    case 'sheet': case 'ship': break;
  }
}
function giveItem(id, after) {
  applyItem(id);
  G.player.hold = { id, t: 1.1 };
  G.state = 'hold'; Sound.play('item');
  G.afterHold = () => say(ITEMS[id].lines, () => { if (after) after(); writeSave(); });
}

// ---------- Jon ----------
function makeJon() {
  const j = { x: 0, y: 0, mode: 'follow', vx: 0, vy: 0, trav: 0, hit: [], t: 0, st: 0, base: 0, spin: 0, quip: '', qt: 0, nq: 8 };
  j.swing = a => { j.mode = 'swing'; j.st = 0; j.base = a; j.hit = []; };
  j.throw = (x, y, fx, fy) => {
    j.mode = 'out'; j.x = x; j.y = y; j.trav = 0; j.hit = [];
    const l = Math.hypot(fx, fy) || 1, sp = 200 * G.st.atk; j.vx = fx / l * sp; j.vy = fy / l * sp;
    j.target = G.save.items.homing ? findTarget(x, y, fx / l, fy / l) : null;
  };
  return j;
}
function findTarget(x, y, fx, fy) {
  let best = null, bd = 1e9;
  for (const e of G.ents) {
    if (!((e.enemy && e.alive) || e.hittable)) continue;
    const dx = e.x - x, dy = e.y - y, d = Math.hypot(dx, dy);
    if (d > 200) continue;
    const score = d - (dx * fx + dy * fy) * 0.6;   // prefer things in front
    if (score < bd) { bd = score; best = e; }
  }
  return best;
}
function updateJon(dt) {
  const j = G.jon, p = G.player;
  j.t += dt;
  const range = (G.save.items.homing ? 175 : 88) * G.st.range;
  if (j.mode === 'follow') {
    const tx = p.x + 10, ty = p.y - 14 + Math.sin(j.t * 3) * 2, k = Math.min(1, 8 * dt);
    j.x += (tx - j.x) * k; j.y += (ty - j.y) * k; j.spin = 0;
  } else if (j.mode === 'swing') {
    j.st += dt;
    const k = j.st / (0.2 / G.st.atk), a = j.base + (-1.3 + 2.6 * k);
    j.x = p.x + Math.cos(a) * 15; j.y = p.y + Math.sin(a) * 15; j.spin = a + Math.PI / 2;
    jonHits(1, 11, p, 'swing');
    cutAt(j.x, j.y);
    if (k >= 1) j.mode = 'follow';
  } else if (j.mode === 'out') {
    if (j.target && (j.target.alive || j.target.hittable) && G.ents.includes(j.target)) {
      const dx = j.target.x - j.x, dy = j.target.y - j.y, d = Math.hypot(dx, dy) || 1, sp = 210 * G.st.atk;
      const k = Math.min(1, 9 * dt); j.vx += (dx / d * sp - j.vx) * k; j.vy += (dy / d * sp - j.vy) * k;
    }
    j.x += j.vx * dt; j.y += j.vy * dt; j.trav += Math.hypot(j.vx, j.vy) * dt; j.spin += dt * 22;
    jonHits(1, 9, j, 'throw');
    if (cutAt(j.x, j.y) || j.trav > range || solidAt(j.x, j.y, 'jon')) { j.mode = 'back'; j.hit = []; }
  } else if (j.mode === 'back') {
    const dx = p.x - j.x, dy = p.y - j.y, d = Math.hypot(dx, dy) || 1;
    j.x += dx / d * 240 * G.st.atk * dt; j.y += dy / d * 240 * G.st.atk * dt; j.spin += dt * 22;
    jonHits(1, 9, j, 'throw');
    if (d < 9) j.mode = 'follow';
  }
  if (j.mode === 'out' || j.mode === 'back') {
    j.trail = (j.trail || []).concat([{ x: j.x, y: j.y, spin: j.spin }]).slice(-4);
  } else j.trail = [];
  if (j.mode === 'out' || j.mode === 'back') {
    for (const e of G.ents) if (e.kind === 'pickup' && dist(e, j) < 10) { e.x = j.x; e.y = j.y; }   // Jon fetches loot
  }
  j.nq -= dt; j.qt = Math.max(0, j.qt - dt);
  if (j.nq <= 0) { j.nq = rnd(12, 20); j.quip = pick(STORY.quips); j.qt = 2.5; }
}
function jonHits(dmg, reach, from, how) {
  const j = G.jon;
  for (const e of G.ents.slice()) {
    if (j.hit.includes(e)) continue;
    if (e.hittable && dist(j, e) < reach + 6) { j.hit.push(e); hitSwitch(e); if (how === 'throw') j.mode = 'back'; continue; }
    if (!e.enemy || !e.alive) continue;
    if (dist(j, e) < reach + e.r) {
      j.hit.push(e);
      const blockedHit = damageEnemy(e, rollDamage(dmg), from, how);
      if (blockedHit && how === 'throw') j.mode = 'back';
      else if (!blockedHit && G.mode === 'arena') arenaOnHit(e);
    }
  }
}
function cutAt(x, y) {
  const tx = Math.floor(x / T), ty = Math.floor(y / T), c = tile(tx, ty);

function damageEnemy(e, dmg, from, how) {

  const jonHit = how === 'swing' || how === 'throw';
  if (e.flash > 0.05 && jonHit) return false;
  const dx = from.x - e.x, dy = from.y - e.y, d = Math.hypot(dx, dy) || 1;
  // Shields block a hit from the front, but the block knocks the shield aside for a moment:
  // hit-hit always works, and hitting from the side or back works right away.

    Sound.play('clank'); puff(e.x + e.fx * 8, e.y + e.fy * 8, '#ffd84a', 4);
    e.guardDown = 1.1; e.kx = -dx / d * 110; e.ky = -dy / d * 110;
    floatText(e.x, e.y - 18, 'STAGGER!', '#ffd84a');
    return true;
  }
  if (e.type === 'king' && e.st !== 'daze' && how !== 'thunder') {
    if (jonHit) { Sound.play('clank'); floatText(e.x, e.y - 30, 'CLANK', '#ffd84a'); }
    return true;
  }
  if (e.type === 'king' && how === 'thunder') { e.st = 'daze'; e.t = 0; dmg = 2; }
  e.hp -= dmg; e.flash = 0.18; Sound.play('hit');
  if (G.mode === 'arena') floatText(e.x, e.y - 12, String(Math.round(dmg * 10) / 10), G.lastCrit ? '#ffd84a' : '#fff');
  const k = (e.boss ? 60 : 150) * G.st.knock; e.kx = -dx / d * k; e.ky = -dy / d * k;
  if (e.hp <= 0) killEnemy(e);

}

function updateEnemy(e, dt) {

  const p = G.player, dx = p.x - e.x, dy = p.y - e.y, d = Math.hypot(dx, dy) || 1;
  const who = e.fly ? 'flyer' : 'walker', mr = e.r * 0.6;

      else { if (e.t > 2) { e.t = 0; e.tx = e.x + rnd(-30, 30); e.ty = e.y + rnd(-30, 30); }
        const ax = e.tx - e.x, ay = e.ty - e.y, al = Math.hypot(ax, ay); if (al > 2) { e.fx = ax / al; e.fy = ay / al; tryMove(e, ax / al * 14 * dt, ay / al * 14 * dt, mr, who); } }

    case 'wisp': {

      tryMove(e, (dx / d * e.speed + Math.cos(a) * 30) * dt, (dy / d * e.speed + Math.sin(a * 1.3) * 30) * dt, mr, who);
      break; }
    case 'bat':
      if (e.t > 0.7) { e.t = 0; e.tx = p.x + rnd(-40, 40); e.ty = p.y + rnd(-40, 40); }
      { const ax = e.tx - e.x, ay = e.ty - e.y, al = Math.hypot(ax, ay) || 1; tryMove(e, ax / al * e.speed * dt, ay / al * e.speed * dt, mr, who); }
      break;
    case 'knight':
      if (e.st === 'intro') { if (G.state === 'play') { e.st = 'chase'; e.t = 0; } break; }
      if (e.st === 'chase') { e.turnT = (e.turnT || 0) + dt; if (e.turnT > 0.5) { e.turnT = 0; e.fx = dx / d; e.fy = dy / d; } tryMove(e, e.fx * e.speed * dt, e.fy * e.speed * dt, mr, who); if (e.t > 2.8) { e.st = 'wind'; e.t = 0; } }
      else if (e.st === 'wind') { e.fx = dx / d; e.fy = dy / d; if (e.t > 0.5) { e.st = 'charge'; e.t = 0; Sound.play('charge'); } }
      else if (e.st === 'charge') { const h = tryMove(e, e.fx * 140 * dt, e.fy * 140 * dt, mr, who); if (e.t > 0.7 || h.hitX || h.hitY) { e.st = 'chase'; e.t = 0; } }

        e.summoned = true;
        if (G.mode === 'arena') { arenaSpawn('penguin', e.x - 40, e.y); arenaSpawn('penguin', e.x + 40, e.y); }
        else { spawnEnemy('penguin', G.cam.x + 40, G.cam.y + 60); spawnEnemy('penguin', G.cam.x + VW - 40, G.cam.y + 60); }
      }
      if (e.st === 'waddle') { e.fx = dx / d; e.fy = dy / d; toward(e.speed); if (e.t > 2.2) { e.st = 'wind'; e.t = 0; Sound.play('charge'); } }

      } else if (e.st === 'daze') { if (e.t > 2.2) { e.st = 'waddle'; e.t = 0; } }
      break;
  }
  if (d < e.r + 5 && e.st !== 'daze') hurtPlayer(e.touch, e);
}

function updatePickup(e, dt) {

  if (e.underBush && tileAt(e.x, e.y) === 'b') return;   // still hidden under its bush
  const dp = dist(e, G.player);
  if (G.mode === 'arena' && (dp < G.st.pickup || e.magnet)) { const k = Math.min(1, 9 * dt); e.x += (G.player.x - e.x) * k; e.y += (G.player.y - e.y) * k; }
  if (dp > 11) return;
  G.ents = G.ents.filter(o => o !== e);
  const s = G.save, p = G.player;
  switch (e.what) {
    case 'heart': p.hp = Math.min(s.maxHp, p.hp + 2); Sound.play('heart'); break;
    case 'kr1': s.kr += 1; Sound.play('coin'); break;
    case 'kr5': s.kr += 5; Sound.play('coin'); break;
    case 'krn': s.kr += e.value; Sound.play('coin'); break;
    case 'rune': s.rune = Math.min(RUNE_MAX, s.rune + 4); Sound.play('heart'); break;
    case 'piece': case 'container':
      setFlag('got:' + e.id);
      giveItem(e.what);
      break;
    case 'qitem':
      setFlag('got:' + e.id);
      giveItem(e.id);
      break;
  }
}

// Pixel art in the style of A Link to the Past: hand-placed sprites with dark outlines,
// 3-4 shade ramps, directional walk cycles, and tiles whose edges blend into their neighbors.
// Sprites are text grids: one character per pixel, '.' is transparent, letters map to a palette.

const OUTLINE = '#181420';
function hexRgb(h) { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }

// rows -> canvas, with a 1px outline around every opaque pixel
function buildSprite(rows, pal, outline = true) {

  const c = mkCanvas(w + pad * 2, h + pad * 2), g = c.getContext('2d'), img = g.createImageData(c.width, c.height);
  const filled = (x, y) => y >= 0 && y < h && x >= 0 && x < rows[y].length && rows[y][x] !== '.' && rows[y][x] !== ' ';
  const put = (x, y, hex, a = 255) => { const [r, gg, b] = hexRgb(hex), i = (y * c.width + x) * 4; img.data[i] = r; img.data[i + 1] = gg; img.data[i + 2] = b; img.data[i + 3] = a; };
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    if (filled(x, y)) { const col = pal[rows[y][x]]; if (col) put(x + pad, y + pad, col); }
  }
  if (outline) {
    for (let y = -1; y <= h; y++) for (let x = -1; x <= w; x++) {
      if (filled(x, y)) continue;
      if (filled(x + 1, y) || filled(x - 1, y) || filled(x, y + 1) || filled(x, y - 1)) put(x + pad, y + pad, OUTLINE);

}

// ---------------- Flight 364 on the airstrip ----------------
function planeImage(h) {
  const W = (h.x1 - h.x0 + 1) * T + 12, H = (h.y1 - h.y0 + 1) * T + 16;
  const fx0 = 6, fx1 = W - 6, fy0 = (h.fy0 - h.y0) * T + 8 + 2, fy1 = (h.fy1 - h.y0 + 1) * T + 8 - 2;
  const mid = (fy0 + fy1) / 2, rad = (fy1 - fy0) / 2;
  return makeImg(W, H, (P, has) => {
    const rect = (x, y, w, hh, c, a) => { for (let yy = y; yy < y + hh; yy++) for (let xx = x; xx < x + w; xx++) P(xx, yy, c, a); };
    // shadow on the ground
    for (let y = fy1 + 2; y < fy1 + 8; y++) for (let x = fx0 + 10; x < fx1; x++) P(x, y, '#000000', 50);
    // wings (swept back) with engines, top and bottom
    const wx = (h.wingX - h.x0) * T + 6;
    for (const dir of [-1, 1]) {
      for (let k = 0; k < 22; k++) {
        const y = dir < 0 ? fy0 - 1 - k : fy1 + k, x0 = wx + Math.round(k * 0.8), x1 = x0 + 26 - Math.round(k * 0.5);
        if (y < 0 || y >= H) continue;
        for (let x = x0; x < x1; x++) P(x, y, k > 18 ? '#9aa2ae' : x < x0 + 2 ? '#e8ecf2' : '#c4cad4');
        P(x0 - 1, y, OUTLINE); P(x1, y, OUTLINE);
      }
      const ey = dir < 0 ? fy0 - 12 : fy1 + 6;
      rect(wx + 6, ey, 12, 6, '#7a808c'); rect(wx + 6, ey, 12, 2, '#a8aeba'); rect(wx + 5, ey + 1, 2, 4, '#20242c'); rect(wx + 5, ey - 1, 14, 1, OUTLINE); rect(wx + 5, ey + 6, 14, 1, OUTLINE);
    }
    // tail stabilizers and the red fin
    for (const dir of [-1, 1]) for (let k = 0; k < 9; k++) { const y = dir < 0 ? fy0 - 1 - k : fy1 + k; for (let x = fx1 - 22 + k; x < fx1 - 8; x++) P(x, y, '#c4cad4'); P(fx1 - 23 + k, y, OUTLINE); }
    // fuselage: a long capsule, white on top shading to grey
    for (let y = fy0; y <= fy1; y++) for (let x = fx0; x <= fx1; x++) {
      const dy = (y - mid) / rad;
      const capL = x < fx0 + rad * 1.6 ? Math.pow((x - (fx0 + rad * 1.6)) / (rad * 1.6), 2) + dy * dy > 1 : false;
      const capR = x > fx1 - rad * 0.8 ? Math.pow((x - (fx1 - rad * 0.8)) / (rad * 0.8), 2) + dy * dy > 1 : false;
      if (capL || capR) continue;
      P(x, y, dy < -0.6 ? '#ffffff' : dy < 0.2 ? '#eef0f4' : dy < 0.65 ? '#cfd4dc' : '#a8aeb8');
    }
    for (let x = fx0 + 6; x < fx1 - 4; x++) { if (has(x, Math.round(mid) + 2)) P(x, Math.round(mid) + 2, '#c0392b'); if (has(x, Math.round(mid) + 3)) P(x, Math.round(mid) + 3, '#2a4a8a'); }
    for (let x = fx0 + 20; x < fx1 - 18; x += 6) { P(x, Math.round(mid) - 3, '#3a5a8a'); P(x + 1, Math.round(mid) - 3, '#3a5a8a'); P(x, Math.round(mid) - 2, '#5a7aaa'); }
    for (const [x, y] of [[fx0 + 4, mid - 3], [fx0 + 5, mid - 3], [fx0 + 7, mid - 4], [fx0 + 8, mid - 4], [fx0 + 10, mid - 4]]) P(x, y, '#1a2a4a');
    for (let y = fy0 - 10; y < fy0 + 2; y++) for (let x = fx1 - 14 + (fy0 - y) / 2; x < fx1 - 4; x++) P(x, y, y < fy0 - 7 ? '#e05040' : '#c0392b');
    // outline the hull
    const edge = [];
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) if (!has(x, y) && (has(x + 1, y) || has(x - 1, y) || has(x, y + 1) || has(x, y - 1))) edge.push([x, y]);
    for (const [x, y] of edge) P(x, y, OUTLINE);
  });
}

// ===== bigart.js =====
// Big scenery, A Link to the Past style: 2x2-tile trees with a canopy Owen walks behind,
// and whole buildings drawn as one piece (log walls, shingled roofs, chimneys with smoke).
// The map ASCII doesn't change: computeBigs() finds the shapes when a map loads.

function makeImg(w, h, draw) {
  const c = mkCanvas(w, h), g = c.getContext('2d'), img = g.createImageData(w, h);
  const P = (x, y, hex, a = 255) => {
    x = Math.round(x); y = Math.round(y);
    if (x < 0 || y < 0 || x >= w || y >= h) return;
    const [r, gg, b] = hexRgb(hex), i = (y * w + x) * 4;
    if (a < 255 && img.data[i + 3]) { const k = a / 255; img.data[i] = img.data[i] * (1 - k) + r * k; img.data[i + 1] = img.data[i + 1] * (1 - k) + gg * k; img.data[i + 2] = img.data[i + 2] * (1 - k) + b * k; return; }
    img.data[i] = r; img.data[i + 1] = gg; img.data[i + 2] = b; img.data[i + 3] = a;
  };
  const has = (x, y) => x >= 0 && y >= 0 && x < w && y < h && img.data[(y * w + x) * 4 + 3] > 0;
  draw(P, has);
  g.putImageData(img, 0, 0);
  return c;
}

// ---------------- big trees (36 x 42 image over a 32 x 32 footprint) ----------------
const BIG_TREE_W = 36, BIG_TREE_H = 42;
function treeImage(variant, snowy) {
  const r = rng(variant * 977 + (snowy ? 5 : 1));
  const ramp = snowy ? ['#ffffff', '#dfe9f2', '#3e7a68', '#2a5a4c', '#1a3c32'] : ['#88d860', '#58b040', '#3a8a30', '#26682a', '#174a1c'];
  // the canopy is a union of lumpy circles; light comes from the top-left
  const lumps = [[18, 15, 16, 13], [9, 19, 9, 8], [27, 19, 9, 8], [18, 7, 11, 7], [11, 10, 7, 6], [25, 10, 7, 6]]
    .map(([x, y, rx, ry]) => [x + (r() - 0.5) * 2, y + (r() - 0.5) * 2, rx, ry]);
  const inCanopy = (x, y) => lumps.some(([cx, cy, rx, ry]) => { const nx = (x + 0.5 - cx) / rx, ny = (y + 0.5 - cy) / ry; return nx * nx + ny * ny <= 1; });
  return makeImg(BIG_TREE_W, BIG_TREE_H, (P, has) => {
    // ground shadow, offset down-right
    for (let y = 33; y < 42; y++) for (let x = 4; x < 34; x++) { const nx = (x - 19) / 15, ny = (y - 37) / 4.5; if (nx * nx + ny * ny <= 1) P(x, y, '#000000', 60); }
    // trunk with roots
    for (let y = 24; y < 39; y++) for (let x = 13; x < 23; x++) {
      const root = y > 34 ? (x - 18) * (x - 18) < (y - 30) * 4 : x >= 14 && x < 22;
      if (!root) continue;
      P(x, y, x < 15 ? '#5a3418' : x > 20 ? '#4a2810' : (x + y) % 5 === 0 ? '#6a3c1a' : '#8a5428');
    }
    for (let y = 26; y < 39; y++) { if (has(13, y) || has(14, y)) P(has(13, y) ? 12 : 13, y, OUTLINE); if (has(22, y) || has(21, y)) P(has(22, y) ? 23 : 22, y, OUTLINE); }
    for (let x = 12; x < 25; x++) if (has(x, 38)) P(x, 39, OUTLINE);
    // canopy fill
    for (let y = 0; y < 31; y++) for (let x = 0; x < BIG_TREE_W; x++) {
      if (!inCanopy(x, y)) continue;
      const nx = (x - 18) / 17, ny = (y - 14) / 14;
      const l = -nx * 0.65 - ny * 0.75 + (r() - 0.5) * 0.55;
      P(x, y, l > 0.7 ? ramp[0] : l > 0.25 ? ramp[1] : l > -0.2 ? ramp[2] : l > -0.6 ? ramp[3] : ramp[4]);
    }
    // leaf clusters: small dark crescents with a lit edge above
    for (let i = 0; i < 26; i++) {
      const x = 3 + Math.floor(r() * 30), y = 3 + Math.floor(r() * 24);
      if (!inCanopy(x, y) || !inCanopy(x + 3, y + 1)) continue;
      const dark = (x - 18) * 0.65 + (y - 14) * 0.75 > -4;
      P(x, y + 1, dark ? ramp[4] : ramp[3]); P(x + 1, y + 2, dark ? ramp[4] : ramp[3]); P(x + 2, y + 2, dark ? ramp[4] : ramp[3]); P(x + 3, y + 1, dark ? ramp[4] : ramp[3]);
      P(x + 1, y, ramp[1]); P(x + 2, y, ramp[1]);
    }
    if (snowy) for (let i = 0; i < 18; i++) { const x = 4 + Math.floor(r() * 28), y = 2 + Math.floor(r() * 12); if (inCanopy(x, y) && !inCanopy(x, y - 2)) { P(x, y, '#ffffff'); P(x + 1, y, '#ffffff'); P(x, y + 1, '#e8f0f8'); } }
    // outline around the canopy
    for (let y = 0; y < 32; y++) for (let x = 0; x < BIG_TREE_W; x++) {
      if (inCanopy(x, y)) continue;
      if (inCanopy(x + 1, y) || inCanopy(x - 1, y) || inCanopy(x, y + 1) || inCanopy(x, y - 1)) P(x, y, OUTLINE);
    }
    // canopy shadow onto the trunk
    for (let x = 13; x < 23; x++) for (let y = 24; y < 31; y++) if (!inCanopy(x, y) && has(x, y) && !inCanopy(x, y - 1) === false) P(x, y, '#000000', 90);
  });
}

// ---------------- buildings ----------------
function houseImage(h) {
  const tw = h.x1 - h.x0 + 1, th = h.y1 - h.y0 + 1;
  const W = tw * T + 8, H = th * T + 12;
  const roofH = (h.roofEnd - h.y0 + 1) * T - 2;   // roof ends just above the wall row
  const stall = !h.doors.length;
  const r = rng(h.x0 * 31 + h.y0 * 17);
  const oy = 12;                                      // room above the footprint for ridge and chimney
  return makeImg(W, H, (P) => {
    const rect = (x, y, w, hh, c, a) => { for (let yy = y; yy < y + hh; yy++) for (let xx = x; xx < x + w; xx++) P(xx, yy, c, a); };
    // ---- walls: horizontal logs with round ends ----
    const wallTop = oy + roofH - 2, wallBot = oy + th * T;
    for (let y = wallTop; y < wallBot; y++) for (let x = 4; x < W - 4; x++) {
      const k = (y - wallTop) % 5;
      P(x, y, k === 0 ? '#d8a060' : k === 4 ? '#5a3418' : k === 3 ? '#7a4a22' : '#a8703c');
    }
    for (let y = wallTop; y < wallBot; y += 5) for (const x of [4, W - 7]) { rect(x, y, 3, 4, '#e8c088'); P(x + 1, y + 1, '#a8703c'); P(x + 1, y + 2, '#a8703c'); }
    rect(4, wallBot - 2, W - 8, 2, '#3a2010');
    if (stall) {
      // Lars's stall: open front with shelves of jars
      rect(8, wallTop + 2, W - 16, wallBot - wallTop - 4, '#3a2412');
      for (let x = 10; x < W - 12; x += 6) { rect(x, wallTop + 4, 4, 5, ['#c0182b', '#7fd4ff', '#ffd84a'][(x / 6 | 0) % 3]); P(x + 1, wallTop + 3, '#d8d8e8'); P(x + 2, wallTop + 3, '#d8d8e8'); }
      rect(8, wallTop + 10, W - 16, 2, '#8a5428');
    } else {
      // windows with shutters, skipping door columns
      for (let c = 0; c < tw; c++) {
        const tx = h.x0 + c;
        if (h.doors.some(d => Math.abs(d - tx) <= 0) || (c % 2 === 1 && tw > 3)) continue;
        const x = 4 + c * T + 4, y = wallTop + 3;
        if (y + 8 > wallBot - 2) continue;
        rect(x - 1, y - 1, 10, 9, OUTLINE); rect(x, y, 8, 7, '#9fd0ff'); rect(x, y, 8, 2, '#d8f0ff'); rect(x + 3, y, 2, 7, '#5a3418'); rect(x, y + 3, 8, 1, '#5a3418');
        rect(x - 4, y - 1, 3, 9, '#2f6a3a'); rect(x + 9, y - 1, 3, 9, '#2f6a3a');
      }
      // arched doors
      for (const d of h.doors) {
        const x = 4 + (d - h.x0) * T + 2, y = wallBot - 15;
        rect(x - 1, y - 1, 14, 16, OUTLINE);
        for (let yy = 0; yy < 15; yy++) for (let xx = 0; xx < 12; xx++) {
          if (yy < 3 && (xx < 2 - yy || xx > 9 + yy)) continue;
          P(x + xx, y + yy, xx % 4 === 0 ? '#3a1e0c' : yy === 6 ? '#2a1408' : '#6a3c1a');
        }
        P(x + 9, y + 8, '#ffd84a'); P(x + 9, y + 9, '#c89a18');
        rect(x - 2, wallBot - 1, 16, 1, '#7a7a8c');
      }
      // a Viking round shield hangs by the door on wider houses
      if (tw >= 5) {
        const sx = 4 + (tw - 1) * T - 2, sy = wallTop + 4;
        for (let yy = -4; yy <= 4; yy++) for (let xx = -4; xx <= 4; xx++) { const d = xx * xx + yy * yy; if (d <= 16) P(sx + xx, sy + yy, d >= 12 ? OUTLINE : d <= 2 ? '#ffd84a' : (xx + yy) % 3 === 0 ? '#801818' : '#b03028'); }
      }
    }
    // ---- roof ----
    const roofTop = oy, roofBot = oy + roofH;
    for (let y = roofTop; y < roofBot; y++) {
      const inset = Math.max(0, 3 - Math.floor((y - roofTop) / 2));   // slight taper at the ridge
      for (let x = inset; x < W - inset; x++) {
        if (stall) {
          const stripe = Math.floor(x / 6) % 2;
          P(x, y, y < roofTop + 3 ? '#7a2018' : stripe ? '#f4ecd8' : '#c8302a');
          continue;
        }
        const row = Math.floor((y - roofTop) / 4), xx = (x + (row % 2) * 3) % 6, yy = (y - roofTop) % 4;
        const edge = yy === 3 || (yy === 2 && (xx === 0 || xx === 5));
        const light = 1 - (y - roofTop) / roofH;          // top of the roof faces the sun
        let c = edge ? '#6a1a12' : light > 0.66 ? '#e8644a' : light > 0.33 ? '#c84030' : '#a03024';
        if (!edge && yy === 0 && light > 0.33) c = '#f08a6a';
        P(x, y, c);
      }
    }
    if (stall) {
      // scalloped awning edge
      for (let x = 0; x < W; x++) { const s = Math.floor(x / 6) % 2; const d = 2 + Math.round(Math.sin((x % 6) / 6 * Math.PI) * 2); for (let k = 0; k < d; k++) P(x, roofBot + k, s ? '#f4ecd8' : '#c8302a'); P(x, roofBot + d, OUTLINE); }
    } else {
      // ridge cap and crossed gable beams (dragon-head ends)
      rect(2, roofTop, W - 4, 3, '#5a1810'); rect(2, roofTop, W - 4, 1, '#8a2a20');
      for (const [x, dir] of [[3, -1], [W - 4, 1]]) for (let k = 0; k < 6; k++) { P(x + dir * k * 0.6, roofTop - k, '#7a4a22'); P(x + dir * k * 0.6 + 1, roofTop - k, '#5a3418'); }
      // eave shadow on the wall
      rect(4, roofBot, W - 8, 3, '#000000', 90);
      // chimney
      if (tw >= 4) {
        const cx = W - 16, cy = roofTop - 6;
        rect(cx - 1, cy - 1, 10, 14, OUTLINE);
        for (let y = 0; y < 12; y++) for (let x = 0; x < 8; x++) P(cx + x, cy + y, (y % 4 === 3 || (x + (Math.floor(y / 4) % 2) * 4) % 8 === 0) ? '#5a5a6a' : x < 3 ? '#a8a8b8' : '#8a8a9a');
        rect(cx - 1, cy - 2, 10, 2, '#6a6a7a');
        h.chimney = { x: cx + 4, y: cy - 3 };
      }
    }
    // outline the roof silhouette
    for (let x = 0; x < W; x++) P(x, roofTop - 1, OUTLINE);
    for (let y = roofTop; y < roofBot; y++) { const inset = Math.max(0, 3 - Math.floor((y - roofTop) / 2)); P(inset - 1, y, OUTLINE); P(W - inset, y, OUTLINE); }
    if (!stall) for (let x = 0; x < W; x++) P(x, roofBot, OUTLINE);
    for (let y = wallTop; y < wallBot; y++) { P(3, y, OUTLINE); P(W - 4, y, OUTLINE); }
  });
}

// ---------------- find the shapes in a map ----------------
const BIG_CACHE = new Map();
function computeBigs() {
  G.bigs = []; G.claim = new Map(); G.canopy = new Set();
  if (G.map.dungeon || G.map.arena || G.mapId === 'home') return;
  const key = (x, y) => y * G.cols + x;
  // trees: pack 2x2 blocks of 'T' within a screen, scanning top-left first
  for (let ty = 0; ty < G.nrows - 1; ty++) for (let tx = 0; tx < G.cols - 1; tx++) {
    const cells = [[tx, ty], [tx + 1, ty], [tx, ty + 1], [tx + 1, ty + 1]];
    if (!cells.every(([x, y]) => G.rows[y][x] === 'T' && !G.claim.has(key(x, y)))) continue;
    const snowy = SNOWY(tx, ty), v = hash(tx, ty) % 3;
    for (const [x, y] of cells) G.claim.set(key(x, y), snowy ? 'n' : '.');
    // the canopy row is walkable when open ground lies above it: Owen walks behind the tree
    for (const x of [tx, tx + 1]) {
      const above = ty > 0 ? G.rows[ty - 1][x] : 'T';
      if (ty % SH !== 0 && !SOLID.has(above) && above !== '~' && above !== 'w') G.canopy.add(key(x, ty));
    }
    const ck = 'tree' + v + (snowy ? 's' : '');
    if (!BIG_CACHE.has(ck)) BIG_CACHE.set(ck, treeImage(v, snowy));
    G.bigs.push({ kind: 'tree', img: BIG_CACHE.get(ck), x: tx * T - 2, y: ty * T + 2 * T - BIG_TREE_H, sortY: ty * T + 2 * T - 2, tx, ty, w: 2, h: 2 });
  }
  // the airliner on the airstrip: plane body (P) and wings (q)
  const pc = [];
  for (let ty = 0; ty < G.nrows; ty++) for (let tx = 0; tx < G.cols; tx++) if ('Pq'.includes(G.rows[ty][tx])) pc.push([tx, ty]);
  if (pc.length) {
    const xs = pc.map(c => c[0]), ys = pc.map(c => c[1]), body = pc.filter(([x, y]) => G.rows[y][x] === 'P');
    const pl = { kind: 'plane', x0: Math.min(...xs), x1: Math.max(...xs), y0: Math.min(...ys), y1: Math.max(...ys),
      fy0: Math.min(...body.map(c => c[1])), fy1: Math.max(...body.map(c => c[1])), wingX: Math.min(...pc.filter(([x, y]) => G.rows[y][x] === 'q').map(c => c[0])) };
    for (const [x, y] of pc) G.claim.set(key(x, y), G.rows[y][x] === 'q' && (G.rows[y][x - 1] === 's' || G.rows[y][x + 1] === 's') ? 's' : '.');
    pl.img = planeImage(pl); pl.x = pl.x0 * T - 6; pl.y = pl.y0 * T - 8; pl.sortY = (pl.fy1 + 1) * T;
    G.bigs.push(pl);
  }
  // buildings: connected roof/wall/door tiles
  const seen = new Set();
  for (let ty = 0; ty < G.nrows; ty++) for (let tx = 0; tx < G.cols; tx++) {
    if (!'RHD'.includes(G.rows[ty][tx]) || seen.has(key(tx, ty))) continue;
    const q = [[tx, ty]], cells = [];
    seen.add(key(tx, ty));
    while (q.length) {
      const [x, y] = q.pop(); cells.push([x, y]);
      for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
        const nx = x + dx, ny = y + dy;
        if (nx < 0 || ny < 0 || nx >= G.cols || ny >= G.nrows || seen.has(key(nx, ny)) || !'RHD'.includes(G.rows[ny][nx])) continue;
        seen.add(key(nx, ny)); q.push([nx, ny]);
      }
    }
    const xs = cells.map(c => c[0]), ys = cells.map(c => c[1]);
    const h = { kind: 'house', x0: Math.min(...xs), x1: Math.max(...xs), y0: Math.min(...ys), y1: Math.max(...ys), doors: [] };
    h.roofEnd = Math.max(...cells.filter(([x, y]) => G.rows[y][x] === 'R').map(c => c[1]), h.y0);
    for (const [x, y] of cells) { if (G.rows[y][x] === 'D') h.doors.push(x); G.claim.set(key(x, y), '.'); }
    h.img = houseImage(h);
    h.x = h.x0 * T - 4; h.y = h.y0 * T - 12; h.sortY = (h.y1 + 1) * T - 1;
    G.bigs.push(h);
  }
}

function bigDrawList() {
  const out = [], p = G.player;

    if (sx > VW || sy > VH || sx + b.img.width < 0 || sy + b.img.height < 0) continue;

      const behind = p.y < b.sortY && p.x > b.x + 2 && p.x < b.x + b.img.width - 2 && p.y > b.y + 4;
      ctx.globalAlpha = behind ? 0.72 : 1;

function drawOwen(x, y) {

function drawEnemy(e) {

      if (e.life !== undefined && e.life < 2 && Math.floor(t * 10) % 2) break;
      if (e.underBush && tileAt(e.x, e.y) === 'b') break;
      if (e.what === 'qitem') { const b = Math.round(Math.sin(t * 4) * 1.5); shadowAt(x, y + 6, 0.7); drawItemIcon(e.id, x, y + b); if (Math.floor(t * 3) % 3 === 0) drawTwinkle(x + 6, y - 6 + b, 0); break; }
      const b = Math.round(Math.sin(t * 4 + e.x) * 1.5);
      if (e.what === 'heart') drawHeart(x - 3, y - 3 + b, 1);
      else if (e.what === 'kr1' || e.what === 'kr5' || e.what === 'krn') { drawIconSpr(e.what === 'kr5' || e.value >= 5 ? 'gold' : 'coin', x, y + b); }
      else if (false) { R(x - 3, y - 3 + b, 6, 6, (e.what === 'kr5' || e.value >= 5) ? '#ffd84a' : '#d0d6e0'); R(x - 1, y - 2 + b, 2, 4, (e.what === 'kr5' || e.value >= 5) ? '#a87a10' : '#8a92a0'); }
      else if (e.what === 'rune') drawItemIcon('shard', x, y + b);
      else drawItemIcon(e.what, x, y + b);
      break; }
    case 'switch': {
      const on = flag(G.mapId + ':gates');
      R(x - 5, y + 2, 10, 5, '#3a3a4a'); poly([[x, y - 9], [x + 6, y - 2], [x, y + 4], [x - 6, y - 2]], on ? '#7fd4ff' : '#ff9a1f'); R(x - 2, y - 5, 2, 3, '#fff');
      break; }
    case 'warp': if (e.portal) { for (let i = 0; i < 3; i++) { const r = 4 + ((t * 10 + i * 4) % 10); ctx.strokeStyle = `rgba(127,212,255,${1 - r / 14})`; ctx.lineWidth = 1; ctx.beginPath(); ctx.ellipse(x, y, r, r * 0.6, 0, 0, Math.PI * 2); ctx.stroke(); } } break;
  }
}

// ===== arena.js =====
// Valhalla Arena: Brotato-style survival. 20 timed waves; spend kroner on cards between waves.
// Tuning lives in ARENA_CARDS, LEVEL_UPS and waveSpec(). Owen: add cards here.

const ARENA_WAVES = 20;
const ARENA_BEST_KEY = 'jontuka-arena-best';
const A = { wave: 0, t: 0, len: 0, spawnT: 0, kills: 0, xp: 0, lvl: 1, pendingLv: 0, owned: {}, cards: [], sel: 0,
  rerolls: 0, orbit: 0, frost: 0, chain: 0, turrets: [], pals: [], shots: [], bolts: [], regenT: 0, frostT: 0, marks: [], won: false, choices: [] };

const ARENA_CARDS = [
  { id: 'orbit', name: 'Ghost Jon', desc: 'A ghost axe circles you', price: 30, max: 4, apply: () => { A.orbit++; } },
  { id: 'frost', name: 'Frost Aura', desc: 'Freezes and hurts nearby enemies', price: 35, max: 3, apply: () => { A.frost++; } },
  { id: 'chain', name: 'Chain Lightning', desc: 'Jon hits can zap 3 more', price: 40, max: 3, apply: () => { A.chain++; } },

  { id: 'pal', name: 'Penguin Pal', desc: 'A good penguin. Slides at foes', price: 30, max: 2, apply: () => { A.pals.push({ x: G.player.x, y: G.player.y, cd: 1, dash: 0, dx: 0, dy: 0, wob: 0 }); } },
  { id: 'homing', name: 'Homing Jon', desc: 'Throws lock on, fly far', price: 25, max: 1, apply: () => { G.save.items.homing = true; } },
  { id: 'thunder', name: 'Thunder Rune', desc: 'C: strike all (full meter)', price: 45, max: 1, apply: () => { G.save.items.thunder = true; G.save.rune = RUNE_MAX; } },
  { id: 'juice', name: 'Lingonberry Juice', desc: 'Auto-revive once', price: 20, max: 3, apply: () => { G.save.potions++; } },
  { id: 'helmet', name: "Hank's Helmet", desc: '+1 armor (10% block)', price: 25, max: 5, apply: () => { G.st.armor++; } },
  { id: 'boots', name: 'Fjord Boots', desc: '+12% move speed', price: 20, max: 4, apply: () => { G.st.speed += 0.12; } },
  { id: 'magnet', name: 'Magnet Rune', desc: 'Grab kroner from farther', price: 15, max: 3, apply: () => { G.st.pickup += 14; } },
  { id: 'blood', name: 'Viking Blood', desc: '+25% damage', price: 30, max: 5, apply: () => { G.st.dmg += 0.25; } },

  { id: 'herring', name: 'Pickled Herring', desc: '+1 regen', price: 20, max: 4, apply: () => { G.st.regen++; } },
];
const LEVEL_UPS = [
  { name: '+1 Heart', apply: () => { G.save.maxHp += 2; G.player.hp += 2; } },
  { name: '+12% Damage', apply: () => { G.st.dmg += 0.12; } },
  { name: '+10% Speed', apply: () => { G.st.speed += 0.1; } },
  { name: '+15% Attack Speed', apply: () => { G.st.atk += 0.15; } },
  { name: '+1 Regen', apply: () => { G.st.regen++; } },
  { name: '+5% Crit', apply: () => { G.st.crit += 0.05; } },
  { name: '+30% Pickup Range', apply: () => { G.st.pickup *= 1.3; } },
  { name: '+1 Armor', apply: () => { G.st.armor++; } },
  { name: '+15% Throw Range', apply: () => { G.st.range += 0.15; } },
];

function arenaBest() { try { return +localStorage.getItem(ARENA_BEST_KEY) || 0; } catch (e) { return 0; } }
function waveSpec(w) {
  const pool = ['penguin'];
  if (w >= 2) pool.push('bat');
  if (w >= 3) pool.push('wisp', 'penguin');
  if (w >= 4) pool.push('draugr');
  if (w >= 7) pool.push('draugr', 'bat');
  return {
    len: Math.min(18 + (w - 1) * 3, 45),
    every: Math.max(0.22, 1.2 - w * 0.055),
    batch: 1 + Math.floor(w / 6),
    pool,
    knightChance: w >= 6 ? 0.03 + w * 0.004 : 0,
    hpMul: 1 + 0.2 * (w - 1),
    touchAdd: Math.floor(w / 8),
    bosses: w === 20 ? 2 : (w % 5 === 0 ? 1 : 0),
  };
}

function startArena() {
  G.mode = 'arena';
  G.save = newSave(); G.save.voodoo = false; G.save.map = 'arena';
  G.st = baseStats();
  G.player = makePlayer(); G.jon = makeJon(); G.player.hp = G.save.maxHp;
  Object.assign(A, { wave: 0, kills: 0, xp: 0, lvl: 1, pendingLv: 0, owned: {}, orbit: 0, frost: 0, chain: 0, turrets: [], pals: [], shots: [], bolts: [], marks: [], won: false, rerolls: 0 });
  G.state = 'play';
  loadMap('arena', 16 * T, 14 * T + 8);
  G.cam = { x: 16 * T - VW / 2, y: 14 * T + 8 - VH / 2 };
  say([
    ['Jon', 'Welcome to VALHALLA ARENA! Chilly sends twenty waves of minions. We survive all twenty.'],
    ['Jon', 'Enemies drop kroner. Between waves we shop for upgrades. Level ups give free stats.'],
    ['Jon', 'Z swings me, X throws me. Enter pauses. Ready? Of course you are. You have ME.'],
  ], () => nextWave());
}

function nextWave() {
  A.wave++;
  const sp = waveSpec(A.wave);
  A.t = 0; A.len = sp.len; A.spawnT = 0.5; A.marks = []; A.shots = [];
  G.state = 'play';
  placeTurrets();
  G.banner = A.wave % 5 === 0 ? `WAVE ${A.wave} · BOSS` : `WAVE ${A.wave}`; G.bannerT = 1.6;
  if (sp.bosses) {
    Sound.play('boss');
    for (let i = 0; i < sp.bosses; i++) arenaSpawn('king', 16 * T + (i ? 80 : -80) * (sp.bosses > 1 ? 1 : 0), 9 * T, true);
  }
}
function placeTurrets() {
  const p = G.player, n = A.turrets.length;
  A.turrets.forEach((t, i) => { const a = (i / Math.max(1, n)) * Math.PI * 2; t.x = clamp(p.x + Math.cos(a) * 34, 24, G.cols * T - 24); t.y = clamp(p.y + Math.sin(a) * 34, 40, G.nrows * T - 24); });
}

function arenaSpawn(type, x, y, now) {
  if (!now) { A.marks.push({ type, x, y, t: 0.8 }); return; }
  const sp = waveSpec(Math.max(1, A.wave));
  const e = makeEnemy(type, x, y);
  e.aggro = true;
  if (e.st === 'intro') e.st = type === 'king' ? 'waddle' : 'chase';
  const mul = type === 'king' ? (1 + 0.5 * Math.floor(A.wave / 5 - 1)) * 2 : sp.hpMul;
  e.hp = e.max = e.hp * mul; e.touch += sp.touchAdd;
  G.ents.push(e);
  puff(x, y, '#cfe8ff', 6);
}
function randomSpawnPoint() {
  const p = G.player;
  for (let i = 0; i < 20; i++) {
    const x = rnd(2.5, G.cols - 2.5) * T, y = rnd(3, G.nrows - 2.5) * T;
    if (Math.hypot(x - p.x, y - p.y) > 70 && !solidAt(x, y, 'walker')) return { x, y };
  }
  return { x: 3 * T, y: 4 * T };
}

function arenaKill(e) {
  A.kills++;
  const val = { penguin: 1, bat: 1, wisp: 1, draugr: 2, knight: 5, king: 25 }[e.type] || 1;
  const n = Math.min(val, 5);
  for (let i = 0; i < n; i++) G.ents.push({ kind: 'pickup', what: 'krn', value: Math.ceil(val / n), x: e.x + rnd(-6, 6), y: e.y + rnd(-6, 6), life: 30 });
  if (Math.random() < 0.04) G.ents.push({ kind: 'pickup', what: 'heart', x: e.x, y: e.y, life: 10 });
  A.xp += e.type === 'king' ? 15 : e.type === 'knight' ? 4 : e.type === 'draugr' ? 2 : 1;
  while (A.xp >= xpNeed()) { A.xp -= xpNeed(); A.lvl++; A.pendingLv++; floatText(G.player.x, G.player.y - 24, 'LEVEL UP!', '#9be08a'); Sound.play('heart'); }
}
const xpNeed = () => 5 + A.lvl * 4;

function arenaOnHit(e) {
  if (!A.chain || Math.random() > 0.2 * A.chain) return;
  const near = G.ents.filter(o => o.enemy && o.alive && o !== e && dist(o, e) < 80).sort((a, b) => dist(a, e) - dist(b, e)).slice(0, 3);
  let from = e;
  for (const o of near) {
    A.bolts.push({ x1: from.x, y1: from.y, x2: o.x, y2: o.y, t: 0.15 });
    damageEnemy(o, rollDamage(0.8), from, 'magic');
    from = o;
  }
  if (near.length) Sound.play('switch');
}

function updateArena(dt) {
  const p = G.player, sp = waveSpec(A.wave);
  // camera follows Owen
  G.cam.x = clamp(p.x - VW / 2, 0, G.cols * T - VW); G.cam.y = clamp(p.y - VH / 2, 0, G.nrows * T - VH);
  A.t += dt;
  // regen
  if (G.st.regen > 0) { A.regenT += dt; if (A.regenT > 8 / G.st.regen) { A.regenT = 0; if (p.hp < G.save.maxHp) { p.hp++; floatText(p.x, p.y - 16, '+', '#9be08a'); } } }
  // spawning with warning marks
  A.spawnT -= dt;
  const alive = G.ents.filter(e => e.enemy && e.alive).length;
  if (A.spawnT <= 0 && A.t < A.len - 1 && alive < 55) {
    A.spawnT = sp.every;
    for (let i = 0; i < sp.batch; i++) {
      const pt = randomSpawnPoint();
      arenaSpawn(Math.random() < sp.knightChance ? 'knight' : pick(sp.pool), pt.x, pt.y);
    }
  }
  for (const m of A.marks) { m.t -= dt; if (m.t <= 0) arenaSpawn(m.type, m.x, m.y, true); }
  A.marks = A.marks.filter(m => m.t > 0);
  // Ghost Jons
  if (A.orbit) {
    for (let i = 0; i < A.orbit; i++) {
      const a = G.t * 3.2 + i * Math.PI * 2 / A.orbit, ox = p.x + Math.cos(a) * 28, oy = p.y + Math.sin(a) * 28;
      for (const e of G.ents) if (e.enemy && e.alive && Math.hypot(e.x - ox, e.y - oy) < e.r + 7 && !(e.orbCd > 0)) { e.orbCd = 0.5; damageEnemy(e, rollDamage(0.7), { x: ox, y: oy }, 'magic'); }
    }
  }
  for (const e of G.ents) if (e.orbCd > 0) e.orbCd -= dt;
  // Frost aura
  if (A.frost) {
    A.frostT += dt;
    const r = 34 + A.frost * 10;
    for (const e of G.ents) if (e.enemy && e.alive && dist(e, p) < r) e.slow = 0.3;
    if (A.frostT > 0.7) { A.frostT = 0; for (const e of G.ents.slice()) if (e.enemy && e.alive && dist(e, p) < r) damageEnemy(e, 0.35 * A.frost * G.st.dmg, p, 'magic'); }
  }
  // turrets
  for (const t of A.turrets) {
    t.cd -= dt;
    if (t.cd > 0) continue;
    const tgt = G.ents.filter(e => e.enemy && e.alive && dist(e, t) < 130).sort((a, b) => dist(a, t) - dist(b, t))[0];
    if (!tgt) continue;
    t.cd = 1.1 / G.st.atk;
    const d = dist(tgt, t) || 1;
    A.shots.push({ x: t.x, y: t.y - 6, vx: (tgt.x - t.x) / d * 170, vy: (tgt.y - t.y) / d * 170, life: 1.2 });
  }
  for (const s of A.shots) {
    s.x += s.vx * dt; s.y += s.vy * dt; s.life -= dt;
    const hit = G.ents.find(e => e.enemy && e.alive && Math.hypot(e.x - s.x, e.y - s.y) < e.r + 3);
    if (hit) { s.life = 0; damageEnemy(hit, rollDamage(1), s, 'magic'); }
    if (solidAt(s.x, s.y, 'jon')) s.life = 0;
  }
  A.shots = A.shots.filter(s => s.life > 0);
  // Penguin Pals: waddle after Owen, belly-slide into the nearest enemy
  A.pals.forEach((pl, i) => {
    pl.wob += dt * 8; pl.cd -= dt;
    if (pl.dash > 0) {
      pl.dash -= dt; pl.x += pl.dx * 200 * dt; pl.y += pl.dy * 200 * dt;
      for (const e of G.ents) if (e.enemy && e.alive && Math.hypot(e.x - pl.x, e.y - pl.y) < e.r + 6 && !(e.palCd > 0)) { e.palCd = 0.4; damageEnemy(e, rollDamage(1.5), pl, 'magic'); }
    } else {
      const tx = p.x - 16 + i * 32, ty = p.y + 14;
      pl.x += (tx - pl.x) * Math.min(1, 4 * dt); pl.y += (ty - pl.y) * Math.min(1, 4 * dt);
      if (pl.cd <= 0) {
        const tgt = G.ents.filter(e => e.enemy && e.alive && dist(e, pl) < 120).sort((a, b) => dist(a, pl) - dist(b, pl))[0];
        if (tgt) { const d = dist(tgt, pl) || 1; pl.dx = (tgt.x - pl.x) / d; pl.dy = (tgt.y - pl.y) / d; pl.dash = 0.45; pl.cd = 2; }
      }
    }
    pl.x = clamp(pl.x, 20, G.cols * T - 20); pl.y = clamp(pl.y, 36, G.nrows * T - 20);
  });
  for (const e of G.ents) if (e.palCd > 0) e.palCd -= dt;
  for (const b of A.bolts) b.t -= dt;
  A.bolts = A.bolts.filter(b => b.t > 0);
  // wave over
  if (A.t >= A.len && !G.ents.some(e => e.enemy && e.alive && e.type === 'king')) endWave();
}

function endWave() {
  for (const e of G.ents.filter(e => e.enemy)) puff(e.x, e.y, '#fff', 4);
  G.ents = G.ents.filter(e => !e.enemy);
  for (const e of G.ents) if (e.kind === 'pickup' && e.what === 'krn') { G.save.kr += e.value; }
  G.ents = G.ents.filter(e => !(e.kind === 'pickup'));
  A.marks = []; A.shots = [];
  G.jon.mode = 'follow';
  Sound.play('secret');
  if (A.wave >= ARENA_WAVES) return arenaOver(true);
  if (A.pendingLv > 0) openLevelUp(); else openShop();
}
function openLevelUp() {
  G.state = 'levelup'; A.sel = 0;
  A.choices = [...LEVEL_UPS].sort(() => Math.random() - 0.5).slice(0, 4);
}
function openShop() {
  G.state = 'shop'; A.sel = 0; A.rerolls = 0;
  rollCards();
}
function cardPrice(c) { return Math.round(c.price * (1 + 0.12 * (A.wave - 1))); }
function rollCards() {
  const avail = ARENA_CARDS.filter(c => (A.owned[c.id] || 0) < c.max);
  A.cards = [...avail].sort(() => Math.random() - 0.5).slice(0, 4).map(c => ({ ...c, sold: false }));
}
const rerollCost = () => 3 + A.wave + A.rerolls * 2;

function updateArenaMenus() {
  if (G.state === 'levelup') {
    if (just('up')) { A.sel = (A.sel + 3) % 4; Sound.play('menu'); }
    if (just('down')) { A.sel = (A.sel + 1) % 4; Sound.play('menu'); }
    if (just('a') || just('tap')) {
      A.choices[A.sel].apply(); A.pendingLv--; Sound.play('item');
      if (A.pendingLv > 0) openLevelUp(); else openShop();
    }
    return;
  }
  if (G.state === 'shop') {
    const n = A.cards.length + 1;   // last row = Next wave
    if (just('up')) { A.sel = (A.sel + n - 1) % n; Sound.play('menu'); }
    if (just('down')) { A.sel = (A.sel + 1) % n; Sound.play('menu'); }
    if (just('b')) {
      if (G.save.kr >= rerollCost()) { G.save.kr -= rerollCost(); A.rerolls++; rollCards(); A.sel = 0; Sound.play('coin'); } else Sound.play('clank');
    }
    if (just('menu')) return nextWave();
    if (just('a') || just('tap')) {
      if (A.sel === A.cards.length) return nextWave();
      const c = A.cards[A.sel];
      if (!c || c.sold) return;
      if (G.save.kr < cardPrice(c)) { Sound.play('clank'); return; }
      G.save.kr -= cardPrice(c); c.sold = true; A.owned[c.id] = (A.owned[c.id] || 0) + 1; c.apply(); Sound.play('item');
    }
    return;
  }
  if (G.state === 'arenapause') {
    if (just('menu') || just('a')) G.state = 'play';
    if (just('b')) { G.mode = 'story'; G.st = baseStats(); G.state = 'title'; G.menuSel = 0; G.titleOpts = null; }
    return;
  }
  if (G.state === 'arenaover') {
    if (just('a') || just('menu') || just('tap')) { G.mode = 'story'; G.st = baseStats(); G.state = 'title'; G.menuSel = 0; G.titleOpts = null; }
  }
}

function arenaOver(won) {
  A.won = won;
  G.state = 'arenaover';
  const reached = won ? ARENA_WAVES : A.wave;
  try { if (reached > arenaBest()) localStorage.setItem(ARENA_BEST_KEY, String(reached)); } catch (e) {}
  Sound.play(won ? 'secret' : 'hurt');
}

// ---------- drawing ----------
function drawArenaWorld() {
  const cx = G.cam.x, cy = G.cam.y, p = G.player;
  for (const m of A.marks) { const a = Math.floor(G.t * 10) % 2; R(m.x - cx - 5, m.y - cy - 1, 10, 2, a ? '#ff4d4d' : '#ffd84a'); R(m.x - cx - 1, m.y - cy - 5, 2, 10, a ? '#ff4d4d' : '#ffd84a'); }
  if (A.frost) {
    const r = 34 + A.frost * 10;
    ctx.strokeStyle = `rgba(160,220,255,${0.25 + 0.1 * Math.sin(G.t * 4)})`; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(p.x - cx, p.y - cy, r, 0, Math.PI * 2); ctx.stroke();
  }
  for (const t of A.turrets) {
    const x = t.x - cx, y = t.y - cy;
    R(x - 5, y - 9, 10, 14, '#7c7c8c'); R(x - 4, y - 11, 8, 3, '#7c7c8c');
    ctx.globalAlpha = 0.6 + 0.4 * Math.sin(G.t * 5); R(x - 1, y - 8, 2, 9, '#ffd84a'); R(x - 3, y - 5, 6, 2, '#ffd84a'); ctx.globalAlpha = 1;
  }
  for (const s of A.shots) R(s.x - cx - 2, s.y - cy - 2, 4, 4, '#ffd84a');
  A.pals.forEach(pl => {
    const x = pl.x - cx, y = pl.y - cy, f = Math.floor(pl.wob / 2.5) % 2;
    const { d, flip } = pl.dash > 0 ? dirOf(pl.dx, pl.dy) : { d: 'down', flip: false };
    shadowAt(x, y + 5, 1);
    spr(SPR[`pal_${d}_${f}${flip ? '_f' : ''}`], x, y + 6);
    R(x - 5, y - 6, 10, 2, '#e02838'); R(x + 3, y - 4, 2, 3, '#e02838');   // red scarf: the good penguin
  });
  for (let i = 0; i < A.orbit; i++) {
    const a = G.t * 3.2 + i * Math.PI * 2 / A.orbit;
    ctx.globalAlpha = 0.6; drawJonSprite(p.x - cx + Math.cos(a) * 28, p.y - cy + Math.sin(a) * 28, a * 2); ctx.globalAlpha = 1;
  }
  ctx.strokeStyle = '#cfefff'; ctx.lineWidth = 1;
  for (const b of A.bolts) { ctx.beginPath(); ctx.moveTo(b.x1 - cx, b.y1 - cy); ctx.lineTo((b.x1 + b.x2) / 2 - cx + rnd(-5, 5), (b.y1 + b.y2) / 2 - cy + rnd(-5, 5)); ctx.lineTo(b.x2 - cx, b.y2 - cy); ctx.stroke(); }
}

function drawArenaHud() {
  const s = G.save, p = G.player;
  R(0, 0, VW, 22, 'rgba(0,0,0,.55)');
  R(6, 3, 8, 17, '#000'); R(7, 4, 6, 15, '#1a2238');
  const fill = Math.round(15 * s.rune / RUNE_MAX); R(7, 19 - fill, 6, fill, s.items.thunder ? (s.rune >= RUNE_MAX ? '#cfefff' : '#2f8fd0') : '#333');
  drawItemIcon('coin', 22, 7); text(String(s.kr), 28, 11, '#fff');
  text('LV' + A.lvl, 22, 20, '#9be08a');
  R(44, 15, 40, 4, '#000'); R(45, 16, 38 * A.xp / xpNeed(), 2, '#9be08a');
  const left = Math.max(0, Math.ceil(A.len - A.t));

function say(lines, done) {
  if (!lines || !lines.length) { if (done) done(); return; }
  G.talk = { queue: lines.slice(), done: done || null, cur: null, shown: 0, back: G.state === 'talk' ? 'play' : (G.state === 'hold' ? 'play' : G.state) };
  if (G.talk.back !== 'play' && G.talk.back !== 'cutscene') G.talk.back = 'play';
  G.state = 'talk';
  nextLine();
}
function nextLine() {
  const tk = G.talk;
  if (!tk.queue.length) {
    G.state = tk.back; G.talk = null; if (G.player) G.player.cd = 0.25;
    if (tk.done) tk.done();
    return;
  }
  tk.cur = tk.queue.shift(); tk.shown = 0;
}
function updateTalk(dt) {
  const tk = G.talk, before = Math.floor(tk.shown);
  tk.shown += dt * 55;
  if (Math.floor(tk.shown) !== before && Math.floor(tk.shown) % 3 === 0 && tk.shown < tk.cur[1].length) Sound.play('blip');
  if (just('a') || just('b') || just('tap')) { if (tk.shown < tk.cur[1].length) tk.shown = 999; else nextLine(); }
}
function drawTalk() {
  const tk = G.talk; if (!tk) return;
  const [who, msg] = tk.cur;
  const inCut = tk.back === 'cutscene';
  const top = !inCut && G.player && G.player.y - G.cam.y > 140;
  const by = top ? 26 : 152;
  R(8, by - 2, 240, 66, '#fff'); R(10, by, 236, 62, '#0d0d33');
  let y = by + 12;
  if (who) { text(who, 16, y, '#ffe64d'); y += 12; }
  let left = Math.floor(tk.shown);
  for (const l of wrap(msg, 222).slice(0, who ? 4 : 5)) { text(l.slice(0, Math.max(0, left)), 16, y, '#fff', 'left', false); left -= l.length + 1; y += 10; }

}
