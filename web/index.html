// ===== rock.js =====
// Jon remembers who he is. Walter carved runes into Jon, and each rune is also a song. When Owen
// finds one, Jon remembers that song: the outdoor music gains a layer, a beat marker joins the HUD,
// chops on the beat hit harder, and bosses start striking on the beat.

// which song each rune brings back (titles are the game's own homages)
const SONG_OF = { fire: 'aero', frost: 'cold', thunder: 'zep', mend: 'journey', leaf: 'chop' };
const SONG_LINES = {
  fire: 'Walk This Fjord! Da na na na! I KNEW I knew that one.',
  frost: 'Cold as fjooord... I remember this! It was carved right next to the frost.',
  thunder: 'Stairway to Valhalla. All of it. Every note. Astrid was right: I remember who I am.',
  mend: 'Don\'t stop choppin\'... hold on to that feeling. That one makes me feel better. Literally.',
  leaf: 'We will, we will, CHOP you! Stomp stomp clap. The plants are stomping along.',
};
function songsKnown() { const s = G.save; return s && G.mode !== 'arena' ? Object.keys(SONG_OF).filter(id => s.items[id]).length : 5; }

// ---- the outdoor music fills back in, one layer per song ----
// 0 songs: bass and kick, Jon's humming over a quiet world. 1: the full drum kit. 2: rhythm guitar
// and piano. 3: the lead melody. 4 and up: everything, choir and bells included.
const LAYERED = new Set(['overworld', 'cold', 'journey']);
function layerOn(e) {
  if (!LAYERED.has(Music.name) || G.mode === 'arena' || !G.save || G.state === 'title') return true;
  const n = songsKnown();
  if (e.inst === 'drum') return e.kind === 'k' || n >= 1;
  if (e.inst === 'bass' || e.inst === 'pad' || e.inst === 'pluck' || e.inst === 'flute') return true;
  if (e.inst === 'gtr' || e.inst === 'piano') return n >= 2;
  if (e.inst === 'lead') return n >= 3;
  return n >= 4;
}

// ---- the beat ----
// Read from the music engine's own clock, so the marker and the bonus match what you hear.
// With sound off, a steady 120 bpm clock keeps the beat visible.
function beatInfo() {
  const ac = Sound.ac, tr = Music.name && SCORE[Music.name];
  if (ac && Music.bus && tr && Music.on && !Sound.muted) {
    const q = 60 / tr.bpm, t = ac.currentTime - Music.start;
    const ph = ((t % q) + q) % q;
    return { q, ph, d: Math.min(ph, q - ph) };
  }
  const q = 0.5, ph = ((G.t % q) + q) % q;
  return { q, ph, d: Math.min(ph, q - ph) };
}
function onBeat(w) { return beatInfo().d <= (w || (isEasy() ? 0.12 : 0.09)); }
function beatHit(e) {
  floatText(e.x, e.y - 22, 'ON BEAT!', '#ffd84a');
  G.beatFlash = 0.12;
  Sound.tone([[1320, 0.04, 'square'], [1760, 0.06, 'square']], 0.035);
  if (G.save.items.thunder) G.save.rune = Math.min(RUNE_MAX, G.save.rune + 1);
}
// the HUD's beat marker: a note that pops on every beat once Jon knows a song
function drawBeatMarker() {
  if (G.mode === 'arena' || !G.save || songsKnown() < 1) return;
  const b = beatInfo(), k = 1 - Math.min(1, b.ph / (b.q * 0.5)), on = b.d <= 0.09;
  const x = 108, y = 12;
  if (on) { R(x - 5, y - 6, 11, 11, 'rgba(255,216,74,.35)'); }
  text('♪', x - 2, y + 4 - Math.round(k * 2), on ? '#ffd84a' : '#8a8ab0', 'left', 'outline');
  for (let i = 0; i < 5; i++) R(x - 4 + i * 3, y + 9, 2, 2, i < songsKnown() ? '#ffd84a' : 'rgba(255,255,255,.18)');
  if (G.beatFlash > 0) { G.beatFlash -= 1 / 60; ctx.globalAlpha = 0.25; R(0, 0, VW, VH, '#ffd84a'); ctx.globalAlpha = 1; }
}

// ---- the moment Jon remembers ----
function rememberSong(id) {
  const song = SONG_OF[id]; if (!song || flag('song:' + id)) return;
  setFlag('song:' + id); markHeard(song);
  const n = songsKnown(), name = SCORE[song].name.replace(/ \(.*\)$/, '');
  const layer = n === 1 ? 'The drums come back to the music of Norway.' : n === 2 ? 'The guitar and piano come back.' : n === 3 ? 'The melody comes back.' : n === 4 ? 'The choir and bells come back. Norway is loud again.' : 'Every song is back.';
  const lines = [['', `JON REMEMBERS A SONG: "${name}"`], ['Jon', SONG_LINES[id]], ['', layer]];
  if (n === 1) lines.push(['Jon', 'Feel that? Chop on the beat and I hit HARDER. Watch the little note up top.']);
  lines.paper = true;
  G.banner = '♪ ' + name.toUpperCase(); G.bannerT = 3; setJonFace('excited', 3);
  say(lines, writeSave);
}
const _giveItem = giveItem;
giveItem = function (id, after) {
  if (SONG_OF[id] && !flag('song:' + id) && G.mode !== 'arena') { const a = after; after = () => { if (a) a(); rememberSong(id); }; }
  return _giveItem(id, after);
};

// ---------------- Q41: the wombat ----------------
// Waddles. When Owen is close it digs in, tunnels under him and bursts up. A wombat's rump is a
// bony shield (a real wombat fact), so Jon bounces off it from behind: chop the face.
function updateWombat(e, dt, dx, dy, d, mr) {
  switch (e.st) {
    case 'idle': case 'waddle':
      e.st = 'waddle';
      if (d < 140) { e.fx = dx / d; e.fy = dy / d; tryMove(e, dx / d * e.speed * dt, dy / d * e.speed * dt, mr, 'walker'); }
      if (d < 110 && e.t > 2.2) { e.st = 'dig'; e.t = 0; }
      break;
    case 'dig':
      if (Math.random() < 0.5) G.fx.push({ x: e.x + rnd(-6, 6), y: e.y + 4, vx: rnd(-30, 30), vy: rnd(-50, -20), grav: 160, t: 0, life: 0.4, color: '#6b4a2a', size: 2 });
      if (e.t > 0.5) { e.under = true; e.st = 'tunnel'; e.t = 0; Sound.play('mud'); }
      break;
    case 'tunnel':
      tryMove(e, dx / d * 62 * dt, dy / d * 62 * dt, mr, 'walker');
      if (d < 8 || e.t > 2.2) { e.st = 'rise'; e.t = 0; }
      break;
    case 'rise':
      if (e.t > 0.45 * bossWindow()) {
        e.under = false; e.st = 'dazed'; e.t = 0; G.shake = 0.12; Sound.play('clank');
        for (let i = 0; i < 10; i++) G.fx.push({ x: e.x, y: e.y, vx: rnd(-60, 60), vy: rnd(-90, -30), grav: 200, t: 0, life: 0.5, color: pick(['#6b4a2a', '#8a6a3a']), size: 2 });
        if (dist(e, G.player) < 16 && !(G.player.dashing > 0)) hurtPlayer(1, e);
      }
      break;
    case 'dazed': if (e.t > 1.3 * bossWindow()) { e.st = 'waddle'; e.t = 0; } break;
  }
  e.safe = !!e.under || e.st === 'rise';
}

function updateSquirrel(e, dt, dx, dy, d, mr) {
  if (d > 170) return;

    e.fx = dx / d;

  if (e.burst <= 0) {

}

    const a = Math.atan2(e.y - p.y, e.x - p.x) + dt * 1.6 * e.spin, tx = p.x + Math.cos(a) * 54, ty = p.y + Math.sin(a) * 54;
    const ax = tx - e.x, ay = ty - e.y, al = Math.hypot(ax, ay) || 1;
    e.fx = ax / al; tryMove(e, ax / al * Math.min(e.speed, al * 4) * dt, ay / al * Math.min(e.speed, al * 4) * dt, mr, 'walker');
    const busy = G.ents.some(o => o !== e && o.type === 'cdog' && o.alive && (o.st === 'yip' || o.st === 'rush'));

// ---------------- Q42: the Peanut Butter Lion ----------------
// Asleep on the beach until Owen comes close. Prowls, crouches, pounces and lands in a sticky
// puddle of itself, and gets stuck: that's the opening. It roars globs of peanut butter that make
// more puddles (which slow Owen down). Half its health gone, it melts down to a cub and gets fast.
function updateLion(e, dt, dx, dy, d, mr) {
  const p = G.player, big = !e.cub;
  switch (e.st) {
    case 'idle': e.st = 'sleep'; break;
    case 'sleep': if (d < 60 || (e.hp < e.max && d < 200)) wakeLion(e); break;
    case 'intro': if (G.state === 'play') { e.st = 'prowl'; e.t = 0; } break;
    case 'prowl': {
      if (d > 260) { e.st = 'sleep'; e.t = 0; break; }   // Owen left the beach: it gets bored and dozes off
      const sp = big ? 26 : 50;
      e.fx = dx / d; e.fy = dy / d; tryMove(e, dx / d * sp * dt, dy / d * sp * dt, mr, 'walker');
      if (e.t > (big ? 1.8 : 1.1)) { e.t = 0; e.n = (e.n || 0) + 1; if (e.n % 3 === 0) e.st = 'roar'; else { e.st = 'crouch'; e.aim = { x: p.x, y: p.y }; } }
      break; }
    case 'crouch':
      if (e.t < 0.35) e.aim = { x: p.x, y: p.y };
      e.fx = Math.sign(e.aim.x - e.x) || e.fx;
      if (e.t > 0.65 * (isEasy() ? 1.25 : 1)) { e.st = 'pounce'; e.t = 0; e.from = { x: e.x, y: e.y }; e.to = lionLanding(e); Sound.play('charge'); }
      break;
    case 'pounce': {
      const k = Math.min(1, e.t / (big ? 0.6 : 0.45));
      e.x = e.from.x + (e.to.x - e.from.x) * k; e.y = e.from.y + (e.to.y - e.from.y) * k;
      e.z = Math.sin(k * Math.PI) * (big ? 34 : 22);
      if (k >= 1) {
        e.z = 0; e.st = 'stuck'; e.t = 0; G.shake = big ? 0.35 : 0.2; Sound.play('clank');
        CR.puddles.push({ x: e.x, y: e.y + 4, r: big ? 20 : 13, t: 0, life: 9 });
        if (dist(e, p) < (big ? 26 : 18) && !(p.dashing > 0)) hurtPlayer(big ? 2 : 1, e);
        floatText(e.x, e.y - (big ? 44 : 26), 'STUCK!', '#fadca0');
      }
      break; }
    case 'stuck': if (e.t > (big ? 1.6 : 1.1) * bossWindow()) { e.st = 'prowl'; e.t = 0; } break;
    case 'roar':
      if (e.t > 0.5 && !e.roared) {

function ask(prompt, opts, cb) {

}
function updateChoice(dt) {
  const c = G.choice; c.t += dt;
  if (just('down')) { c.sel = (c.sel + 1) % c.opts.length; Sound.play('menu'); }
  if (just('up')) { c.sel = (c.sel + c.opts.length - 1) % c.opts.length; Sound.play('menu'); }
  let pickI = null;
  if (c.t > 0.25 && just('a')) pickI = c.sel;

  G.mode = 'story'; resetJon();
  G.save = readSave() || newSave(); if (!G.save.diff) G.save.diff = defaultDiff(); applyJonPerks();
  G.player = makePlayer(); G.jon = makeJon();
  G.player.hp = G.save.maxHp;
  G.state = 'play';
  if (!G.save.x) return newGame();
  // after a game over you wake at the last runestone with the voodoo bond recharged
  if (fromCheckpoint && G.save.cp) { G.save.voodoo = true; G.save.voodoo2 = jonHas('bff'); loadMap(G.save.cp.map, G.save.cp.x, G.save.cp.y); writeSave(); return; }
  loadMap(G.save.map, G.save.x, G.save.y);
}

function startWarp(to, dest) {
  const M = MAPS[to] || {};
  G.state = 'warp'; G.warp = { to, dest, t: 0, done: false, kind: M.dungeon || M.interior || M.dark || M.redeye ? 'iris' : 'mosaic' };
  Sound.play('door');
}
function updateWarp(dt) {
  const w = G.warp; w.t += dt;
  if (w.t > 0.35 && !w.done) {
    w.done = true;
    loadMap(w.to, w.dest[0] * T + 8, w.dest[1] * T + 8);
  }
  if (w.t > 0.7) { G.state = 'play'; writeSave(); }
}

function onEnterScreen() {
  const has = type => G.ents.some(e => e.type === type && e.alive);
  markSeen();
  if (G.mapId === 'cavern' && !flag('intro:cavern')) { setFlag('intro:cavern'); say(STORY.cavern_enter); }
  if (has('knight') && !flag('intro:knight')) { setFlag('intro:knight'); Sound.play('boss'); showBossCard('knight'); say(STORY.knight); }
  if (G.map.redeye) redeyeEnter();
  HK.axes = [];
  if (G.mapId === 'barrow' && !flag('intro:barrow')) { setFlag('intro:barrow'); say(STORY.barrow_enter, () => showChapter(3)); }
  if (has('captain') && !flag('intro:captain')) { setFlag('intro:captain'); Sound.play('boss'); showBossCard('captain'); say(STORY.captain); }
  if (has('hank')) { Sound.play('boss'); showBossCard('hank'); say(flag('intro:hank') ? [['Hank', 'TURN... BACK...']] : STORY.hank); setFlag('intro:hank'); }
  if (has('attendant') && !flag('intro:attendant')) { setFlag('intro:attendant'); showBossCard('attendant'); say(STORY.attendant); }
  if (has('giant') && G.ents.find(e => e.type === 'giant').st === 'intro') { Sound.play('boss'); showBossCard('giant'); say(flag('intro:giant') ? [['Forest Giant', 'BACK FOR MORE, TREE-CHOPPER?']] : giantIntroLines()); setFlag('intro:giant'); }
  if (has('king')) { Sound.play('boss'); showBossCard('king'); say(flag('intro:king') ? [['Penguin King', 'AK! Back for more?']] : STORY.king); setFlag('intro:king'); }
  jonBossMemory();
  if (G.mapId === 'overworld' && flag('d2done') && !flag('chapter2_banner') && G.scr.x === 0 && G.scr.y === 0) {
    setFlag('chapter2_banner'); G.banner = 'CHAPTER 3 COMPLETE'; G.bannerT = 4; Sound.play('secret'); writeSave();
  }
  if (G.mapId === 'overworld' && flag('d1done') && !flag('chapter1_banner') && G.scr.x === 2 && G.scr.y === 0) {
    setFlag('chapter1_banner'); G.banner = STORY.chapter_done; G.bannerT = 4; Sound.play('secret'); writeSave();
  }
}

function update(dt) {
  G.t += dt;
  updateBossCard(dt);
  if (G.hitstop > 0) { G.hitstop -= dt; return; }
  G.shake = Math.max(0, G.shake - dt); G.flash = Math.max(0, G.flash - dt); G.bannerT = Math.max(0, G.bannerT - dt);
  if (G.state !== 'play') { JT.t = Math.max(0, JT.t - dt); JT.faceT = Math.max(0, JT.faceT - dt); }
  if (just('mute')) Sound.muted = !Sound.muted;
  techKeys();
  if (just('music')) Music.on = !Music.on;
  switch (G.state) {
    case 'title': {
      if (!G.titleOpts) { G.titleOpts = titleOptions(); G.titleBest = arenaBest(); }
      const opts = G.titleOpts;
      if (just('up')) { G.menuSel = (G.menuSel + opts.length - 1) % opts.length; G.confirmErase = false; Sound.play('menu'); }
      if (just('down')) { G.menuSel = (G.menuSel + 1) % opts.length; G.confirmErase = false; Sound.play('menu'); }
      G.menuSel = clamp(G.menuSel, 0, opts.length - 1);
      if (just('a') || just('menu') || just('tap')) {
        G.titleOpts = null;
        const o = opts[G.menuSel];
        if (o.disabled) { Sound.play('clank'); break; }
        if (o.id === 'arena') { startArena(); break; }
        if (o.id === 'mode') { setDifficulty(defaultDiff() === 'easy' ? 'normal' : 'easy'); G.titleOpts = null; break; }
        if (o.id === 'continue') continueGame();
        else if (o.id === 'new') {
          if (readSave() && !G.confirmErase) { G.confirmErase = true; break; }
          try { localStorage.removeItem(SAVE_KEY); } catch (e) {}
          newGame();
        }
      }
      return;
    }
    case 'talk': updateTalk(dt); return;
    case 'rhythm': updateRhythm(dt); return;
    case 'choice': updateChoice(dt); return;
    case 'cutscene': return;
    case 'hold':
      G.player.hold.t -= dt;
      if (G.player.hold.t <= 0) { G.player.hold = null; G.state = 'play'; G.afterHold(); }
      return;
    case 'warp': updateWarp(dt); return;
    case 'menu':
      if (just('right')) { G.menuPage = ((G.menuPage || 0) + 1) % 6; Sound.play('menu'); }
      if (just('left')) { G.menuPage = ((G.menuPage || 0) + 5) % 6; Sound.play('menu'); }
      if (G.menuPage >= 3) { if (G.menuPage === 3) updateJukebox(); else if (G.menuPage === 4) updateSpellsPage(); else updateBagPage(); if (just('menu') || just('tap')) { G.state = 'play'; G.jukebox = null; Sound.play('menu'); } return; }
      if (!G.menuPage && just('b')) { toggleDifficulty(); return; }
      if (!G.menuPage && just('c')) { toggleNotes(); return; }
      if (just('menu') || just('a') || just('tap')) { G.state = 'play'; G.jukebox = null; Sound.play('menu'); }
      return;
    case 'over':
      if (just('a') || just('menu') || just('tap')) { continueGame(true); }
      return;
    case 'jonlevel': updateJonLevel(); return;
    case 'levelup': case 'shop': case 'arenapause': case 'arenaover': updateArenaMenus(); return;
    case 'thunder': updateThunder(dt); updateFx(dt); return;
    case 'dying': updateDying(dt); updateFx(dt); return;
  }
  // play
  if (G.trans) { updateTransition(dt); return; }
  if (just('menu')) { G.state = G.mode === 'arena' ? 'arenapause' : 'menu'; Sound.play('menu'); return; }
  const s = G.save;
  if (anySpell()) { G.runeT = (G.runeT || 0) + dt; if (G.runeT > 5) { G.runeT = 0; s.rune = Math.min(RUNE_MAX, s.rune + 1); } }
  updateClock(dt);
  if (G.player.fuel > 0) G.player.fuel -= dt;
  updatePlayer(dt);
  if (G.state !== 'play') return;
  updateGround(dt); updateShots(dt); updateFire(dt); updateIcicles(dt); deed('seconds', dt);
  updateJon(dt);
  if (G.mode === 'arena') { updateArena(dt); if (G.state !== 'play') return; }
  if (G.map.redeye) updateRedeye(dt);
  updateJonTalk(dt); jonCompliment(dt);
  maybeJonLevelUp();
  if (G.state !== 'play') return;
  if (HK.axes.length) updateHankAxes(dt);
  for (const e of G.ents.slice()) {
    if (e.kind === 'enemy' && e.alive && e.freeze > 0) { e.freeze -= dt; e.flash = Math.max(0, e.flash - dt); }
    else if (e.kind === 'enemy' && e.alive && e.root > 0) { e.root -= dt; e.flash = Math.max(0, e.flash - dt); }
    else if (e.kind === 'enemy' && e.alive) { const nd = nightBold(e) ? dt * 1.2 : dt; if (e.slow > 0) { e.slow -= dt; updateEnemy(e, nd * 0.5); } else updateEnemy(e, nd); }
    else if (e.kind === 'pickup') updatePickup(e, dt);
    else if (e.kind === 'hazard') updateCart(e, dt);
    else if (e.kind === 'switch' || e.kind === 'log' || e.kind === 'faketree') e.cd = Math.max(0, e.cd - dt);
    if (G.state !== 'play') break;
  }
  updateFx(dt);
  if (G.state === 'play' && G.mapId === 'overworld') checkLogScene();
  if (G.state === 'play') checkScreenEdge();
}

function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, VW, VH);
  if (G.state === 'title') return drawTitle();
  if (G.state === 'rhythm' && G.rh) return drawRhythm();
  if (G.state === 'cutscene' || (G.state === 'talk' && G.talk && G.talk.back === 'cutscene')) { drawCutscene(); drawTalk(); return; }
  if (G.shake > 0) ctx.setTransform(1, 0, 0, 1, Math.round(rnd(-2, 2)), Math.round(rnd(-2, 2)));
  drawMap(); drawDecorGround();
  drawIceGlints();
  const p = G.player;
  const list = G.ents.filter(e => e.kind !== 'warp' || e.portal).map(e => ({ y: e.y, f: () => drawThing(e) }));
  list.push({ y: p.y, f: () => drawOwen(p.x - G.cam.x, p.y - G.cam.y) });
  list.push(...bigDrawList(), ...decorSorted());
  list.sort((a, b) => a.y - b.y).forEach(o => o.f());
  if (G.mode === 'arena') drawArenaWorld();
  drawHankAxes();
  if (!p.hold) drawJon();
  drawShots(); drawFire(); drawIcicles();
  drawFx();
  drawLightning();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  if (G.map.dungeon || G.map.dark) drawDungeonLight();
  drawAtmosphere();
  drawRedeyeOverlay();
  if (G.flash > 0) { ctx.globalAlpha = Math.min(1, G.flash * 3); R(0, 0, VW, VH, G.flashColor || '#fff'); ctx.globalAlpha = 1; }
  if (G.mode === 'arena') drawArenaHud(); else { drawHud(); drawCompass(); }
  if (G.state === 'warp' && G.warp.kind !== 'iris') { ctx.globalAlpha = 0.55 * clamp(1 - Math.abs(G.warp.t - 0.35) / 0.35, 0, 1); R(0, 0, VW, VH, '#000'); ctx.globalAlpha = 1; }
  if (G.bannerT > 0) { R(0, 92, VW, 34, 'rgba(0,0,0,.8)'); text(G.banner, VW / 2, 113, '#ffd84a', 'center'); }
  if (G.photoCard && G.state === 'talk') drawPhoto(G.photoCard, 128, 82, 104, 118, -0.04);
  if (G.state === 'talk') drawTalk();
  if (G.state === 'choice') drawChoice();
  if (G.state === 'menu') { if (G.menuPage === 5) drawBagPage(); else if (G.menuPage === 4) drawSpellsPage(); else if (G.menuPage === 3) drawJukebox(); else if (G.menuPage === 2) drawMapPage(); else if (G.menuPage) drawJonPage(); else drawMenu(); drawMenuTabs(G.menuPage || 0); }
  drawBossCard(); drawCombo();
  drawJonLevel(); drawLevelBurst();
  drawChapterCard();
  drawArenaMenus();
  if (G.state === 'over') {
    R(0, 0, VW, VH, 'rgba(40,0,0,.8)');
    text('GAME OVER', VW / 2, 96, '#ff6b6b', 'center');
    text('Even zombies need a nap.', VW / 2, 116, '#fff', 'center');
    text('Press Z to continue', VW / 2, 140, '#ffd84a', 'center');
    text('from your last runestone', VW / 2, 154, '#ffd84a', 'center');
  }
}

let last = performance.now();
G.menuSel = 0;
buildAll(); buildSnesArt(); buildAwesomeArt(); buildMagicArt(); buildGiantArt(); buildOwenArt(); buildCritterArt();
function frame(now) {
  try { runFrame(now); } catch (err) { console.error(err); }   // fixed 60 Hz steps; see tech.js
  requestAnimationFrame(frame);
}
(document.fonts && document.fonts.load ? document.fonts.load('8px "Press Start 2P"').catch(() => {}) : Promise.resolve())
  .then(() => requestAnimationFrame(t => { last = t; frame(t); }));
window.__game = G;

</script>
