  for (let i = 0; i < 26; i++) { const a = Math.random() * Math.PI * 2, sp = rnd(40, 140); G.fx.push({ x: e.x, y: e.y - 10, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 40, grav: 160, t: 0, life: 1.1, color: pick(['#ffd84a', '#ffffff', '#ff6b6b', '#7fd4ff']), size: 2 }); }
}

// ---------------- OWEN'S SCRIPT ----------------
// Every scene of dialogue in the game, editable in a panel under the screen. Owen's edits are
// saved in the artifact's shared database (so they follow him to any device, and Claude can read

(function bootScript() {
  const l = localScript(); SCRIPT.edits = l.edits || {}; SCRIPT.ch4 = l.ch4 || []; applyEdits();
  const c = window.claude && window.claude.use;
  if (!c) return;
  window.claude.use('db').then(db => {
    if (!db) { SCRIPT.status = 'Saved in this browser only.'; renderScript(); return; }
    SCRIPT.db = db;
    const timer = setTimeout(() => { SCRIPT.status = 'Still loading Owen\'s script…'; renderScript(); }, 10000);
    db.collection('script').onSnapshot(snap => {
      clearTimeout(timer);
      const edits = {};
      for (const d of snap.docs) { const v = d.data(); if (v && Array.isArray(v.lines)) edits[v.scene || d.id] = v.lines; }
      SCRIPT.edits = edits; applyEdits(); saveLocal(); SCRIPT.status = 'Saved for good. Works on any device.'; renderScript();
    }, () => { clearTimeout(timer); SCRIPT.status = 'Could not reach the save. Edits stay in this browser.'; renderScript(); });
    db.collection('chapter4').onSnapshot(snap => {
      SCRIPT.ch4 = snap.docs.map(d => ({ id: d.id, ...d.data() })).filter(p => p && Array.isArray(p.lines)).sort((a, b) => (a.order || 0) - (b.order || 0));
      saveLocal(); renderScript();
    }, () => {});
  }).catch(() => {});
})();

const docId = id => id.replace(/[^a-zA-Z0-9_-]/g, '_');
async function storeScene(id, lines) {
  if (lines) SCRIPT.edits[id] = lines; else delete SCRIPT.edits[id];
  applyEdits(); saveLocal();
  if (!SCRIPT.db) return true;
  try {
    const ref = SCRIPT.db.doc('script/' + docId(id));
    if (lines) await ref.set({ scene: id, lines, updatedAt: new Date().toISOString() }); else await ref.delete();
    return true;
  } catch (e) { SCRIPT.status = e && e.code === 'permission_denied' ? 'This account can read the script but not change it.' : 'Saved in this browser; the shared save did not take.'; return false; }
}
async function storePage(page) {
  const i = SCRIPT.ch4.findIndex(p => p.id === page.id);
  if (i >= 0) SCRIPT.ch4[i] = page; else SCRIPT.ch4.push(page);
  saveLocal();
  if (!SCRIPT.db) return;
  try { await SCRIPT.db.doc('chapter4/' + page.id).set({ order: page.order, title: page.title, lines: page.lines, updatedAt: new Date().toISOString() }); } catch (e) { SCRIPT.status = 'Saved in this browser; the shared save did not take.'; }
}

function drawPaper(x, y, w, h, tilt = 0) {
  ctx.save(); ctx.translate(x + w / 2, y + h / 2); ctx.rotate(tilt); ctx.translate(-w / 2, -h / 2);
  R(2, 3, w, h, 'rgba(0,0,0,.35)');                       // shadow
  R(0, 0, w, h, '#f4eedb');
  for (let ly = 14; ly < h - 2; ly += 11) R(2, ly, w - 4, 1, '#a9c0de');
  R(16, 0, 1, h, '#e08a8a');                               // the red margin
  for (let i = 0; i < 3; i++) { R(6, 10 + i * (h - 24) / 2, 4, 4, '#d8d0b8'); R(7, 11 + i * (h - 24) / 2, 2, 2, '#b8b098'); }   // binder holes
  for (let tx = 0; tx < w; tx += 3) if (hash(tx, h) % 3 === 0) R(tx, h - 1, 2, 1, '#d8d0b8');   // a rough bottom edge
  R(w / 2 - 14, -4, 28, 8, 'rgba(255,240,170,.75)');     // tape
  ctx.restore();
}
const INK = '#26305a', PENCIL = '#5a5a6e';

function slotImage(slot) {
  const s = NOTEBOOK.slots[slot]; if (!s || !s.assetId) return null;
  if (!s.img) { s.img = new Image(); s.img.src = '/_blob/' + s.assetId; }
  return s.img.complete && s.img.naturalWidth ? s.img : null;
}
function drawPhoto(slot, cx, cy, maxW, maxH, tilt) {
  const img = slotImage(slot); if (!img) return false;
  const k = Math.min(maxW / img.naturalWidth, maxH / img.naturalHeight), w = Math.round(img.naturalWidth * k), h = Math.round(img.naturalHeight * k);
  ctx.save(); ctx.translate(cx, cy); ctx.rotate(tilt);
  R(-w / 2 - 3, -h / 2 - 3, w + 6, h + 9, '#fbf8ef'); R(-w / 2 - 2, -h / 2 + h + 6, w + 6, 2, 'rgba(0,0,0,.3)');
  ctx.imageSmoothingEnabled = true; ctx.drawImage(img, -w / 2, -h / 2, w, h); ctx.imageSmoothingEnabled = false;
  R(-6, -h / 2 - 7, 12, 6, 'rgba(255,240,170,.8)');
  ctx.restore(); return true;
}

drawChapterCard = function () {
  const c = G.chapterCard;
  if (!c || G.state === 'menu' || G.state === 'title' || G.state === 'jonlevel') return;
  c.t += 1 / 60;
  if (c.t > c.life) { G.chapterCard = null; return; }
  const k = Math.min(1, c.t / 0.45), out = Math.max(0, (c.t - (c.life - 0.5)) / 0.5);
  const drop = Math.round((1 - k) * -90 + out * 140);
  const photo = !!slotImage('chapter:' + c.n), w = photo ? 220 : 180, x = (VW - w) / 2, y = 54 + drop;
  ctx.globalAlpha = 1 - out;
  drawPaper(x, y, w, 76, -0.03);
  const tx = photo ? x + 100 : VW / 2;
  text('CHAPTER ' + c.n, tx + (photo ? 0 : 0), y + 30, INK, 'center', false, 2);
  text(c.name.slice(0, Math.floor(Math.max(0, c.t - 0.3) * 22)), tx, y + 50, PENCIL, 'center', false);
  if (photo) drawPhoto('chapter:' + c.n, x + 40, y + 38, 56, 60, 0.06);
  ctx.globalAlpha = 1;
};

function jonBossMemory() {

// ---------------- RUSH Ø: a duel at Bjarne's piano ----------------
// Notes fall into three keys. ◀ / Z / ▶ (or tap the left, middle or right of the screen) on the beat.
const RH_LANES = [{ key: '◀', f: 659 }, { key: 'Z', f: 784 }, { key: '▶', f: 988 }];
const RH_FALL = 1.5, RH_HITY = 182;
function startDuel() {
  const gap = isEasy() ? 0.62 : 0.48, toks = SCORE.bjarne.sections.A.pluck.split(/[\s|]+/).filter(t => /[A-G]/.test(t));
  const notes = [];
  for (let i = 0; i < 36; i++) {
    const tok = toks[(i * 3) % toks.length], n = { C: 0, D: 1, E: 2, F: 0, G: 1, A: 2, B: 0 }[tok[0]];
    const extra = i > 12 && i % 5 === 0 ? 0.5 : 0;      // a few quick doubles once he warms up
    notes.push({ t: 2.2 + i * gap - extra * gap, lane: n, hit: 0 });
  }
  G.rh = { t: 0, notes, hits: 0, perfect: 0, combo: 0, maxCombo: 0, flash: [0, 0, 0], judge: null, started: false };
  G.state = 'rhythm'; Sound.play('menu');
}
function rhLaneInput() {
  const out = [];
  if (just('left')) out.push(0); if (just('a') || just('down') || just('up')) out.push(1); if (just('right')) out.push(2);
  if (just('tap') && G.tapX !== undefined) out.push(G.tapX < 0.36 ? 0 : G.tapX > 0.64 ? 2 : 1);
  return out;
}
function updateRhythm(dt) {
  const r = G.rh;
  if (!r.started) {
    if (just('a') || just('tap')) { r.started = true; r.t = 0; Sound.play('save'); }
    if (just('b') || just('menu')) { G.state = 'play'; G.rh = null; say([['Bjarne', 'Another time! RUSH Ø waits for no one. Except you.']]); }
    return;
  }
  r.t += dt;
  const win = isEasy() ? 0.2 : 0.15, perfect = 0.06;
  for (const lane of rhLaneInput()) {
    r.flash[lane] = 0.15;
    const n = r.notes.filter(n => !n.hit && n.lane === lane).sort((a, b) => Math.abs(a.t - r.t) - Math.abs(b.t - r.t))[0];
    if (n && Math.abs(n.t - r.t) <= win) {
      const p = Math.abs(n.t - r.t) <= perfect;
      n.hit = 1; r.hits++; if (p) r.perfect++; r.combo++; r.maxCombo = Math.max(r.maxCombo, r.combo);
      r.judge = { text: p ? 'PERFECT!' : 'GOOD', t: 0.5, color: p ? '#ffd84a' : '#9be08a' };
      Sound.tone([[RH_LANES[lane].f * (p ? 2 : 1), 0.09, 'square']], 0.05);
    }
  }
  for (const n of r.notes) if (!n.hit && r.t > n.t + win) { n.hit = -1; r.combo = 0; r.judge = { text: 'miss', t: 0.4, color: '#ff8a8a' }; }
  for (let i = 0; i < 3; i++) r.flash[i] = Math.max(0, r.flash[i] - dt);
  if (r.judge) { r.judge.t -= dt; if (r.judge.t <= 0) r.judge = null; }

}
function finishDuel() {
  const r = G.rh, pct = Math.round(100 * r.hits / r.notes.length), s = G.save;
  const first = pct >= 60 && !flag('rush_cleared');
  s.rushBest = Math.max(s.rushBest || 0, pct);
  G.state = 'play'; G.rh = null;
  const lines = [['', `RUSH Ø: ${pct}% of the notes. Best streak ${r.maxCombo}. Perfect ${r.perfect}.`]];
  if (pct >= 90) lines.push(['Bjarne', 'You... you played it FASTER than me. I need to sit down. I am sitting down.']);
  else if (pct >= 60) lines.push(['Bjarne', 'MAGNIFICENT! Most people faint at note four.']);
  else lines.push(['Bjarne', 'A fine start! Rush Ø humbles everyone. Even me. Mostly me.']);
  if (first) { setFlag('rush_cleared'); s.kr += 40; lines.push(['', 'Bjarne gave you 40 kroner.']); jonXP(20); }
  lines.push(['Jon', pct >= 60 ? 'I knew every note. EVERY note. You played them. Same thing.' : 'Again! I wasn\'t ready. I was ready. Again!']);
  say(lines, writeSave);
}

// Graphics pass: crisp pixel primitives (no smooth vector lines in a pixel world), bosses drawn at

// ---------------- native-resolution scaling (Scale2x / Scale3x) ----------------

  const out = mkCanvas(w * s, h * s), og = out.getContext('2d'), img = og.createImageData(w * s, h * s), dst = new Uint32Array(img.data.buffer);
  const P = (x, y) => src[clamp(y, 0, h - 1) * w + clamp(x, 0, w - 1)], W = w * s;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const E = P(x, y), B = P(x, y - 1), D = P(x - 1, y), F = P(x + 1, y), H = P(x, y + 1);
    const o = (y * s) * W + x * s;

      dst[o] = db ? D : E;

      dst[o + 2] = bf ? F : E;
      dst[o + W] = (db && E !== Gp) || (dh && E !== A) ? D : E;
      dst[o + W + 1] = E;
      dst[o + W + 2] = (bf && E !== I) || (hf && E !== C) ? F : E;

// Jon remembers who he is. Walter carved runes into Jon, and each rune is also a song. When Owen

// which song each rune brings back (titles are the game's own homages)
const SONG_OF = { fire: 'aero', frost: 'cold', thunder: 'zep', mend: 'journey', leaf: 'chop' };

  thunder: 'Stairway to Valhalla. All of it. Every note. Astrid was right: I remember who I am.',

function songsKnown() { const s = G.save; return s && G.mode !== 'arena' ? Object.keys(SONG_OF).filter(id => s.items[id]).length : 5; }

// ---- the outdoor music fills back in, one layer per song ----
// 0 songs: bass and kick, Jon's humming over a quiet world. 1: the full drum kit. 2: rhythm guitar
// and piano. 3: the lead melody. 4 and up: everything, choir and bells included.
const LAYERED = new Set(['overworld', 'cold', 'journey']);
function layerOn(e) {
  if (!LAYERED.has(Music.name) || G.mode === 'arena' || !G.save || G.state === 'title') return true;
  const n = songsKnown();
  if (e.inst === 'drum') return e.kind === 'k' || n >= 1;
  if (e.inst === 'bass' || e.inst === 'pad' || e.inst === 'pluck' || e.inst === 'flute') return true;
  if (e.inst === 'gtr' || e.inst === 'piano') return n >= 2;
  if (e.inst === 'lead') return n >= 3;
  return n >= 4;
}

// ---- the beat ----
// Read from the music engine's own clock, so the marker and the bonus match what you hear.
// With sound off, a steady 120 bpm clock keeps the beat visible.
function beatInfo() {
  const ac = Sound.ac, tr = Music.name && SCORE[Music.name];
  if (ac && Music.bus && tr && Music.on && !Sound.muted) {
    const q = 60 / tr.bpm, t = ac.currentTime - Music.start;
    const ph = ((t % q) + q) % q;
    return { q, ph, d: Math.min(ph, q - ph) };
  }

// ---------------- Q41: the wombat ----------------
// Waddles. When Owen is close it digs in, tunnels under him and bursts up. A wombat's rump is a
// bony shield (a real wombat fact), so Jon bounces off it from behind: chop the face.
function updateWombat(e, dt, dx, dy, d, mr) {
  switch (e.st) {
    case 'idle': case 'waddle':
      e.st = 'waddle';
      if (d < 140) { e.fx = dx / d; e.fy = dy / d; tryMove(e, dx / d * e.speed * dt, dy / d * e.speed * dt, mr, 'walker'); }
      if (d < 110 && e.t > 2.2) { e.st = 'dig'; e.t = 0; }
      break;
    case 'dig':
      if (Math.random() < 0.5) G.fx.push({ x: e.x + rnd(-6, 6), y: e.y + 4, vx: rnd(-30, 30), vy: rnd(-50, -20), grav: 160, t: 0, life: 0.4, color: '#6b4a2a', size: 2 });
      if (e.t > 0.5) { e.under = true; e.st = 'tunnel'; e.t = 0; Sound.play('mud'); }
      break;
    case 'tunnel':
      tryMove(e, dx / d * 62 * dt, dy / d * 62 * dt, mr, 'walker');
      if (d < 8 || e.t > 2.2) { e.st = 'rise'; e.t = 0; }
      break;
    case 'rise':
      if (e.t > 0.45 * bossWindow()) {
        e.under = false; e.st = 'dazed'; e.t = 0; G.shake = 0.12; Sound.play('clank');
        for (let i = 0; i < 10; i++) G.fx.push({ x: e.x, y: e.y, vx: rnd(-60, 60), vy: rnd(-90, -30), grav: 200, t: 0, life: 0.5, color: pick(['#6b4a2a', '#8a6a3a']), size: 2 });
        if (dist(e, G.player) < 16 && !(G.player.dashing > 0)) hurtPlayer(1, e);
      }
      break;
    case 'dazed': if (e.t > 1.3 * bossWindow()) { e.st = 'waddle'; e.t = 0; } break;
  }
  e.safe = !!e.under || e.st === 'rise';
}

// ---------------- Q41: the squirrel ----------------
// Darts in quick zigzags, freezes for a moment, then flings an acorn.
function updateSquirrel(e, dt, dx, dy, d, mr) {
  if (d > 170) return;
  if (e.st === 'aim') {
    e.fx = dx / d;
    if (e.t > 0.45) { CR.shots.push({ kind: 'acorn', x: e.x, y: e.y - 4, vx: dx / d * 115, vy: dy / d * 115, life: 1.6, spin: 0 }); Sound.play('throw'); e.st = 'dart'; e.t = 0; e.burst = 0; }
    return;
  }
  e.st = 'dart'; e.burst = (e.burst || 0) - dt;
  if (e.burst <= 0) {
    e.burst = rnd(0.3, 0.55); e.darts = (e.darts || 0) + 1;
    const away = d < 44 ? Math.PI : 0;
    e.dir = Math.atan2(dy, dx) + away + (Math.random() < 0.5 ? 1 : -1) * rnd(0.9, 1.5);
    if (e.darts >= 3 && d < 140) { e.st = 'aim'; e.t = 0; e.darts = 0; return; }
  }
  if (e.burst > 0.1) { const vx = Math.cos(e.dir), vy = Math.sin(e.dir); e.fx = vx; tryMove(e, vx * e.speed * dt, vy * e.speed * dt, mr, 'walker'); }
}

// ---------------- Q41: the Carolina dog ----------------
// Runs with its pack: they circle Owen, and one dog at a time yips and darts in.
function updateCdog(e, dt, dx, dy, d, mr) {
  if (d > 170 && e.st === 'idle') return;
  if (d > 230) { e.st = 'idle'; return; }   // Owen left: the pack stays home
  if (e.spin === undefined) { e.spin = Math.random() < 0.5 ? 1 : -1; e.wait = rnd(0.8, 2.2); }
  const p = G.player;
  if (e.st === 'idle' || e.st === 'circle') {
    e.st = 'circle';
    const a = Math.atan2(e.y - p.y, e.x - p.x) + dt * 1.6 * e.spin, tx = p.x + Math.cos(a) * 54, ty = p.y + Math.sin(a) * 54;
    const ax = tx - e.x, ay = ty - e.y, al = Math.hypot(ax, ay) || 1;
    e.fx = ax / al; tryMove(e, ax / al * Math.min(e.speed, al * 4) * dt, ay / al * Math.min(e.speed, al * 4) * dt, mr, 'walker');
    const busy = G.ents.some(o => o !== e && o.type === 'cdog' && o.alive && (o.st === 'yip' || o.st === 'rush'));
    if (e.t > e.wait && !busy) { e.st = 'yip'; e.t = 0; floatText(e.x, e.y - 14, 'YIP!', '#f2e8d4'); }
  } else if (e.st === 'yip') {
    e.fx = dx / d;
    if (e.t > 0.4) { e.st = 'rush'; e.t = 0; e.lx = dx / d; e.ly = dy / d; Sound.play('charge'); }
  } else if (e.st === 'rush') {
    const h = tryMove(e, e.lx * 175 * dt, e.ly * 175 * dt, mr, 'walker');
    if (e.t > 0.45 || h.hitX || h.hitY) { e.st = 'circle'; e.t = 0; e.wait = rnd(1.4, 2.6); e.spin *= -1; }
  }
}

// ---------------- Q42: the Peanut Butter Lion ----------------
// Asleep on the beach until Owen comes close. Prowls, crouches, pounces and lands in a sticky
// puddle of itself, and gets stuck: that's the opening. It roars globs of peanut butter that make
// more puddles (which slow Owen down). Half its health gone, it melts down to a cub and gets fast.
function updateLion(e, dt, dx, dy, d, mr) {
  const p = G.player, big = !e.cub;
  switch (e.st) {
    case 'idle': e.st = 'sleep'; break;
    case 'sleep': if (d < 60 || (e.hp < e.max && d < 200)) wakeLion(e); break;
    case 'intro': if (G.state === 'play') { e.st = 'prowl'; e.t = 0; } break;
    case 'prowl': {
      if (d > 260) { e.st = 'sleep'; e.t = 0; break; }   // Owen left the beach: it gets bored and dozes off
      const sp = big ? 26 : 50;
      e.fx = dx / d; e.fy = dy / d; tryMove(e, dx / d * sp * dt, dy / d * sp * dt, mr, 'walker');
      if (e.t > (big ? 1.8 : 1.1)) { e.t = 0; e.n = (e.n || 0) + 1; if (e.n % 3 === 0) e.st = 'roar'; else { e.st = 'crouch'; e.aim = { x: p.x, y: p.y }; } }
      break; }
    case 'crouch':
      if (e.t < 0.2) e.aim = { x: p.x, y: p.y };   // commits early, so a moving Owen gets clear
      e.fx = Math.sign(e.aim.x - e.x) || e.fx;
      if (e.t > 0.65 * (isEasy() ? 1.25 : 1)) { e.st = 'pounce'; e.t = 0; e.from = { x: e.x, y: e.y }; e.to = lionLanding(e); Sound.play('charge'); }
      break;
    case 'pounce': {
      const k = Math.min(1, e.t / (big ? 0.6 : 0.45));
      e.x = e.from.x + (e.to.x - e.from.x) * k; e.y = e.from.y + (e.to.y - e.from.y) * k;
      e.z = Math.sin(k * Math.PI) * (big ? 34 : 22);
      if (k >= 1) {
        e.z = 0; e.st = 'stuck'; e.t = 0; G.shake = big ? 0.35 : 0.2; Sound.play('clank');
        CR.puddles.push({ x: e.x, y: e.y + 4, r: big ? 20 : 13, t: 0, life: 9 });
        if (dist(e, p) < (big ? 22 : 15) && !(p.dashing > 0)) hurtPlayer(big ? 2 : 1, e);
        floatText(e.x, e.y - (big ? 44 : 26), 'STUCK!', '#fadca0');
      }
      break; }
    case 'stuck': if (e.t > (big ? 1.6 : 1.1) * bossWindow()) { e.st = 'prowl'; e.t = 0; } break;
    case 'roar':
      if (e.t > 0.5 && !e.roared) {
        e.roared = true; G.shake = 0.3; Sound.play('creep'); floatText(e.x, e.y - (big ? 48 : 28), 'RAWRRR', '#fadca0');
        const n = big ? 5 : 3;
        for (let i = 0; i < n; i++) { const a = Math.atan2(dy, dx) + (i - (n - 1) / 2) * 0.45; CR.shots.push({ kind: 'glob', x: e.x, y: e.y - 10, tx: p.x + Math.cos(a) * 26 * i * 0.4, ty: p.y + Math.sin(a) * 26 * i * 0.4, t: 0, dur: 0.8 + i * 0.08 }); }
        for (const o of G.ents) if (o.type === 'penguin' && o.alive && dist(o, e) < 220) o.fear = 4;   // even the penguins are scared of it
      }
      if (e.t > 1.1) { e.st = 'prowl'; e.t = 0; e.roared = false; }
      break;
  }
  if (big && e.hp <= e.max / 2 && e.st !== 'pounce') {
    e.cub = true; e.r = 10; e.st = 'prowl'; e.t = 0; G.shake = 0.3; Sound.play('kill');
    for (let i = 0; i < 24; i++) G.fx.push({ x: e.x + rnd(-20, 20), y: e.y - rnd(0, 30), vx: rnd(-70, 70), vy: rnd(-80, -10), grav: 220, t: 0, life: 0.8, color: pick(['#cc8c3c', '#e8b064', '#7a4818']), size: 3 });
    CR.puddles.push({ x: e.x, y: e.y + 4, r: 24, t: 0, life: 9 });
    floatText(e.x, e.y - 30, 'IT SHRANK!', '#fadca0');
    jonSay('lioncub', { force: true, face: 'excited' });
  }
  e.safe = ['sleep', 'intro', 'pounce', 'stuck'].includes(e.st);
}
function lionLanding(e) {

// the critter's own damage rules: 0 blocks the hit, otherwise a damage multiplier
function critterHit(e, how, jonHit, from) {
  if (e.type === 'wombat') {
    if (e.under || e.st === 'rise') return 0;
    const dx = from.x - e.x, dy = from.y - e.y, d = Math.hypot(dx, dy) || 1;
    if (jonHit && e.st !== 'dazed' && (dx / d * e.fx + dy / d * e.fy) < -0.4) {
      Sound.play('clank'); floatText(e.x, e.y - 16, 'BUTT ARMOR!', '#ffd84a'); jonSay('wombatbutt', { cooldown: 30 });
      e.kx = -dx / d * 80; e.ky = -dy / d * 80; return 0;

    if (jonHit && e.st !== 'stuck') { floatText(e.x, e.y - (e.cub ? 22 : 40), 'SQUISH', '#fadca0'); return 0.5; }

  return 1;
}

// ---------------- acorns, peanut butter globs and puddles ----------------
function updateCritterWorld(dt) {
  const p = G.player;
  for (const s of CR.shots) {
    if (s.kind === 'acorn') {
      s.x += s.vx * dt; s.y += s.vy * dt; s.life -= dt; s.spin += dt * 14;
      if (s.life < 1.5 && dist(s, p) < 7) { s.life = 0; hurtPlayer(1, s); }
      if (solidAt(s.x, s.y, 'jon')) s.life = 0;
    } else if (s.kind === 'glob') {
      s.t += dt;
      if (s.t >= s.dur) {
        s.life = 0; CR.puddles.push({ x: s.tx, y: s.ty, r: 9, t: 0, life: 7 });
        if (Math.hypot(s.tx - p.x, s.ty - p.y) < 10) hurtPlayer(1, { x: s.tx, y: s.ty });
        for (let i = 0; i < 5; i++) G.fx.push({ x: s.tx, y: s.ty, vx: rnd(-40, 40), vy: rnd(-50, -10), grav: 200, t: 0, life: 0.35, color: '#cc8c3c', size: 2 });
      }
    }
  }
  CR.shots = CR.shots.filter(s => s.kind === 'glob' ? s.life !== 0 : s.life > 0);
  for (const q of CR.puddles) q.t += dt;

// MY MUSIC: bring your own MIDI files. Pick .mid files on this device (OWEN'S SCRIPT, "My music")
// and the game's own band plays them: its bass, guitars, lead, pads and drum kit. They show up at
// the top of the Jukebox and one can be set to play everywhere.
// The files never leave the device. They are kept in this browser's storage, not uploaded, and not
// part of the shared game, so the game itself ships only its own original music.

const MYM = { songs: [], keep: null, preview: null, status: '', KEY: 'jontuka-mymusic', MAX: 8, MAX_EV: 9000, MAX_SEC: 420, MAX_VOICES: 20 };
const MYM_INST = ['bass', 'gtr', 'lead', 'pad', 'pluck', 'bell', 'flute', 'piano', 'choir'];
const MYM_DRUM = ['k', 's', 'r', 'h', 'o', 'c', 'th', 'tm', 'tl'];

// ---------------- reading a Standard MIDI File ----------------
// Returns { notes: [{ t, d, ch, note, vel, prog, tr, b }] (t, d in seconds; tr = track; b = start in beats), bpm, sig, beats }.
// beats[k] is the time in seconds of quarter-note beat k, through every tempo change.
function parseMidi(buf) {
  const d = new DataView(buf); let p = 0;
  const tag = at => String.fromCharCode(d.getUint8(at), d.getUint8(at + 1), d.getUint8(at + 2), d.getUint8(at + 3));
  if (d.byteLength < 22) throw new Error('not a MIDI file');
  if (tag(0) === 'RIFF') { for (p = 12; p + 8 < d.byteLength && tag(p) !== 'MThd'; p++); }       // .rmi wraps a normal file
  if (tag(p) !== 'MThd') throw new Error('not a MIDI file');
  const hl = d.getUint32(p + 4), ntr = d.getUint16(p + 10), div = d.getUint16(p + 12); p += 8 + hl;
  if (div & 0x8000 || !div) throw new Error('this kind of MIDI timing is not supported');
  const raw = [], tempos = [{ tick: 0, us: 500000 }]; let sig = null;
  for (let tr = 0; tr < ntr && p + 8 <= d.byteLength; tr++) {
    const id = tag(p), len = d.getUint32(p + 4); p += 8;
    const end = Math.min(d.byteLength, p + len);
    if (id !== 'MTrk') { p = end; continue; }
    let tick = 0, run = 0; const on = {}, prog = new Array(16).fill(0);
    const vlq = () => { let v = 0, b; do { b = d.getUint8(p++); v = (v * 128) + (b & 0x7f); } while ((b & 0x80) && p < end); return v; };
    while (p < end) {
      tick += vlq(); if (p >= end) break;
      let st = d.getUint8(p);
      if (st & 0x80) { p++; if (st < 0xf0) run = st; } else st = run;                           // running status
      if (st === 0xff) { const type = d.getUint8(p++), l = vlq(); if (type === 0x51 && l === 3) tempos.push({ tick, us: (d.getUint8(p) << 16) | (d.getUint8(p + 1) << 8) | d.getUint8(p + 2) }); if (type === 0x58 && l >= 2 && !sig) sig = [d.getUint8(p), 1 << d.getUint8(p + 1)]; p += l; if (type === 0x2f) break; continue; }
      if (st === 0xf0 || st === 0xf7) { p += vlq(); continue; }
      if (st < 0x80) break;                                                                      // garbage: give up on this track
      const hi = st & 0xf0, ch = st & 0x0f;
      if (hi === 0xc0 || hi === 0xd0) { const v = d.getUint8(p++); if (hi === 0xc0) prog[ch] = v; continue; }
      const a = d.getUint8(p++), b = d.getUint8(p++), key = ch * 128 + a;
      if (hi === 0x90 && b > 0) (on[key] = on[key] || []).push({ tick, vel: b, prog: prog[ch] });
      else if (hi === 0x80 || hi === 0x90) { const q = on[key]; if (q && q.length) { const s = q.shift(); raw.push({ tick: s.tick, end: tick, ch, note: a, vel: s.vel, prog: s.prog, tr }); } }
    }
    for (const key in on) for (const s of on[key]) raw.push({ tick: s.tick, end: s.tick + div, ch: key >> 7, note: key & 127, vel: s.vel, prog: s.prog, tr });   // notes never switched off
    p = end;
  }
  // ticks to seconds, through every tempo change
  tempos.sort((a, b) => a.tick - b.tick);
  let sec = 0; const map = tempos.map((t, i) => { if (i) sec += (t.tick - tempos[i - 1].tick) * tempos[i - 1].us / 1e6 / div; return { tick: t.tick, sec, us: t.us }; });
  const toSec = tk => { let m = map[0]; for (const x of map) { if (x.tick <= tk) m = x; else break; } return m.sec + (tk - m.tick) * m.us / 1e6 / div; };
  const first = tempos.find(t => t.us > 0) || tempos[0];
  const last = raw.reduce((m, n) => Math.max(m, n.end), 0), beats = []; for (let k = 0; k * div <= last + div; k++) beats.push(toSec(k * div));
  return { sig: sig || [4, 4], beats, notes: raw.map(n => ({ t: toSec(n.tick), d: Math.max(0.03, toSec(n.end) - toSec(n.tick)), ch: n.ch, note: n.note, vel: n.vel, prog: n.prog, tr: n.tr, b: n.tick / div })), bpm: Math.round(6e7 / (tempos[tempos.length > 1 ? 1 : 0].us || first.us)) };
}

// ---------------- arranging it for the game's band ----------------
// General MIDI program number -> one of the band's instruments
function mymInst(prog, note) {
  if (prog >= 32 && prog <= 39) return 0;                                    // basses
  if (prog >= 29 && prog <= 31) return 1;                                    // overdrive, distortion, harmonics
  if (prog <= 7) return 7;                                                   // pianos
  if (prog <= 15) return 5;                                                  // chromatic percussion
  if (prog <= 23) return 3;                                                  // organs
  if (prog <= 28) return 4;                                                  // clean guitars
  if (prog >= 52 && prog <= 54) return 8;                                    // choirs and voices
  if (prog <= 51 || prog === 55) return 3;                                   // strings and ensembles
  if (prog <= 71) return 2;                                                  // brass and reeds
  if (prog <= 79) return 6;                                                  // flutes and pipes
  if (prog <= 87) return prog === 87 && note < 48 ? 0 : 2;                   // synth leads
  if (prog <= 95) return 3;                                                  // synth pads
  if (prog >= 112 && prog <= 119) return 5;                                  // bells and steel drums
  return 4;
}
// General MIDI drum key -> one of the kit's sounds
function mymDrum(note) {
  if (note === 35 || note === 36) return 0;
  if (note === 38 || note === 40 || note === 39) return 1;
  if (note === 37) return 2;
  if (note === 42 || note === 44 || note === 51 || note === 53 || note === 59 || note === 54 || note === 69 || note === 70) return 3;
  if (note === 46) return 4;
  if (note === 49 || note === 52 || note === 55 || note === 57) return 5;
  if (note === 48 || note === 50) return 6;
  if (note === 45 || note === 47) return 7;
  if (note === 41 || note === 43) return 8;
  return -1;
}
// Returns the compact song that is stored: { name, bpm, len, n: [[ms, dur ms, instrument, note...]], d: [[ms, drum, accent]] }
function midiToSong(parsed, name) {
  const notes = parsed.notes.filter(n => n.note >= 12 && n.note <= 120).sort((a, b) => a.t - b.t);
  if (!notes.length) throw new Error('no notes found in that file');
  const t0 = notes[0].t, chords = new Map(), drums = new Map();
  let end = 0;
  for (const n of notes) {
    const t = n.t - t0; if (t > MYM.MAX_SEC) break;
    const ms = Math.round(t * 1000), slot = Math.round(t * 50);              // notes within 20 ms are one chord; it keeps the first one's exact time
    if (n.ch === 9) { const k = mymDrum(n.note); if (k >= 0) { const key = slot * 16 + k, e = drums.get(key); if (!e) drums.set(key, [ms, k, n.vel >= 112 ? 1 : 0]); else if (n.vel >= 112) e[2] = 1; end = Math.max(end, t + 0.2); } continue; }
    if (n.prog >= 115) {                                                     // percussion played on a pitched channel: woodblock, taiko, toms, synth drum
      const k = n.prog === 115 ? 2 : n.prog <= 118 ? (n.note >= 60 ? 6 : n.note >= 48 ? 7 : 8) : -1;   // anything above 118 is a sound effect: left out
      if (k >= 0) { const key = slot * 16 + k, e = drums.get(key); if (!e) drums.set(key, [ms, k, n.vel >= 112 ? 1 : 0]); end = Math.max(end, t + 0.2); }
      continue;
    }
    const inst = mymInst(n.prog, n.note), key = slot * 16 + inst, dur = Math.round(Math.min(6, n.d) * 1000);
    let c = chords.get(key); if (!c) chords.set(key, c = [ms, dur, inst]);
    c[1] = Math.max(c[1], dur); if (!c.includes(n.note, 3)) c.push(n.note);
    end = Math.max(end, t + Math.min(6, n.d));
  }
  const out = [];
  for (const c of chords.values()) {
    // keep a chord playable on a phone: the bass plays one note, melody instruments two, the rest four
    const ns = c.slice(3).sort((a, b) => a - b), max = c[2] === 0 ? 1 : c[2] === 2 || c[2] === 6 ? 2 : 4;
    const kept = c[2] === 0 ? [ns[0]] : ns.length <= max ? ns : [ns[0], ...ns.slice(-(max - 1))];
    out.push([c[0], c[1], c[2], ...kept]);
  }
  out.sort((a, b) => a[0] - b[0]);
  // never more than MAX_VOICES notes sounding at once (a dense piano or orchestra file would choke a
  // phone): when it is full, chords lose their lower notes first; the bass and the lead always get one
  // the bass and the lead play one line: a new note ends the one before it
  const last = {};
  for (const c of out) { if (c[2] !== 0 && c[2] !== 2) continue; const prev = last[c[2]]; if (prev && prev[0] + prev[1] > c[0]) prev[1] = Math.max(30, c[0] - prev[0]); last[c[2]] = c; }
  const live = [], fit = [];
  for (const c of out) {
    for (let i = live.length - 1; i >= 0; i--) if (live[i] <= c[0]) live.splice(i, 1);
    const room = MYM.MAX_VOICES - live.length, solo = c[2] === 0 || c[2] === 2;
    let k = c.length - 3;
    if (k > room) { if (room <= 0 && !solo) continue; k = Math.max(1, room); c.splice(3, c.length - 3 - k); }
    for (let i = 0; i < k; i++) live.push(c[0] + c[1]);
    fit.push(c);
  }
  out.length = 0; out.push(...fit);
  const d = [...drums.values()].sort((a, b) => a[0] - b[0]);
  // a drummer riding the crash (metal does): only the first of a run is a full crash, the rest are open hats
  let crash = -1e9; for (const k of d) { if (k[1] !== 5) continue; if (k[0] - crash < 1500) k[1] = 4; else crash = k[0]; }
  if (out.length + d.length > MYM.MAX_EV) {                                  // a very busy file: keep the first part
    const cut = [...out.map(e => e[0]), ...d.map(e => e[0])].sort((a, b) => a - b)[MYM.MAX_EV];
    while (out.length && out[out.length - 1][0] >= cut) out.pop();
    while (d.length && d[d.length - 1][0] >= cut) d.pop();
    end = cut / 1000;
  }

}
// the stored song -> what the music engine plays
function mymRegister(song) {
  const ev = [];
  for (const c of song.n) ev.push({ t: c[0] / 1000, d: c[1] / 1000, inst: MYM_INST[c[2]], f: c.slice(3).map(n => 440 * Math.pow(2, (n - 69) / 12)) });

  ev.sort((a, b) => a.t - b.t);

const mymClean = s => [...String(s).replace(/\.[A-Za-z0-9]{2,5}$/, '').replace(/[_]+/g, ' ')].filter(c => c === ' ' || PF_GLYPHS[c]).join('').replace(/\s+/g, ' ').trim().slice(0, 26) || 'My song';

// ---------------- keeping them on this device ----------------
function mymSave() {
  try { localStorage.setItem(MYM.KEY, JSON.stringify({ songs: MYM.songs, keep: MYM.keep })); return true; }
  catch (e) { MYM.status = 'There was no room to keep that one on this device. It will play until the game is closed.'; return false; }
}
function mymLoad() {
  try {
    const s = JSON.parse(localStorage.getItem(MYM.KEY) || 'null');
    if (!s || !Array.isArray(s.songs)) return;
    MYM.songs = s.songs.filter(x => x && x.id && Array.isArray(x.n) && Array.isArray(x.d) && x.len > 0).slice(0, MYM.MAX);
    MYM.songs.forEach(mymRegister);
    MYM.keep = MYM.songs.some(x => x.id === s.keep) ? s.keep : null;
  } catch (e) { MYM.songs = []; MYM.keep = null; }
}
function mymAdd(buf, fileName) {
  if (MYM.songs.length >= MYM.MAX) throw new Error(`there is room for ${MYM.MAX} songs; remove one first`);
  const song = midiToSong(parseMidi(buf), mymClean(fileName));
  song.id = 'my:' + Date.now().toString(36) + Math.floor(Math.random() * 1296).toString(36);
  MYM.songs.push(song); mymRegister(song);
  MYM.status = `Added "${song.name}". It is at the top of the Jukebox.`;
  mymSave();

}
function mymRemove(id) {
  MYM.songs = MYM.songs.filter(s => s.id !== id);
  if (MYM.keep === id) MYM.keep = null;
  if (MYM.preview === id) MYM.preview = null;
  if (G.jukebox === id) G.jukebox = null;
  delete Music.cache[id]; delete SCORE[id];
  MYM.status = 'Removed.'; mymSave();
}
function mymKeep(id) { MYM.keep = MYM.keep === id ? null : id; mymSave(); }
async function mymAddFiles(files) {
  for (const f of [...files]) {
    try {
      if (f.size > 3 * 1024 * 1024) throw new Error('that file is too big to be a MIDI song');
      const buf = f.arrayBuffer ? await f.arrayBuffer() : await new Promise((ok, no) => { const r = new FileReader(); r.onload = () => ok(r.result); r.onerror = no; r.readAsArrayBuffer(f); });
      mymAdd(buf, f.name);
    } catch (e) { MYM.status = `Could not use "${f.name}": ${e && e.message ? e.message : 'it could not be read'}.`; }
  }

}

  body.querySelectorAll('.mym-keep').forEach(b => b.onclick = () => { mymKeep(b.dataset.id); renderScript(); });
  body.querySelectorAll('.mym-rm').forEach(b => b.onclick = () => { mymRemove(b.dataset.id); renderScript(); });
}

// ===== classics.js =====
// Music that is free to use, played by the game's band beside the game's own songs. Nothing here is
// a copyrighted song: the sources, licenses and credits are in music/CLASSICS.md, the files are in
// music/midi/, and tools/arrange_classics.js arranges them into music/classics.json.
//
// Public-domain classics (scores from the Mutopia Project):
//   the Hidden Cave ................ Grieg, In the Hall of the Mountain King
//   mini-bosses .................... Grieg, March of the Trolls (the Penguin Knight, the Draugr Captain)
//   Baron Blubber's Sauna .......... Grieg, Wedding Day at Troldhaugen
//   the bell crypt ................. Grieg, The Mountaineer's Song
//   GAME OVER ...................... Grieg, Aase's Death
//   the palace lobby, once "dead Chilly" is lying in it ... Bach, Toccata and Fugue in D minor
//   Valhalla Arena, waves 9 to 12 .. Beethoven, Symphony No. 5
// Original rock and metal, dedicated to the public domain (CC0) by their composers on OpenGameArt:
//   Valhalla Arena, waves 5 to 8 ... nene, Endless Pain of Nightmares
//   Valhalla Arena, waves 13 to 16 . R0rque, Fight Harder... To Obtain a Better Victory!
//   Valhalla Arena, waves 17 to 20 . continuum.mid, Liberate the Stars
//   the Arena's shop ............... ZeMystic, Andromeda
// Owen's bands keep every place they already had in the story, and the bosses keep their music.
const CLASSIC_IDS = Object.keys(CLASSICS);
for (const id of CLASSIC_IDS) {
  const c = CLASSICS[id];
  mymRegister({ ...c, id });
  Music.cache[id].gain = c.gain;
  SCORE[id] = { name: c.name, bpm: c.bpm, by: c.by, work: c.work, fight: c.fight };
  if (!JUKE_ORDER.includes(id)) JUKE_ORDER.push(id);
}
// The Jukebox finds a song when it is heard. The Arena has no story save to remember that in, so
// songs heard there are remembered on their own.
const FOUND = { key: 'jontuka-found-songs', set: new Set() };
try { for (const id of JSON.parse(localStorage.getItem(FOUND.key) || '[]')) FOUND.set.add(id); } catch (e) {}
function songFound(id) { return flag('heard:' + id) || FOUND.set.has(id); }
function findSong(id) { if (FOUND.set.has(id)) return id; FOUND.set.add(id); try { localStorage.setItem(FOUND.key, JSON.stringify([...FOUND.set])); } catch (e) {} return id; }

const MINI_BOSSES = new Set(['knight', 'captain']);
const ARENA_SETS = ['arena', 'rock_endless', 'beethoven_fifth', 'rock_fight', 'rock_liberate'];   // four waves each
function classicFor(base) {
  if (G.state === 'over') return 'grieg_aase';
  if (!base || G.state === 'title' || G.state === 'credits' || G.state === 'cutscene' || (G.state === 'menu' && G.jukebox)) return base;
  if (G.mode === 'arena') {
    if (base === 'village') return findSong('rock_andromeda');                                       // the shop between waves
    if (base !== 'arena') return base;                                                             // boss waves keep the boss theme
    const id = ARENA_SETS[clamp(Math.floor((A.wave - 1) / 4), 0, ARENA_SETS.length - 1)];
    return id === 'arena' ? id : findSong(id);
  }
  if (!G.map) return base;
  if (base === 'boss') return G.ents.some(e => e.boss && e.alive && !MINI_BOSSES.has(e.type)) ? base : G.ents.some(e => e.alive && MINI_BOSSES.has(e.type)) ? 'grieg_trolls' : base;
  if (G.mapId === 'secret_cave') return 'grieg_king';
  if (G.mapId === 'sauna') return 'grieg_wedding';
  if (typeof inBellCrypt === 'function' && inBellCrypt()) return 'grieg_mountaineer';
  if (base === 'palace' && G.scr && G.scr.x === 1 && G.scr.y === 3 && flag('page10')) return 'bach_toccata';   // Chilly is part vampire. He gets the organ.
  return base;
}

// ===== main.js =====
// State machine and main loop.

function newGame() {
  G.mode = 'story'; resetJon();
  G.save = newSave(); applyJonPerks();
  G.player = makePlayer(); G.jon = makeJon();
  const st = MAPS.home.ents.find(e => e.t === 'start').at;
  G.state = 'play';
  loadMap('home', st[0] * T + 8, st[1] * T + 8);
  say(STORY.intro, () => showChapter(1));
}
function continueGame(fromCheckpoint) {
  G.mode = 'story'; resetJon();
  G.save = readSave() || newSave(); if (!G.save.diff) G.save.diff = defaultDiff(); applyJonPerks();
  G.player = makePlayer(); G.jon = makeJon();
  G.player.hp = G.save.maxHp;
  G.state = 'play';
  if (!G.save.x) return newGame();
  // after a game over you wake at the last runestone with the voodoo bond recharged
  if (fromCheckpoint && G.save.cp) { G.save.voodoo = true; G.save.voodoo2 = jonHas('bff'); loadMap(G.save.cp.map, G.save.cp.x, G.save.cp.y); writeSave(); return; }
  loadMap(G.save.map, G.save.x, G.save.y);
}

function startWarp(to, dest) {
  const M = MAPS[to] || {};
  G.state = 'warp'; G.warp = { to, dest, t: 0, done: false, kind: M.dungeon || M.interior || M.dark || M.redeye ? 'iris' : 'mosaic' };
  Sound.play('door');
}
function updateWarp(dt) {
  const w = G.warp; w.t += dt;
  if (w.t > 0.35 && !w.done) {
    w.done = true;
    loadMap(w.to, w.dest[0] * T + 8, w.dest[1] * T + 8);
  }
  if (w.t > 0.7) { G.state = 'play'; writeSave(); }
}

function onEnterScreen() {
  const has = type => G.ents.some(e => e.type === type && e.alive);
  markSeen();
  if (G.mapId === 'cavern' && !flag('intro:cavern')) { setFlag('intro:cavern'); say(STORY.cavern_enter); }
  if (has('knight') && !flag('intro:knight')) { setFlag('intro:knight'); Sound.play('boss'); showBossCard('knight'); say(STORY.knight); }
  if (G.map.redeye) redeyeEnter();
  HK.axes = [];
  if (G.mapId === 'barrow' && !flag('intro:barrow')) { setFlag('intro:barrow'); say(STORY.barrow_enter, () => showChapter(3)); }
  if (has('captain') && !flag('intro:captain')) { setFlag('intro:captain'); Sound.play('boss'); showBossCard('captain'); say(STORY.captain); }
  if (has('hank')) { Sound.play('boss'); showBossCard('hank'); say(flag('intro:hank') ? [['Hank', 'TURN... BACK...']] : STORY.hank); setFlag('intro:hank'); }
  if (has('attendant') && !flag('intro:attendant')) { setFlag('intro:attendant'); showBossCard('attendant'); say(STORY.attendant); }
  if (has('giant') && G.ents.find(e => e.type === 'giant').st === 'intro') { Sound.play('boss'); showBossCard('giant'); say(flag('intro:giant') ? [['Forest Giant', 'BACK FOR MORE, TREE-CHOPPER?']] : giantIntroLines()); setFlag('intro:giant'); }
  if (has('king')) { Sound.play('boss'); showBossCard('king'); say(flag('intro:king') ? [['Penguin King', 'AK! Back for more?']] : STORY.king); setFlag('intro:king'); }
  jonBossMemory();
  if (G.mapId === 'overworld' && flag('d2done') && !flag('chapter2_banner') && G.scr.x === 0 && G.scr.y === 0) {
    setFlag('chapter2_banner'); G.banner = 'CHAPTER 3 COMPLETE'; G.bannerT = 4; Sound.play('secret'); writeSave();
    G.creditsDue = true;   // the end of what is built so far: credits roll once the banner clears
  }
  if (G.mapId === 'overworld' && flag('d1done') && !flag('chapter1_banner') && G.scr.x === 2 && G.scr.y === 0) {
    setFlag('chapter1_banner'); G.banner = STORY.chapter_done; G.bannerT = 4; Sound.play('secret'); writeSave();
  }
}

function update(dt) {
  G.t += dt;
  updateBossCard(dt);
  if (G.hitstop > 0) { G.hitstop -= dt; return; }
  G.shake = Math.max(0, G.shake - dt); G.flash = Math.max(0, G.flash - dt); G.bannerT = Math.max(0, G.bannerT - dt);
  if (G.state !== 'play') { JT.t = Math.max(0, JT.t - dt); JT.faceT = Math.max(0, JT.faceT - dt); }
  if (just('mute')) Sound.muted = !Sound.muted;
  techKeys();
  if (just('music')) Music.on = !Music.on;
  switch (G.state) {
    case 'title': {
      if (!G.titleOpts) { G.titleOpts = titleOptions(); G.titleBest = arenaBest(); }
      const opts = G.titleOpts;
      if (just('up')) { G.menuSel = (G.menuSel + opts.length - 1) % opts.length; G.confirmErase = false; Sound.play('menu'); }
      if (just('down')) { G.menuSel = (G.menuSel + 1) % opts.length; G.confirmErase = false; Sound.play('menu'); }
      G.menuSel = clamp(G.menuSel, 0, opts.length - 1);
      if (just('a') || just('menu') || just('tap')) {
        G.titleOpts = null;
        const o = opts[G.menuSel];
        if (o.disabled) { Sound.play('clank'); break; }
        if (o.id === 'arena') { startArena(); break; }
        if (o.id === 'mode') { setDifficulty(defaultDiff() === 'easy' ? 'normal' : 'easy'); G.titleOpts = null; break; }
        if (o.id === 'continue') continueGame();
        else if (o.id === 'new') {
          if (readSave() && !G.confirmErase) { G.confirmErase = true; break; }
          try { localStorage.removeItem(SAVE_KEY); } catch (e) {}
          newGame();
        }
      }
      return;
    }
    case 'talk': updateTalk(dt); return;
    case 'rhythm': updateRhythm(dt); return;
    case 'choice': updateChoice(dt); return;
    case 'credits': updateCredits(dt); return;
    case 'cutscene': return;
    case 'hold':
      G.player.hold.t -= dt;
      if (G.player.hold.t <= 0) { G.player.hold = null; G.state = 'play'; G.afterHold(); }
      return;
    case 'warp': updateWarp(dt); return;
    case 'menu':
      if (G.opt) { updateOptions(); return; }
      if (just('right')) { G.menuPage = ((G.menuPage || 0) + 1) % 7; Sound.play('menu'); }
      if (just('left')) { G.menuPage = ((G.menuPage || 0) + 6) % 7; Sound.play('menu'); }
      if (G.menuPage >= 3) { if (G.menuPage === 3) updateJukebox(); else if (G.menuPage === 4) updateSpellsPage(); else if (G.menuPage === 5) updateBagPage(); else updateWall(); if (just('menu') || just('tap')) { G.state = 'play'; G.jukebox = null; Sound.play('menu'); } return; }
      if (!G.menuPage && just('b')) { toggleDifficulty(); return; }
      if (!G.menuPage && just('c')) { openOptions(); return; }
      if (just('menu') || just('a') || just('tap')) { G.state = 'play'; G.jukebox = null; Sound.play('menu'); }
      return;
    case 'over':
      if (just('a') || just('menu') || just('tap')) { continueGame(true); }
      return;
    case 'jonlevel': updateJonLevel(); return;
    case 'levelup': case 'shop': case 'arenapause': case 'arenaover': updateArenaMenus(); return;
    case 'thunder': updateThunder(dt); updateFx(dt); return;
    case 'dying': updateDying(dt); updateFx(dt); return;
  }
  // play
  if (G.trans) { updateTransition(dt); return; }
  if (just('menu')) { G.state = G.mode === 'arena' ? 'arenapause' : 'menu'; Sound.play('menu'); return; }
  const s = G.save;
  if (anySpell()) { G.runeT = (G.runeT || 0) + dt; if (G.runeT > 5) { G.runeT = 0; s.rune = Math.min(RUNE_MAX, s.rune + 1); } }
  updateClock(dt);
  if (G.player.fuel > 0) G.player.fuel -= dt;
  updatePlayer(dt);
  if (G.state !== 'play') return;
  updateGround(dt); updateShots(dt); updateFire(dt); updateIcicles(dt); deed('seconds', dt);
  updateJon(dt);
  if (G.mode === 'arena') { updateArena(dt); if (G.state !== 'play') return; }
  if (G.map.redeye) updateRedeye(dt);
  updateJonTalk(dt); jonCompliment(dt); updateTrophies(dt); updateElfWorld(dt); updateBells(dt);
  maybeJonLevelUp();
  if (G.state !== 'play') return;
  if (HK.axes.length) updateHankAxes(dt);
  for (const e of G.ents.slice()) {
    if (e.kind === 'enemy' && e.alive && e.freeze > 0) { e.freeze -= dt; e.flash = Math.max(0, e.flash - dt); }
    else if (e.kind === 'enemy' && e.alive && e.root > 0) { e.root -= dt; e.flash = Math.max(0, e.flash - dt); }
    else if (e.kind === 'enemy' && e.alive) { const nd = nightBold(e) ? dt * 1.2 : dt; if (e.slow > 0) { e.slow -= dt; updateEnemy(e, nd * 0.5); } else updateEnemy(e, nd); }
    else if (e.kind === 'pickup') updatePickup(e, dt);
    else if (e.kind === 'hazard') updateCart(e, dt);
    else if (e.kind === 'switch' || e.kind === 'log' || e.kind === 'faketree') e.cd = Math.max(0, e.cd - dt);
    if (G.state !== 'play') break;
  }
  updateFx(dt);
  if (G.state === 'play' && G.mapId === 'overworld') checkLogScene();
  if (G.state === 'play') checkScreenEdge();
}

function render() {
  syncJonCaption();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, VW, VH);
  if (G.state === 'title') return drawTitle();
  if (G.state === 'rhythm' && G.rh) return drawRhythm();
  if (G.state === 'credits' && G.credits) return drawCredits();

  if (G.state === 'warp' && G.warp.kind !== 'iris') { ctx.globalAlpha = 0.55 * clamp(1 - Math.abs(G.warp.t - 0.35) / 0.35, 0, 1); R(0, 0, VW, VH, '#000'); ctx.globalAlpha = 1; }
  if (G.bannerT > 0) { R(0, 92, VW, 34, 'rgba(0,0,0,.8)'); text(G.banner, VW / 2, 113, '#ffd84a', 'center'); }
  if (G.photoCard && G.state === 'talk') drawPhoto(G.photoCard, 128, 82, 104, 118, -0.04);
  if (G.state === 'talk') drawTalk();
  if (G.state === 'menu') { if (G.menuPage === 6) drawWall(); else if (G.menuPage === 5) drawBagPage(); else if (G.menuPage === 4) drawSpellsPage(); else if (G.menuPage === 3) drawJukebox(); else if (G.menuPage === 2) drawMapPage(); else if (G.menuPage) drawJonPage(); else drawMenu(); drawMenuTabs(G.menuPage || 0); drawOptions(); }
  drawBossCard(); drawCombo();
  drawJonLevel(); drawLevelBurst();
  drawChapterCard(); drawToasts(); drawSkipHint();
  if (G.state === 'choice') drawChoice();
  drawArenaMenus();
  if (G.state === 'over') {
    R(0, 0, VW, VH, 'rgba(24,0,6,.86)');
    drawPanel(28, 62, 200, 108);
    text('GAME OVER', VW / 2, 92, '#ff6b6b', 'center', 'outline', 2);
    text('Even zombies need a nap.', VW / 2, 112, '#f6f0dc', 'center', true);
    drawJonSprite(VW / 2, 128, Math.sin(G.t * 2) * 0.15, false, 'worried');
    text('Tap or press Z to continue', VW / 2, 150, '#ffd84a', 'center', true);
    text('from your last runestone', VW / 2, 162, '#ffd84a', 'center', true);
  }
}

let last = performance.now();
G.menuSel = 0;
buildAll(); buildSnesArt(); buildAwesomeArt(); buildMagicArt(); buildGiantArt(); buildOwenArt(); buildCritterArt(); buildElfArt(); buildBarrowArt();

(document.fonts && document.fonts.load ? document.fonts.load('8px "Press Start 2P"').catch(() => {}) : Promise.resolve())
