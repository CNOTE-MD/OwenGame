<title>Jöntuka</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  /* Layout: one centered 8:7 game screen, a short key legend under it, touch pad only on touch devices. */
  :root {
    --bg: #14121f;
    --panel: #221d38;
    --ink: #f3ecd2;
    --muted: #a79fc4;
    --axe: #8fd0ff;
    --gold: #ffd84a;
    --pixel: "Press Start 2P", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    color-scheme: dark;
  }
  html, body { background: var(--bg); color: var(--ink); }
  body { margin: 0; padding-inline: 16px; padding-block: 16px 24px; font-family: var(--pixel); font-size: 10px; line-height: 1.7; }
  main { max-width: 768px; margin-inline: auto; display: flex; flex-direction: column; gap: 14px; }
  .screen { position: relative; width: 100%; aspect-ratio: 8 / 7; background: #000; border: 3px solid var(--panel); outline: 2px solid var(--axe); }
  canvas { display: block; width: 100%; height: 100%; image-rendering: auto; touch-action: none; }
  .legend { display: flex; flex-wrap: wrap; gap: 8px 20px; color: var(--muted); }
  .legend b { color: var(--gold); font-weight: normal; }
  .pad { display: none; justify-content: space-between; align-items: center; gap: 16px; user-select: none; -webkit-user-select: none; }
  @media (pointer: coarse) { .pad { display: flex; } .legend { display: none; } }
  .stick { position: relative; width: 150px; height: 150px; flex: none; border-radius: 50%; touch-action: none;
    background: radial-gradient(circle, var(--panel) 0 55%, #2c2648 56% 100%); border: 2px solid var(--axe); }
  .stick::before { content: ''; position: absolute; inset: 22%; border-radius: 50%; border: 1px dashed #4a4570; }
  .knob { position: absolute; left: 50%; top: 50%; width: 64px; height: 64px; margin: -32px 0 0 -32px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #cfefff, var(--axe) 45%, #3a6a9a); border: 2px solid #0d0d33; pointer-events: none; }
  .stick.on .knob { box-shadow: 0 0 0 4px rgba(143,208,255,.35); }
  .btn { background: var(--panel); color: var(--ink); border: 2px solid var(--axe); font-family: var(--pixel); font-size: 12px; touch-action: none; border-radius: 4px; }
  .btn:active, .btn.on { background: var(--axe); color: var(--bg); }
  .btn:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
  .ab { display: grid; grid-template-columns: repeat(2, 76px); gap: 10px; }
  .ab .btn { width: 76px; height: 56px; border-radius: 28px; font-size: 9px; }
  .bar { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; color: var(--muted); }
  .bar .btn { font-size: 9px; padding: 8px 12px; }
  #padnote { display: none; color: var(--gold); }
  #padnote.on { display: inline; }
  /* Theater: fills the whole viewport (and real full screen where the browser allows it).
     Canvas scales to fit; the thumbstick and buttons float over the bottom corners. */
  body.theater { padding: 0; overflow: hidden; }
  body.theater main { max-width: none; position: fixed; inset: 0; display: block; }
  body.theater .screen { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: min(100vw, calc(100vh * 8 / 7)); height: min(100vh, calc(100vw * 7 / 8)); border: 0; outline: 0; }
  body.theater .legend, body.theater .bar { display: none; }
  body.theater .pad { display: flex; position: fixed; left: 0; right: 0; bottom: max(12px, env(safe-area-inset-bottom, 0px)); padding: 0 18px; pointer-events: none; }
  body.theater .pad > * { pointer-events: auto; }
  body.theater .stick, body.theater .ab .btn { opacity: 0.55; }
  body.theater .stick.on, body.theater .ab .btn.on { opacity: 0.95; }
  body.theater #exitfs { display: block; position: fixed; top: max(8px, env(safe-area-inset-top, 0px)); right: 8px; opacity: 0.6; z-index: 2; }
  #exitfs { display: none; }
  body.theater.nopad .pad { display: none; }
  @media (hover: hover) and (pointer: fine) { body.theater .pad { display: none; } }
  /* Owen's Script: a writer's notebook under the game screen. Pixel font for headings, a readable face for writing. */
  .btns { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
  .script { --paper: #1b1830; --line: #2e2a4c; background: var(--paper); border: 3px solid var(--panel); outline: 2px solid var(--gold); padding: 14px; display: flex; flex-direction: column; gap: 12px; position: relative;
    font-family: "Nunito", ui-rounded, system-ui, sans-serif; font-size: 15px; line-height: 1.45; color: var(--ink); }
  .script h2, .script h3, .script .tabs button, .script b { font-family: var(--pixel); font-weight: normal; }
  .st-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .st-head h2 { margin: 0; font-size: 12px; color: var(--gold); letter-spacing: .04em; }
  .script h3 { margin: 0; font-size: 9px; color: var(--axe); line-height: 1.6; min-width: 0; }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; border-bottom: 2px solid var(--line); padding-bottom: 8px; }
  .tabs button { background: none; border: 2px solid var(--line); color: var(--muted); font-size: 9px; padding: 8px 10px; border-radius: 4px; cursor: pointer; }
  .tabs button[aria-selected="true"] { border-color: var(--gold); color: var(--gold); }
  .script button { cursor: pointer; }
  .script button:focus-visible, .script input:focus-visible, .script textarea:focus-visible { outline: 3px solid var(--gold); outline-offset: 1px; }
  #st-save, .psave, #ch4-new { background: var(--gold); color: #1a1208; border: 0; border-radius: 4px; padding: 9px 14px; font-weight: 800; font-family: inherit; font-size: 14px; }
  .ghost { background: none; border: 2px solid var(--line); color: var(--ink); border-radius: 4px; padding: 7px 12px; font-family: inherit; font-size: 14px; }
  .ghost:hover { border-color: var(--axe); }
  .hint { margin: 0; color: var(--muted); }
  .empty { margin: 0; color: var(--ink); }
  .scenes { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 6px; }
  .scene { width: 100%; text-align: left; display: flex; justify-content: space-between; gap: 8px; align-items: baseline; background: #221d3a; border: 1px solid var(--line); color: var(--ink); padding: 9px 10px; border-radius: 4px; font: inherit; }
  .scene:hover { border-color: var(--axe); }
  .scene em { font-style: normal; font-size: 12px; color: #9be08a; flex: none; }
  .row { display: flex; align-items: center; gap: 8px; }
  .row.wrap { flex-wrap: wrap; }
  .grow { flex: 1; }
  .line { display: grid; grid-template-columns: minmax(84px, 130px) 1fr auto; gap: 6px; align-items: start; }
  .line input, .line textarea, .ptitle { background: #0f0d1e; color: var(--ink); border: 1px solid var(--line); border-radius: 4px; padding: 7px 8px; font: inherit; min-width: 0; }
  .line textarea { resize: vertical; }
  .line input { color: var(--gold); font-weight: 700; }
  .ptitle { flex: 1; }
  .page .line { grid-template-columns: minmax(84px, 130px) 1fr; }
  .x { background: none; border: 0; color: var(--muted); font-size: 14px; padding: 7px; }
  .x:hover { color: #ff8a8a; }
  .page { display: flex; flex-direction: column; gap: 6px; padding: 10px; border: 1px solid var(--line); border-radius: 4px; background: #221d3a; }
  .page b { font-size: 9px; color: var(--gold); flex: none; }
  .st-status { margin: 0; font-size: 13px; color: var(--muted); }
  .note { display: flex; flex-direction: column; gap: 4px; background: #f4eedb; color: #26305a; padding: 8px 10px 10px 26px; border-radius: 3px; background-image: linear-gradient(90deg, transparent 16px, #e08a8a 16px, #e08a8a 17px, transparent 17px); }
  .note span { font-weight: 800; font-size: 13px; } .note i { font-weight: 400; color: #5a5a6e; }
  .note textarea { background: transparent; border: 0; border-bottom: 1px solid #a9c0de; color: #26305a; font: inherit; resize: vertical; }
  .slots { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
  .slot { display: flex; flex-direction: column; gap: 6px; padding: 8px; background: #221d3a; border: 1px solid var(--line); border-radius: 4px; }
  .slot b { font-size: 8px; color: var(--gold); }
  .thumb { aspect-ratio: 4 / 3; max-width: 100%; background: #f4eedb; border-radius: 2px; display: grid; place-items: center; overflow: hidden; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; } .thumb span { color: #8a8098; font-size: 12px; }
  .up { text-align: center; font-size: 13px; padding: 6px; cursor: pointer; }
  .thumb img { cursor: zoom-in; }
  .lightbox { position: fixed; inset: 0; z-index: 20; background: rgba(10,8,18,.92); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
  .lightbox img { max-width: 100%; max-height: calc(100% - 56px); object-fit: contain; border-radius: 3px; }
  .toast { position: absolute; right: 14px; top: 12px; background: #9be08a; color: #102010; font-weight: 800; padding: 6px 10px; border-radius: 4px; }
  @media (max-width: 480px) { .line { grid-template-columns: 1fr auto; } .line input { grid-column: 1 / -1; } .page .line { grid-template-columns: 1fr; } }
</style>
<main>
  <div class="screen"><canvas id="g" width="256" height="224" tabindex="0" aria-label="Jöntuka game screen"></canvas></div>
  <div class="bar">
    <span>Controller: <b>stick</b> move · <b>A</b> swing · <b>B</b> throw · <b>X</b> thunder · <b>Y</b> horn · <b>RB/RT</b> dash · <b>Start</b> gear <span id="padnote">· connected ✓</span></span>
    <span class="btns"><button class="btn" id="scriptbtn" aria-controls="script">OWEN'S SCRIPT</button><button class="btn" id="fsbtn" aria-label="Play full screen">FULL SCREEN</button></span>
  </div>
  <button class="btn" id="exitfs" aria-label="Leave full screen">✕</button>
  <div class="legend">
    <span><b>Arrows / WASD</b> move</span>
    <span><b>Z / Space</b> swing Jon</span>
    <span><b>X</b> throw Jon</span>
    <span><b>Shift / F</b> Voodoo Dash</span>
    <span><b>C</b> Thunder Strike</span>
    <span><b>V</b> Demon Horn</span>
    <span><b>Enter</b> gear and quest</span>
    <span><b>M</b> all sound</span>
    <span><b>N</b> music</span>
  </div>
  <section id="script" class="script" hidden aria-label="Owen's Script">
    <header class="st-head"><h2>OWEN'S SCRIPT</h2><button class="ghost" id="st-close">Close ✕</button></header>
    <div class="tabs" role="tablist"><button role="tab" id="tab-scenes" aria-selected="true">Every scene</button><button role="tab" id="tab-ch4" aria-selected="false">Chapter 4: Walter's Forge</button><button role="tab" id="tab-notebook" aria-selected="false">Notebook photos</button></div>
    <div id="st-body"></div>
    <p class="st-status" id="st-status"></p>
    <div class="toast" id="st-toast" hidden role="status"></div>
  </section>
  <div class="pad" aria-label="Touch controls">
    <div class="stick" id="stick" aria-label="Move: drag the thumbstick"><div class="knob" id="knob"></div></div>
    <div class="ab">
      <button class="btn" data-a="horn" aria-label="Demon Horn">HORN</button>
      <button class="btn" data-a="dash" aria-label="Voodoo Dash">DASH</button>
      <button class="btn" data-a="menu" aria-label="Gear menu">GEAR</button>
      <button class="btn" data-a="c" aria-label="Thunder Strike">RUNE</button>
      <button class="btn" data-a="b" aria-label="Throw Jon">THROW</button>
      <button class="btn" data-a="a" aria-label="Swing Jon or talk">SWING</button>
    </div>
  </div>
</main>

(function setupStick() {

    const r = base.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2, max = r.width * 0.38;

  if (gp.buttons[12] && gp.buttons[12].pressed) y = -1; if (gp.buttons[13] && gp.buttons[13].pressed) y = 1;

// Music: plays music/score.json (inlined as SCORE) with a small Web Audio band.
// Bass, distorted guitar, saw lead, pads, plucks, bells, flute, and a drum kit with toms.

  want(id) {

// which piece fits what is on screen
function musicFor() {
  const st = G.state;
  if (st === 'title') return 'title';
  if (st === 'cutscene' || (st === 'talk' && G.talk && G.talk.back === 'cutscene')) return (G.cutPages && G.cutPages[G.cut.i] && String(G.cutPages[G.cut.i].art).startsWith('taxi')) ? 'journey' : 'creepy';
  if (st === 'over' || st === 'arenaover') return null;
  if (st === 'menu' && G.jukebox) return G.jukebox;
  if (G.mode === 'arena') {
    if (st === 'shop' || st === 'levelup') return 'village';
    return G.ents.some(e => e.type === 'king' && e.alive) ? 'boss' : 'arena';
  }
  if (!G.map) return null;
  if (G.mapId === 'barrow') return G.ents.some(e => e.boss && e.alive) ? 'boss' : 'barrow';
  if (G.map.redeye) return G.ents.some(e => e.type === 'attendant' && e.alive) ? 'boss' : 'creepy';
  if (G.mapId === 'bjarne_house' && flag('bjarne_done')) return 'bjarne';
  if (G.mapId === 'subway') return 'aero';
  if (G.mapId === 'cavern') return G.ents.some(e => e.type === 'king' && e.alive) ? 'chop' : G.ents.some(e => e.boss && e.alive) ? 'boss' : 'palace';
  if (G.map.interior) return 'village';
  if (G.map.dark) return 'dungeon';
  if (G.map.dungeon) return G.ents.some(e => e.boss && e.alive) ? 'boss' : 'dungeon';
  if (G.scr.y === 1 && G.scr.x <= 1) return 'village';
  if (G.ents.some(e => e.type === 'giant' && e.alive)) return 'zep';   // Owen: more Led Zeppelin
  if (G.scr.y === 0 && G.scr.x === 1) return 'journey';   // the Muck Forest: don't stop choppin'
  if (G.scr.y === 0 && G.scr.x >= 2) return 'cold';       // the Frozen Path and Storm Peak
  return 'overworld';
}

function puff(x, y, color = '#fff', n = 7) {

    R(f.x - G.cam.x, f.y - G.cam.y, f.size, f.size, f.color);

}

function leaves(x, y, colors) {

// ---------- Owen ----------
function makePlayer() {
  return { x: 0, y: 0, vx: 0, vy: 0, fx: 0, fy: 1, hp: G.save.hp, inv: 0, cd: 0, kx: 0, ky: 0, walk: 0,
    launching: false, lp: 0, from: null, to: null, falling: 0, bump: 0, hold: null };
}
const facing4 = p => Math.abs(p.fx) > Math.abs(p.fy) ? { x: Math.sign(p.fx), y: 0 } : { x: 0, y: Math.sign(p.fy) || 1 };

function updatePlayer(dt) {
  const p = G.player, s = G.save;
  p.inv = Math.max(0, p.inv - dt); p.cd = Math.max(0, p.cd - dt); p.bump = Math.max(0, p.bump - dt);
  if (p.falling > 0) {
    p.falling -= dt;
    if (p.falling <= 0) {
      p.x = G.entry.x; p.y = G.entry.y; p.vx = p.vy = 0;
      hurtPlayer(1, null, true);
      if (!flag('tip:pit')) { setFlag('tip:pit'); say(STORY.pit_first); }
    }
    return;
  }
  p.dashCd = Math.max(0, (p.dashCd || 0) - dt);
  if (p.dashing > 0) return updateDash(dt);
  if (p.launching) {
    p.lp += dt / 0.7;
    const k = Math.min(p.lp, 1);
    p.x = p.from.x + (p.to.x - p.from.x) * k; p.y = p.from.y + (p.to.y - p.from.y) * k;
    if (p.lp >= 1) { p.launching = false; puff(p.x, p.y + 6, '#e8e0c8', 6); }
    return;
  }
  let v = inputVec();
  if (p.rooted > 0) { p.rooted -= dt; v = { x: 0, y: 0 }; if (Math.random() < 0.2) G.fx.push({ kind: 'leaf', x: p.x + rnd(-6, 6), y: p.y + rnd(-4, 6), vx: 0, vy: -10, grav: 0, t: 0, life: 0.4, color: '#58b840' }); }
  p.moving = !!(v.x || v.y);
  if (p.moving) { p.fx = v.x; p.fy = v.y; p.walk += dt * 14; }
  const onIce = tileAt(p.x, p.y) === 'i';
  p.boost = Math.max(0, (p.boost || 0) - dt);
  const spd = 72 * G.st.speed * (p.boost > 0 ? 1.4 : 1) * (p.dashing > 0 ? 1 : groundSpeed(p));
  if (onIce) { const k = Math.min(1, 2.2 * dt); p.vx += (v.x * spd * 1.1 - p.vx) * k; p.vy += (v.y * spd * 1.1 - p.vy) * k; }
  else { p.vx = v.x * spd; p.vy = v.y * spd; }
  const hit = tryMove(p, p.vx * dt, p.vy * dt, 5, 'player');
  if (onIce) {
    if (hit.hitX) p.vx *= -0.3; if (hit.hitY) p.vy *= -0.3;
    // skidding throws up frost
    if (Math.hypot(v.x * spd - p.vx, v.y * spd - p.vy) > 45 && Math.hypot(p.vx, p.vy) > 15 && Math.random() < 0.5)
      G.fx.push({ x: p.x + rnd(-3, 3), y: p.y + 6, vx: -p.vx * 0.2 + rnd(-10, 10), vy: rnd(-20, -5), t: 0, life: 0.35, color: Math.random() < 0.5 ? '#ffffff' : '#cfefff', size: 1 });
  }
  const kl = Math.hypot(p.kx, p.ky);
  if (kl > 1) { tryMove(p, p.kx * dt, p.ky * dt, 5, 'player'); const nl = Math.max(0, kl - 520 * dt); p.kx *= nl / kl; p.ky *= nl / kl; }

  if (v.x || v.y) {
    const f = facing4(p), c = tileAt(p.x + f.x * 9, p.y + f.y * 9);
    if ((c === 'L' || c === 'K') && p.bump <= 0) tryUnlock(Math.floor((p.x + f.x * 9) / T), Math.floor((p.y + f.y * 9) / T), c);
  }
  const here = tileAt(p.x, p.y);
  if (here === '~') {
    p.launching = true; p.lp = 0; p.from = { x: p.x, y: p.y }; p.to = nearestDry(p.x, p.y); p.inv = 1.2;
    ripple(p.x, p.y); ripple(p.x, p.y, 0.15);
    G.jon.mode = 'follow'; Sound.play('splash'); puff(p.x, p.y, '#bfe0ff', 10);

  for (const e of G.ents) {
    if (e.kind === 'warp' && Math.abs(e.x - p.x) < 8 && Math.abs(e.y - p.y) < 8) return startWarp(e.def.to, e.def.dest);

    if (tileAt(px, py) === 'D' && G.mapId === 'overworld') return say(STORY.house);

  } else if (just('b') && G.jon.mode === 'follow') {
    G.jon.throw(p.x, p.y, p.fx, p.fy); Sound.play('throw');
  } else if (just('dash')) {
    startDash();
  } else if (just('horn')) {

  } else if (just('c')) {

  } else if (just('spell')) {

function tryUnlock(tx, ty, c) {

  if (c === 'K' && !s.bigkeys[G.mapId]) return say(STORY.bossdoor);

  // open the whole door (both tiles, both sides)

  while (q.length) {

    if (seen.has(k) || tile(x, y) !== c) continue;

    q.push([x + 1, y], [x - 1, y], [x, y + 1], [x, y - 1]);

    if (Math.random() < 0.25) jonSay('thrown', { cooldown: 14 });

// draw a sprite with its feet at (x, y)
function spr(c, x, y, opts = {}) {
  if (!c) return;
  let sc = opts.scale || 1; if ((sc === 2 || sc === 3) && typeof up === 'function') { c = up(c, sc); sc = 1; }

  ctx.drawImage(img, Math.round(x - w / 2), Math.round(y - h + (opts.foot || 1) * (opts.scale || 1)), w, h);

function drawTileB(c, ox, oy, tx, ty) {
  if (!TILE_B.includes(c)) return false;
  const v = hash(tx, ty) % 4, snowy = SNOWY(tx, ty);
  const frame = c === 't' || c === 'p' ? Math.floor(G.t * 9) % 4 : c === 'l' ? Math.floor(G.t * 4) % 8 : c === 'X' ? Math.floor(G.t * 3) % 4 : 0;
  const extra = c === 'h' ? (shutterClosed(tx, ty) ? 'c' : 'o') : c === 'G' ? (gatesDown() ? 'd' : 'u') : '';
  const nbKey = 'YrVZQCk'.includes(c) ? [tile(tx, ty - 1), tile(tx, ty + 1), tile(tx - 1, ty), tile(tx + 1, ty)].join('') + (ty === 0 ? 't' : '') + (tx % 5) + (tx % 4) + G.mapId : '';
  const key = `B${c}|${v}|${frame}|${extra}|${snowy ? 1 : 0}|${nbKey}`;
  let img = TILE_CACHE.get(key);
  if (img === undefined) { img = renderTileB(c, v, frame, extra, tx, ty, snowy); TILE_CACHE.set(key, img); }
  ctx.drawImage(img, ox, oy);
  return true;
}

// ---------------- Flight 364 on the airstrip ----------------
function planeImage(h) {
  const W = (h.x1 - h.x0 + 1) * T + 12, H = (h.y1 - h.y0 + 1) * T + 16;
  const fx0 = 6, fx1 = W - 6, fy0 = (h.fy0 - h.y0) * T + 8 + 2, fy1 = (h.fy1 - h.y0 + 1) * T + 8 - 2;
  const mid = (fy0 + fy1) / 2, rad = (fy1 - fy0) / 2;
  return makeImg(W, H, (P, has) => {
    const rect = (x, y, w, hh, c, a) => { for (let yy = y; yy < y + hh; yy++) for (let xx = x; xx < x + w; xx++) P(xx, yy, c, a); };
    // shadow on the ground
    for (let y = fy1 + 2; y < fy1 + 8; y++) for (let x = fx0 + 10; x < fx1; x++) P(x, y, '#000000', 50);
    // wings (swept back) with engines, top and bottom
    const wx = (h.wingX - h.x0) * T + 6;
    for (const dir of [-1, 1]) {
      for (let k = 0; k < 22; k++) {
        const y = dir < 0 ? fy0 - 1 - k : fy1 + k, x0 = wx + Math.round(k * 0.8), x1 = x0 + 26 - Math.round(k * 0.5);
        if (y < 0 || y >= H) continue;
        for (let x = x0; x < x1; x++) P(x, y, k > 18 ? '#9aa2ae' : x < x0 + 2 ? '#e8ecf2' : '#c4cad4');
        P(x0 - 1, y, OUTLINE); P(x1, y, OUTLINE);
      }
      const ey = dir < 0 ? fy0 - 12 : fy1 + 6;
      rect(wx + 6, ey, 12, 6, '#7a808c'); rect(wx + 6, ey, 12, 2, '#a8aeba'); rect(wx + 5, ey + 1, 2, 4, '#20242c'); rect(wx + 5, ey - 1, 14, 1, OUTLINE); rect(wx + 5, ey + 6, 14, 1, OUTLINE);
    }
    // tail stabilizers and the red fin
    for (const dir of [-1, 1]) for (let k = 0; k < 9; k++) { const y = dir < 0 ? fy0 - 1 - k : fy1 + k; for (let x = fx1 - 22 + k; x < fx1 - 8; x++) P(x, y, '#c4cad4'); P(fx1 - 23 + k, y, OUTLINE); }
    // fuselage: a long capsule, white on top shading to grey
    for (let y = fy0; y <= fy1; y++) for (let x = fx0; x <= fx1; x++) {
      const dy = (y - mid) / rad;
      const capL = x < fx0 + rad * 1.6 ? Math.pow((x - (fx0 + rad * 1.6)) / (rad * 1.6), 2) + dy * dy > 1 : false;
      const capR = x > fx1 - rad * 0.8 ? Math.pow((x - (fx1 - rad * 0.8)) / (rad * 0.8), 2) + dy * dy > 1 : false;
      if (capL || capR) continue;
      P(x, y, dy < -0.6 ? '#ffffff' : dy < 0.2 ? '#eef0f4' : dy < 0.65 ? '#cfd4dc' : '#a8aeb8');
    }
    for (let x = fx0 + 6; x < fx1 - 4; x++) { if (has(x, Math.round(mid) + 2)) P(x, Math.round(mid) + 2, '#c0392b'); if (has(x, Math.round(mid) + 3)) P(x, Math.round(mid) + 3, '#2a4a8a'); }
    for (let x = fx0 + 20; x < fx1 - 18; x += 6) { P(x, Math.round(mid) - 3, '#3a5a8a'); P(x + 1, Math.round(mid) - 3, '#3a5a8a'); P(x, Math.round(mid) - 2, '#5a7aaa'); }
    for (const [x, y] of [[fx0 + 4, mid - 3], [fx0 + 5, mid - 3], [fx0 + 7, mid - 4], [fx0 + 8, mid - 4], [fx0 + 10, mid - 4]]) P(x, y, '#1a2a4a');
    for (let y = fy0 - 10; y < fy0 + 2; y++) for (let x = fx1 - 14 + (fy0 - y) / 2; x < fx1 - 4; x++) P(x, y, y < fy0 - 7 ? '#e05040' : '#c0392b');
    // outline the hull
    const edge = [];
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) if (!has(x, y) && (has(x + 1, y) || has(x - 1, y) || has(x, y + 1) || has(x, y - 1))) edge.push([x, y]);
    for (const [x, y] of edge) P(x, y, OUTLINE);
  });
}

// ===== bigart.js =====
// Big scenery, A Link to the Past style: 2x2-tile trees with a canopy Owen walks behind,
// and whole buildings drawn as one piece (log walls, shingled roofs, chimneys with smoke).
// The map ASCII doesn't change: computeBigs() finds the shapes when a map loads.

function makeImg(w, h, draw) {
  const c = mkCanvas(w, h), g = c.getContext('2d'), img = g.createImageData(w, h);
  const P = (x, y, hex, a = 255) => {
    x = Math.round(x); y = Math.round(y);
    if (x < 0 || y < 0 || x >= w || y >= h) return;
    const [r, gg, b] = hexRgb(hex), i = (y * w + x) * 4;
    if (a < 255 && img.data[i + 3]) { const k = a / 255; img.data[i] = img.data[i] * (1 - k) + r * k; img.data[i + 1] = img.data[i + 1] * (1 - k) + gg * k; img.data[i + 2] = img.data[i + 2] * (1 - k) + b * k; return; }
    img.data[i] = r; img.data[i + 1] = gg; img.data[i + 2] = b; img.data[i + 3] = a;
  };
  const has = (x, y) => x >= 0 && y >= 0 && x < w && y < h && img.data[(y * w + x) * 4 + 3] > 0;
  draw(P, has);
  g.putImageData(img, 0, 0);
  return c;
}

// ---------------- big trees (36 x 42 image over a 32 x 32 footprint) ----------------
const BIG_TREE_W = 36, BIG_TREE_H = 42;
function treeImage(variant, snowy) {
  const r = rng(variant * 977 + (snowy ? 5 : 1));
  const ramp = snowy ? ['#ffffff', '#dfe9f2', '#3e7a68', '#2a5a4c', '#1a3c32'] : ['#88d860', '#58b040', '#3a8a30', '#26682a', '#174a1c'];
  // the canopy is a union of lumpy circles; light comes from the top-left
  const lumps = [[18, 15, 16, 13], [9, 19, 9, 8], [27, 19, 9, 8], [18, 7, 11, 7], [11, 10, 7, 6], [25, 10, 7, 6]]
    .map(([x, y, rx, ry]) => [x + (r() - 0.5) * 2, y + (r() - 0.5) * 2, rx, ry]);
  const inCanopy = (x, y) => lumps.some(([cx, cy, rx, ry]) => { const nx = (x + 0.5 - cx) / rx, ny = (y + 0.5 - cy) / ry; return nx * nx + ny * ny <= 1; });
  return makeImg(BIG_TREE_W, BIG_TREE_H, (P, has) => {
    // ground shadow, offset down-right
    for (let y = 33; y < 42; y++) for (let x = 4; x < 34; x++) { const nx = (x - 19) / 15, ny = (y - 37) / 4.5; if (nx * nx + ny * ny <= 1) P(x, y, '#000000', 60); }
    // trunk with roots
    for (let y = 24; y < 39; y++) for (let x = 13; x < 23; x++) {
      const root = y > 34 ? (x - 18) * (x - 18) < (y - 30) * 4 : x >= 14 && x < 22;
      if (!root) continue;
      P(x, y, x < 15 ? '#5a3418' : x > 20 ? '#4a2810' : (x + y) % 5 === 0 ? '#6a3c1a' : '#8a5428');
    }
    for (let y = 26; y < 39; y++) { if (has(13, y) || has(14, y)) P(has(13, y) ? 12 : 13, y, OUTLINE); if (has(22, y) || has(21, y)) P(has(22, y) ? 23 : 22, y, OUTLINE); }
    for (let x = 12; x < 25; x++) if (has(x, 38)) P(x, 39, OUTLINE);
    // canopy fill
    for (let y = 0; y < 31; y++) for (let x = 0; x < BIG_TREE_W; x++) {
      if (!inCanopy(x, y)) continue;
      const nx = (x - 18) / 17, ny = (y - 14) / 14;
      const l = -nx * 0.65 - ny * 0.75 + (r() - 0.5) * 0.55;
      P(x, y, l > 0.7 ? ramp[0] : l > 0.25 ? ramp[1] : l > -0.2 ? ramp[2] : l > -0.6 ? ramp[3] : ramp[4]);
    }
    // leaf clusters: small dark crescents with a lit edge above
    for (let i = 0; i < 26; i++) {
      const x = 3 + Math.floor(r() * 30), y = 3 + Math.floor(r() * 24);
      if (!inCanopy(x, y) || !inCanopy(x + 3, y + 1)) continue;
      const dark = (x - 18) * 0.65 + (y - 14) * 0.75 > -4;
      P(x, y + 1, dark ? ramp[4] : ramp[3]); P(x + 1, y + 2, dark ? ramp[4] : ramp[3]); P(x + 2, y + 2, dark ? ramp[4] : ramp[3]); P(x + 3, y + 1, dark ? ramp[4] : ramp[3]);
      P(x + 1, y, ramp[1]); P(x + 2, y, ramp[1]);
    }
    if (snowy) for (let i = 0; i < 18; i++) { const x = 4 + Math.floor(r() * 28), y = 2 + Math.floor(r() * 12); if (inCanopy(x, y) && !inCanopy(x, y - 2)) { P(x, y, '#ffffff'); P(x + 1, y, '#ffffff'); P(x, y + 1, '#e8f0f8'); } }
    // outline around the canopy
    for (let y = 0; y < 32; y++) for (let x = 0; x < BIG_TREE_W; x++) {
      if (inCanopy(x, y)) continue;
      if (inCanopy(x + 1, y) || inCanopy(x - 1, y) || inCanopy(x, y + 1) || inCanopy(x, y - 1)) P(x, y, OUTLINE);
    }
    // canopy shadow onto the trunk
    for (let x = 13; x < 23; x++) for (let y = 24; y < 31; y++) if (!inCanopy(x, y) && has(x, y) && !inCanopy(x, y - 1) === false) P(x, y, '#000000', 90);
  });
}

// ---------------- buildings ----------------
function houseImage(h) {
  const tw = h.x1 - h.x0 + 1, th = h.y1 - h.y0 + 1;
  const W = tw * T + 8, H = th * T + 12;
  const roofH = (h.roofEnd - h.y0 + 1) * T - 2;   // roof ends just above the wall row
  const stall = !h.doors.length;
  const r = rng(h.x0 * 31 + h.y0 * 17);
  const oy = 12;                                      // room above the footprint for ridge and chimney
  return makeImg(W, H, (P) => {
    const rect = (x, y, w, hh, c, a) => { for (let yy = y; yy < y + hh; yy++) for (let xx = x; xx < x + w; xx++) P(xx, yy, c, a); };
    // ---- walls: horizontal logs with round ends ----
    const wallTop = oy + roofH - 2, wallBot = oy + th * T;
    for (let y = wallTop; y < wallBot; y++) for (let x = 4; x < W - 4; x++) {
      const k = (y - wallTop) % 5;
      P(x, y, k === 0 ? '#d8a060' : k === 4 ? '#5a3418' : k === 3 ? '#7a4a22' : '#a8703c');
    }
    for (let y = wallTop; y < wallBot; y += 5) for (const x of [4, W - 7]) { rect(x, y, 3, 4, '#e8c088'); P(x + 1, y + 1, '#a8703c'); P(x + 1, y + 2, '#a8703c'); }
    rect(4, wallBot - 2, W - 8, 2, '#3a2010');
    if (stall) {
      // Lars's stall: open front with shelves of jars
      rect(8, wallTop + 2, W - 16, wallBot - wallTop - 4, '#3a2412');
      for (let x = 10; x < W - 12; x += 6) { rect(x, wallTop + 4, 4, 5, ['#c0182b', '#7fd4ff', '#ffd84a'][(x / 6 | 0) % 3]); P(x + 1, wallTop + 3, '#d8d8e8'); P(x + 2, wallTop + 3, '#d8d8e8'); }
      rect(8, wallTop + 10, W - 16, 2, '#8a5428');
    } else {
      // windows with shutters, skipping door columns
      for (let c = 0; c < tw; c++) {
        const tx = h.x0 + c;
        if (h.doors.some(d => Math.abs(d - tx) <= 0) || (c % 2 === 1 && tw > 3)) continue;
        const x = 4 + c * T + 4, y = wallTop + 3;
        if (y + 8 > wallBot - 2) continue;
        rect(x - 1, y - 1, 10, 9, OUTLINE); rect(x, y, 8, 7, '#9fd0ff'); rect(x, y, 8, 2, '#d8f0ff'); rect(x + 3, y, 2, 7, '#5a3418'); rect(x, y + 3, 8, 1, '#5a3418');
        rect(x - 4, y - 1, 3, 9, '#2f6a3a'); rect(x + 9, y - 1, 3, 9, '#2f6a3a');
      }
      // arched doors
      for (const d of h.doors) {
        const x = 4 + (d - h.x0) * T + 2, y = wallBot - 15;
        rect(x - 1, y - 1, 14, 16, OUTLINE);
        for (let yy = 0; yy < 15; yy++) for (let xx = 0; xx < 12; xx++) {
          if (yy < 3 && (xx < 2 - yy || xx > 9 + yy)) continue;
          P(x + xx, y + yy, xx % 4 === 0 ? '#3a1e0c' : yy === 6 ? '#2a1408' : '#6a3c1a');
        }
        P(x + 9, y + 8, '#ffd84a'); P(x + 9, y + 9, '#c89a18');
        rect(x - 2, wallBot - 1, 16, 1, '#7a7a8c');
      }
      // a Viking round shield hangs by the door on wider houses
      if (tw >= 5) {
        const sx = 4 + (tw - 1) * T - 2, sy = wallTop + 4;
        for (let yy = -4; yy <= 4; yy++) for (let xx = -4; xx <= 4; xx++) { const d = xx * xx + yy * yy; if (d <= 16) P(sx + xx, sy + yy, d >= 12 ? OUTLINE : d <= 2 ? '#ffd84a' : (xx + yy) % 3 === 0 ? '#801818' : '#b03028'); }
      }
    }
    // ---- roof ----
    const roofTop = oy, roofBot = oy + roofH;
    for (let y = roofTop; y < roofBot; y++) {
      const inset = Math.max(0, 3 - Math.floor((y - roofTop) / 2));   // slight taper at the ridge
      for (let x = inset; x < W - inset; x++) {
        if (stall) {
          const stripe = Math.floor(x / 6) % 2;
          P(x, y, y < roofTop + 3 ? '#7a2018' : stripe ? '#f4ecd8' : '#c8302a');
          continue;
        }
        const row = Math.floor((y - roofTop) / 4), xx = (x + (row % 2) * 3) % 6, yy = (y - roofTop) % 4;
        const edge = yy === 3 || (yy === 2 && (xx === 0 || xx === 5));
        const light = 1 - (y - roofTop) / roofH;          // top of the roof faces the sun
        let c = edge ? '#6a1a12' : light > 0.66 ? '#e8644a' : light > 0.33 ? '#c84030' : '#a03024';
        if (!edge && yy === 0 && light > 0.33) c = '#f08a6a';
        P(x, y, c);
      }
    }
    if (stall) {
      // scalloped awning edge
      for (let x = 0; x < W; x++) { const s = Math.floor(x / 6) % 2; const d = 2 + Math.round(Math.sin((x % 6) / 6 * Math.PI) * 2); for (let k = 0; k < d; k++) P(x, roofBot + k, s ? '#f4ecd8' : '#c8302a'); P(x, roofBot + d, OUTLINE); }
    } else {
      // ridge cap and crossed gable beams (dragon-head ends)
      rect(2, roofTop, W - 4, 3, '#5a1810'); rect(2, roofTop, W - 4, 1, '#8a2a20');
      for (const [x, dir] of [[3, -1], [W - 4, 1]]) for (let k = 0; k < 6; k++) { P(x + dir * k * 0.6, roofTop - k, '#7a4a22'); P(x + dir * k * 0.6 + 1, roofTop - k, '#5a3418'); }
      // eave shadow on the wall
      rect(4, roofBot, W - 8, 3, '#000000', 90);
      // chimney
      if (tw >= 4) {
        const cx = W - 16, cy = roofTop - 6;
        rect(cx - 1, cy - 1, 10, 14, OUTLINE);
        for (let y = 0; y < 12; y++) for (let x = 0; x < 8; x++) P(cx + x, cy + y, (y % 4 === 3 || (x + (Math.floor(y / 4) % 2) * 4) % 8 === 0) ? '#5a5a6a' : x < 3 ? '#a8a8b8' : '#8a8a9a');
        rect(cx - 1, cy - 2, 10, 2, '#6a6a7a');
        h.chimney = { x: cx + 4, y: cy - 3 };
      }
    }
    // outline the roof silhouette
    for (let x = 0; x < W; x++) P(x, roofTop - 1, OUTLINE);
    for (let y = roofTop; y < roofBot; y++) { const inset = Math.max(0, 3 - Math.floor((y - roofTop) / 2)); P(inset - 1, y, OUTLINE); P(W - inset, y, OUTLINE); }
    if (!stall) for (let x = 0; x < W; x++) P(x, roofBot, OUTLINE);
    for (let y = wallTop; y < wallBot; y++) { P(3, y, OUTLINE); P(W - 4, y, OUTLINE); }
  });
}

// ---------------- find the shapes in a map ----------------
const BIG_CACHE = new Map();
function computeBigs() {
  G.bigs = []; G.claim = new Map(); G.canopy = new Set();
  if (G.map.dungeon || G.map.arena || G.mapId === 'home') return;
  const key = (x, y) => y * G.cols + x;
  // trees: pack 2x2 blocks of 'T' within a screen, scanning top-left first
  for (let ty = 0; ty < G.nrows - 1; ty++) for (let tx = 0; tx < G.cols - 1; tx++) {
    const cells = [[tx, ty], [tx + 1, ty], [tx, ty + 1], [tx + 1, ty + 1]];
    if (!cells.every(([x, y]) => G.rows[y][x] === 'T' && !G.claim.has(key(x, y)))) continue;
    const snowy = SNOWY(tx, ty), v = hash(tx, ty) % 3;
    for (const [x, y] of cells) G.claim.set(key(x, y), snowy ? 'n' : '.');
    // the canopy row is walkable when open ground lies above it: Owen walks behind the tree
    for (const x of [tx, tx + 1]) {
      const above = ty > 0 ? G.rows[ty - 1][x] : 'T';
      if (ty % SH !== 0 && !SOLID.has(above) && above !== '~' && above !== 'w') G.canopy.add(key(x, ty));
    }
    const ck = 'tree' + v + (snowy ? 's' : '');
    if (!BIG_CACHE.has(ck)) BIG_CACHE.set(ck, treeImage(v, snowy));
    G.bigs.push({ kind: 'tree', img: BIG_CACHE.get(ck), x: tx * T - 2, y: ty * T + 2 * T - BIG_TREE_H, sortY: ty * T + 2 * T - 2, tx, ty, w: 2, h: 2 });
  }
  // the airliner on the airstrip: plane body (P) and wings (q)
  const pc = [];
  for (let ty = 0; ty < G.nrows; ty++) for (let tx = 0; tx < G.cols; tx++) if ('Pq'.includes(G.rows[ty][tx])) pc.push([tx, ty]);
  if (pc.length) {
    const xs = pc.map(c => c[0]), ys = pc.map(c => c[1]), body = pc.filter(([x, y]) => G.rows[y][x] === 'P');
    const pl = { kind: 'plane', x0: Math.min(...xs), x1: Math.max(...xs), y0: Math.min(...ys), y1: Math.max(...ys),
      fy0: Math.min(...body.map(c => c[1])), fy1: Math.max(...body.map(c => c[1])), wingX: Math.min(...pc.filter(([x, y]) => G.rows[y][x] === 'q').map(c => c[0])) };
    for (const [x, y] of pc) G.claim.set(key(x, y), G.rows[y][x] === 'q' && (G.rows[y][x - 1] === 's' || G.rows[y][x + 1] === 's') ? 's' : '.');
    pl.img = planeImage(pl); pl.x = pl.x0 * T - 6; pl.y = pl.y0 * T - 8; pl.sortY = (pl.fy1 + 1) * T;
    G.bigs.push(pl);
  }
  // buildings: connected roof/wall/door tiles
  const seen = new Set();
  for (let ty = 0; ty < G.nrows; ty++) for (let tx = 0; tx < G.cols; tx++) {
    if (!'RHD'.includes(G.rows[ty][tx]) || seen.has(key(tx, ty))) continue;
    const q = [[tx, ty]], cells = [];
    seen.add(key(tx, ty));
    while (q.length) {
      const [x, y] = q.pop(); cells.push([x, y]);
      for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
        const nx = x + dx, ny = y + dy;
        if (nx < 0 || ny < 0 || nx >= G.cols || ny >= G.nrows || seen.has(key(nx, ny)) || !'RHD'.includes(G.rows[ny][nx])) continue;
        seen.add(key(nx, ny)); q.push([nx, ny]);
      }
    }
    const xs = cells.map(c => c[0]), ys = cells.map(c => c[1]);
    const h = { kind: 'house', x0: Math.min(...xs), x1: Math.max(...xs), y0: Math.min(...ys), y1: Math.max(...ys), doors: [] };
    h.roofEnd = Math.max(...cells.filter(([x, y]) => G.rows[y][x] === 'R').map(c => c[1]), h.y0);
    for (const [x, y] of cells) { if (G.rows[y][x] === 'D') h.doors.push(x); G.claim.set(key(x, y), '.'); }
    h.img = houseImage(h);
    h.x = h.x0 * T - 4; h.y = h.y0 * T - 12; h.sortY = (h.y1 + 1) * T - 1;
    G.bigs.push(h);
  }
}

function claimedGround(tx, ty) { return G.claim ? G.claim.get(ty * G.cols + tx) : undefined; }
function isCanopy(tx, ty) { return !!(G.canopy && G.canopy.has(ty * G.cols + tx)); }

function bigDrawList() {
  const out = [], p = G.player;
  for (const b of G.bigs || []) {
    const sx = b.x - G.cam.x, sy = b.y - G.cam.y;
    if (sx > VW || sy > VH || sx + b.img.width < 0 || sy + b.img.height < 0) continue;
    out.push({ y: b.sortY, f: () => {
      // a little see-through when Owen is hidden behind it, so kids never lose him
      const behind = p.y < b.sortY && p.x > b.x + 2 && p.x < b.x + b.img.width - 2 && p.y > b.y + 4;
      ctx.globalAlpha = behind ? 0.72 : 1;
      ctx.drawImage(b.img, Math.round(sx), Math.round(sy));
      ctx.globalAlpha = 1;
      if (b.chimney) {
        for (let i = 0; i < 3; i++) {
          const k = ((G.t * 0.6 + i / 3) % 1), x = sx + b.chimney.x + Math.sin(k * 6 + i) * 2 + k * 6, y = sy + b.chimney.y - k * 18;
          ctx.globalAlpha = qa(0.55 * (1 - k)); pxEllipseFill(x, y, 2 + k * 3, 2 + k * 3, '#e8e8f0'); ctx.globalAlpha = 1;
        }
      }
    } });
  }
  return out;
}

// ===== redeye.js =====
// The Red-Eye: optional side dungeon inside Flight 364. Creepy, not gory: darkness, flicker,
// scratching, seats that move while the lights are out, and a flight attendant you only see
// in the flashes. Reward: a heart container and the Demon Horn (V: enemies flee).

const RE = { blackout: 0, nextBlack: 4, scratchT: 3, whisperT: 6, scare: 0, layout: 0, shots: [] };

function redeyeEnter() {
  Object.assign(RE, { blackout: 0, nextBlack: 3 + Math.random() * 3, scratchT: 2, whisperT: 5, shots: [] });
  if (G.ents.some(e => e.type === 'attendant' && e.alive)) { RE.scare = 0.22; Sound.play('creep'); Sound.play('scratch'); }
}

function phantomSolid() { return RE.layout === 1; }

function updateRedeye(dt) {
  const p = G.player;
  // blackouts: the lights cut out, and when they come back the phantom seats may have moved
  RE.nextBlack -= dt;

const DASH_TIME = 0.22, DASH_SPEED = 340;
function startDash() {
  const p = G.player, s = G.save;

}

function updateDash(dt) {
  const p = G.player;
  if (!isFinite(p.x) || !isFinite(p.y)) { p.x = G.entry.x; p.y = G.entry.y; p.dashing = 0; return; }
  p.dashing -= dt;
  const step = DASH_SPEED * dt, r = 5;
  const free = (x, y) => !(dashSolid(x - r, y - r) || dashSolid(x + r, y - r) || dashSolid(x - r, y + r) || dashSolid(x + r, y + r));
  const nx = p.x + p.dx * step, ny = p.y + p.dy * step;
  if (free(nx, p.y)) p.x = nx;
  if (free(p.x, ny)) p.y = ny;
  G.fx.push({ kind: 'ghost', x: p.x, y: p.y, vx: 0, vy: 0, t: 0, life: 0.25, fx: p.fx, fy: p.fy });
  // dash straight through enemies, hurting them (shields don't help); shatters Hank's frost
  for (const e of G.ents.slice()) {
    if (!e.enemy || !e.alive || p.dashHit.includes(e) || dist(e, p) > e.r + 7) continue;
    p.dashHit.push(e);
    if (e.type === 'hank') { if (e.frozen) shatterFrost(e); continue; }
    if ((e.type === 'king' || e.type === 'attendant') && e.st !== 'daze') continue;
    damageEnemy(e, rollDamage(1), p, 'magic');
  }
  // never end a dash inside a barrier: keep going until clear
  if (p.dashing <= 0 && tileAt(p.x, p.y) === 'y') p.dashing = 0.02;
  if (p.dashing <= 0) {
    p.dashing = 0;
    const c = tileAt(p.x, p.y);
    if (c === 'w') { p.falling = 0.6; Sound.play('splash'); ripple(p.x, p.y); floatText(p.x, p.y - 18, 'Zombies sink...', '#bfe0ff'); }
  }
}

// ===== jon.js =====
// Jon: personality (what he says and how his face looks) and growth (XP, levels, perks, milestones).
// Jon is based on Owen's real best friend, so he grows alongside Owen as the game goes on.

// ---------------- talking ----------------
const JT = { cd: {}, line: '', t: 0, idle: 0, asleep: false, streak: 0, streakT: 0, face: 'happy', faceT: 0, lastArea: '', queued: null };

  if (!opts.force && JT.t > 0.6 && !opts.interrupt) return false;   // don't talk over himself
  const pool = typeof cat === 'string' && JON[cat] ? JON[cat] : null;
  const line = opts.line || (Array.isArray(pool) ? pick(pool) : null);

function updateJonTalk(dt) {

  if (JT.queued) { const q = JT.queued; JT.queued = null; jonSay(q, { force: true, face: 'excited' }); }
  // idling: he gets chatty, then bored, then falls asleep
  if (p.moving || G.jon.mode !== 'follow') {
    if (JT.asleep) { JT.asleep = false; jonSay('wake', { force: true }); setJonFace('excited', 1.5); }
    JT.idle = 0;

    if (JT.idle > 16 && JT.idle - dt <= 16) jonSay('sing', { cooldown: 6 });

    if (JT.asleep && Math.floor(JT.idle) % 6 === 0 && Math.floor(JT.idle - dt) % 6 !== 0) jonSay('sleepy', { force: true });
  }

  const area = G.map.dungeon || G.map.interior || G.map.dark ? G.mapId : (G.scr.y === 1 && G.scr.x <= 1 ? 'village' : G.scr.y === 0 && G.scr.x === 1 ? 'forest' : G.scr.y === 0 && G.scr.x >= 2 ? 'frozen' : 'overworld');

  if (G.ents.some(e => e.type === 'penguin' && e.alive && dist(e, p) < 70)) jonSay('penguin', { cooldown: 45 });
  for (const t of ['beetle', 'slime', 'varg', 'spider', 'guard', 'snowpeng', 'wombat', 'squirrel', 'cdog']) if (G.ents.some(e => e.type === t && e.alive && dist(e, p) < 80)) jonSay(t, { cooldown: 70 });

// ===== snes.js =====
// The SNES-RPG pass: atmosphere (time of day, cloud shadows, snow, fireflies), living ground
// (tall grass, muck), deeper enemies (Spore Cap, Slime, Beetle), damage numbers, a world map,
// collectible rune tablets, and Owen's page-5 beats: the subway, the taxi, and the big log.

// ---------------- time of day ----------------
// A full day lasts 20 real minutes. The overworld is tinted by the hour; interiors are not.
const DAY_SECONDS = 1200;
function clockHour() { return (G.save && G.save.clock !== undefined) ? G.save.clock : 9; }
function updateClock(dt) {
  if (!G.save || G.mode === 'arena') return;
  if (G.save.clock === undefined) G.save.clock = 9;
  G.save.clock = (G.save.clock + dt * 24 / DAY_SECONDS) % 24;
}
function phaseOfDay(h = clockHour()) { return h < 5 ? 'night' : h < 7 ? 'dawn' : h < 18 ? 'day' : h < 20 ? 'dusk' : 'night'; }
function isNight() { return phaseOfDay() === 'night'; }
function skyTint() {
  const h = clockHour();

  else if (h < 17) c = DAY; else if (h < 19) c = mix(DAY, DUSK, (h - 17) / 2); else if (h < 21) c = mix(DUSK, NIGHT, (h - 19) / 2); else c = NIGHT;
  return c;
}
const AMB = { clouds: [{ x: 40, y: 30, w: 90, h: 40, s: 7 }, { x: 180, y: 120, w: 120, h: 50, s: 5 }, { x: 300, y: 70, w: 70, h: 30, s: 9 }], flakes: [], flies: [] };
function drawAtmosphere() {
  if (!G.map || !G.map.outdoor || G.mode === 'arena') { AMB.flakes.length = 0; AMB.flies.length = 0; return; }
  const t = G.t, cx = G.cam.x, cy = G.cam.y;
  // cloud shadows drift across by day
  const [r, g, b, a] = skyTint();
  if (a < 0.3) {
    ctx.fillStyle = `rgba(0,0,30,${0.11 * (1 - a * 2)})`;
    for (const c of AMB.clouds) {
      const x = ((c.x + t * c.s) % (VW + 200)) - 100, y = ((c.y + t * c.s * 0.3) % (VH + 120)) - 60;
      ctx.beginPath(); ctx.ellipse(x, y, c.w / 2, c.h / 2, 0, 0, Math.PI * 2); ctx.ellipse(x + c.w * 0.3, y - c.h * 0.2, c.w / 3, c.h / 3, 0, 0, Math.PI * 2); ctx.fill();
    }
  }
  // snow on the frozen screens
  if (G.scr.y === 0 && G.scr.x >= 2) {
    while (AMB.flakes.length < 40) AMB.flakes.push({ x: Math.random() * VW, y: Math.random() * VH, s: 10 + Math.random() * 20, w: Math.random() * 6 });
    for (const f of AMB.flakes) { f.y += f.s / 60; f.x += Math.sin(t * 1.5 + f.w) * 0.3; if (f.y > VH) { f.y = -2; f.x = Math.random() * VW; } R(f.x, f.y, f.s > 22 ? 2 : 1, f.s > 22 ? 2 : 1, 'rgba(255,255,255,0.85)'); }
  } else AMB.flakes.length = 0;
  // fireflies at night near grass and water
  if (a > 0.3) {
    while (AMB.flies.length < 14) AMB.flies.push({ x: Math.random() * VW, y: 40 + Math.random() * (VH - 60), p: Math.random() * 6, s: Math.random() * 2 + 1 });
    for (const f of AMB.flies) {
      f.x += Math.sin(t * f.s + f.p) * 0.4; f.y += Math.cos(t * f.s * 0.7 + f.p) * 0.3;
      const glow = Math.max(0, Math.sin(t * 2 + f.p * 3));
      if (glow > 0.2) { ctx.fillStyle = `rgba(200,255,120,${glow * 0.9})`; ctx.fillRect(Math.round(f.x), Math.round(f.y), 2, 2); ctx.fillStyle = `rgba(200,255,120,${glow * 0.25})`; ctx.fillRect(Math.round(f.x) - 1, Math.round(f.y) - 1, 4, 4); }
    }
  } else AMB.flies.length = 0;
  // the tint itself
  if (a > 0) { ctx.fillStyle = `rgba(${r | 0},${g | 0},${b | 0},${a})`; ctx.fillRect(0, 0, VW, VH); }
  // stars
  if (a > 0.35) for (let i = 0; i < 30; i++) { const sx = (i * 97) % VW, sy = (i * 53) % 90 + 20; if (Math.floor(t * 2 + i) % 5) R(sx, sy, 1, 1, `rgba(255,255,255,${(a - 0.3) * 2})`); }
}

const SHOTS = [];   // story-mode projectiles (spore spit)
function updateShots(dt) {
  const p = G.player;
  for (const s of SHOTS) {
    s.x += s.vx * dt; s.y += s.vy * dt; s.life -= dt;
    if (s.life < 1.4 && dist(s, p) < 7) { s.life = 0; hurtPlayer(1, s); }
    if (s.life < 1.5 && solidAt(s.x, s.y, 'jon')) s.life = 0;
  }
  for (let i = SHOTS.length - 1; i >= 0; i--) if (SHOTS[i].life <= 0) SHOTS.splice(i, 1);
}
function drawShots() { for (const s of SHOTS) { R(s.x - G.cam.x - 2, s.y - G.cam.y - 2, 4, 4, '#b8d860'); R(s.x - G.cam.x - 1, s.y - G.cam.y - 1, 2, 2, '#e8ff9a'); } }

function updateSpore(e, dt, dx, dy, d) {
  // a mushroom that spits from range and ducks under its cap when you get close
  e.hiding = d < 44;
  e.fx = dx / d; e.fy = dy / d;
  if (!e.hiding && d < 120) { e.t2 = (e.t2 || 0) + dt; if (e.t2 > 1.6) { e.t2 = 0; SHOTS.push({ x: e.x, y: e.y, vx: dx / d * 70, vy: dy / d * 70, life: 1.6 }); e.puff = 0.2; Sound.play('throw'); } }
  e.puff = Math.max(0, (e.puff || 0) - dt);
}
function updateSlime(e, dt, dx, dy, d, mr) {
  // hops toward Owen; splits in two when a big one dies (see killEnemy hook)
  e.hop = (e.hop || 0) - dt;
  if (e.hop <= 0) { e.hop = e.mini ? 0.6 : 0.95; e.vx = dx / d * (e.mini ? 110 : 85); e.vy = dy / d * (e.mini ? 110 : 85); e.air = e.mini ? 0.3 : 0.4; }
  if (e.air > 0) { e.air -= dt; tryMove(e, e.vx * dt, e.vy * dt, mr, 'walker'); }
}
function updateBeetle(e, dt, dx, dy, d, mr) {
  // armored: Jon's swing clanks off the shell. A THROW flips it; chop the soft belly before it rights itself
  if (e.flipped > 0) { e.flipped -= dt; e.wiggle = (e.wiggle || 0) + dt * 14; if (e.flipped <= 0) { e.flipped = 0; Sound.play('clank'); } return; }
  e.fx = dx / d; e.fy = dy / d;
  if (d < 100) tryMove(e, dx / d * 26 * dt, dy / d * 26 * dt, mr, 'walker');
}
// returns true if the hit was blocked
function snesDamageRule(e, how, jonHit) {
  if (e.type === 'beetle' && !(e.flipped > 0)) {
    if (how === 'throw') { e.flipped = 3.2; e.wiggle = 0; Sound.play('switch'); floatText(e.x, e.y - 16, 'FLIPPED!', '#ffd84a'); return true; }
    if (jonHit) { Sound.play('clank'); return true; }
  }
  if (e.type === 'spore' && e.hiding && jonHit) { Sound.play('clank'); floatText(e.x, e.y - 14, 'blocked', '#aab'); return true; }
  return false;
}
function snesOnKill(e) {
  if (e.type === 'slime' && !e.mini) {
    for (const k of [-1, 1]) { const m = makeEnemy('slime', e.x + k * 9, e.y); m.mini = true; m.hp = m.max = 1; m.r = 4; m.st = 'idle'; G.ents.push(m); G.roomEnemies = true; }

}

  try {

      const act = gp.vibrationActuator || (gp.hapticActuators && gp.hapticActuators[0]);
      if (act && act.playEffect) act.playEffect('dual-rumble', { duration: ms, strongMagnitude: strong, weakMagnitude: weak });

  } catch (e) {}

  if (drawCritter(e, x, y)) { drawRooted(e); return; }
  if (e.type === 'varg') { drawVarg(e, x, y); drawRooted(e); return; }
  if (e.type === 'spider') { shadowAt(x, y + 3, 0.6); spr(SPR.spider, x, y + 4 + (Math.floor(e.wob) % 2), { white: e.flash > 0 }); drawRooted(e); return; }
  if (drawSnesEnemy(e, x, y)) return;
  const white = e.flash > 0 || (e.st === 'wind' && Math.floor(G.t * 16) % 2 === 0);
  const f = Math.floor(e.wob / 2.5) % 2;
  switch (e.type) {
    case 'penguin': case 'knight': case 'king': case 'snowpeng': case 'guard': case 'minichilly': {
      const s = e.type === 'king' ? 3 : e.type === 'knight' ? 2 : 1;
      const { d, flip } = dirOf(e.fx, e.fy);
      const waddle = e.st === 'daze' || e.st === 'slide' || e.bow ? 0 : [0, 1, 0, -1][Math.floor(e.wob / 2.5) % 4] * s;
      const shake = (e.type === 'king' && (e.st === 'wind' || e.st === 'slide') ? Math.round(rnd(-1, 1)) : 0) + waddle;
      shadowAt(x, y + 5 * s, s);
      const img = SPR[`${pengKey(e)}_${e.bow ? 'down' : d}_${e.st === 'daze' || e.bow ? 0 : f}${flip && !e.bow ? '_f' : ''}`];
      const foot = y + 6 * s + (e.bow ? 2 : 0);
      spr(img, x + shake, foot, { scale: s, white });
      const top = foot - img.height * s + 2 * s;
      if (e.type === 'king') {
        spr(SPR.crown, x + shake, top + 3 * s, { scale: s });
        if (e.st === 'daze') for (let i = 0; i < 3; i++) { const a = G.t * 5 + i * 2.1; drawStar(x + Math.cos(a) * 18, top - 4 + Math.sin(a) * 4); }
      }
      if (e.type === 'knight') {
        spr(SPR.helmet, x, top + 4 * s, { scale: s, white });
        drawShield(e, x, y - 2 * s, s);
      }
      if (e.type === 'guard') { spr(SPR.helmet, x, top + 4, { white }); drawShield(e, x, y - 2, 1); }
      if (e.type === 'minichilly') { R(x - 6, top + 6, 12, 2, '#7a1a8a'); R(x - 7, top + 8, 3, 6, '#7a1a8a'); R(x + 4, top + 8, 3, 6, '#7a1a8a'); }
      if (e.bow && Math.floor(G.t * 2 + e.wob) % 3 === 0) text('ak', x + 8, y - 10, '#c8d8ff', 'left', false);
      break; }
    case 'draugr': {
      const { d, flip } = dirOf(e.fx, e.fy);
      shadowAt(x, y + 6, 1);
      const behind = e.fy < -0.5 && Math.abs(e.fx) < 0.6;
      if (behind) drawShield(e, x, y - 4, 1);
      spr(SPR[`draugr_${d === 'up' ? 'down' : d}_${f}${flip ? '_f' : ''}`], x, y + 7, { white });
      if (!behind) drawShield(e, x, y - 4, 1);
      break; }
    case 'wisp': {
      const g = 0.6 + 0.4 * Math.sin(G.t * 6 + e.wob);
      pxGlow(x, y, 12, '160,230,255', 0.55 * g);
      R(x - 3, y - 3, 6, 6, e.flash > 0 ? '#fff' : '#dff6ff'); R(x - 2, y - 4, 4, 1, '#dff6ff'); R(x - 1, y - 6 - Math.round(g * 2), 2, 2, '#bfeaff');
      R(x - 2, y - 1, 1, 2, '#123'); R(x + 1, y - 1, 1, 2, '#123');
      break; }
    case 'bat':
      shadowAt(x, y + 10, 0.6);
      spr(SPR['bat_' + (Math.floor(G.t * 10 + e.wob) % 2)], x, y + 4, { white });
      break;
  }
  if (e.boss && e.alive) {
    const w = 60, bx = x - w / 2, by = y - (e.type === 'king' ? 54 : 40);

}
function drawShield(e, x, y, s) {
  const down = e.guardDown > 0;
  const ox = down ? -e.fy * 9 * s : e.fx * 7 * s, oy = down ? e.fx * 4 * s + 4 : e.fy * 5 * s;
  ctx.save(); ctx.translate(Math.round(x + ox), Math.round(y + oy));
  if (down) ctx.rotate(0.6);
  const img = s >= 2 ? up(SPR.shield, Math.round(s)) : SPR.shield, w = s >= 2 ? img.width : Math.round(img.width * s * 0.9), h = s >= 2 ? img.height : Math.round(img.height * s * 0.9);
  ctx.drawImage(e.flash > 0 ? whiteOf(img) : img, Math.round(-w / 2), Math.round(-h / 2), w, h);
  ctx.restore();
}

function drawThing(e) {

    case 'sleeplog': return drawSleepLog(e);

    case 'throne': spr(SPR.throne, x, y + 8); return;

      return drawPerson(x, y, e.id, e.bob);

      if (e.underBush && tileAt(e.x, e.y) === 'b') break;
      if (e.what === 'qitem') { const b = Math.round(Math.sin(t * 4) * 1.5); shadowAt(x, y + 6, 0.7); drawItemIcon(e.id, x, y + b); if (Math.floor(t * 3) % 3 === 0) drawTwinkle(x + 6, y - 6 + b, 0); break; }
      const b = Math.round(Math.sin(t * 4 + e.x) * 1.5);
      if (e.what === 'heart') drawHeart(x - 3, y - 3 + b, 1);
      else if (e.what === 'kr1' || e.what === 'kr5' || e.what === 'krn') { drawIconSpr(e.what === 'kr5' || e.value >= 5 ? 'gold' : 'coin', x, y + b); }
      else if (false) { R(x - 3, y - 3 + b, 6, 6, (e.what === 'kr5' || e.value >= 5) ? '#ffd84a' : '#d0d6e0'); R(x - 1, y - 2 + b, 2, 4, (e.what === 'kr5' || e.value >= 5) ? '#a87a10' : '#8a92a0'); }
      else if (e.what === 'rune') drawItemIcon('shard', x, y + b);
      else drawItemIcon(e.what, x, y + b);
      break; }
    case 'switch': {

      break; }

  }
}

function arenaBest() { try { return +localStorage.getItem(ARENA_BEST_KEY) || 0; } catch (e) { return 0; } }
function waveSpec(w) {
  if (w === 20) return { len: 45, every: 0.25, batch: 4, pool: ['minichilly'], knightChance: 0, hpMul: 2, touchAdd: 1, bosses: 0 };   // Owen: just a bunch of miniature Chillys
  const pool = ['penguin'];
  if (w >= 2) pool.push('bat');
  if (w >= 3) pool.push('wisp', 'penguin');
  if (w >= 4) pool.push('draugr');
  if (w >= 7) pool.push('draugr', 'bat');
  return {
    len: Math.min(18 + (w - 1) * 3, 45),
    every: Math.max(0.22, 1.2 - w * 0.055),
    batch: 1 + Math.floor(w / 6),
    pool,
    knightChance: w >= 6 ? 0.03 + w * 0.004 : 0,
    hpMul: 1 + 0.2 * (w - 1),
    touchAdd: Math.floor(w / 8),
    bosses: w === 20 ? 2 : (w % 5 === 0 ? 1 : 0),
  };
}

function startArena() {
  G.mode = 'arena'; resetJon();
  G.save = newSave(); G.save.voodoo = false; G.save.map = 'arena';
  G.st = baseStats();
  G.player = makePlayer(); G.jon = makeJon(); G.player.hp = G.save.maxHp;
  Object.assign(A, { wave: 0, kills: 0, xp: 0, lvl: 1, pendingLv: 0, owned: {}, orbit: 0, frost: 0, chain: 0, turrets: [], pals: [], shots: [], bolts: [], marks: [], won: false, rerolls: 0 });
  G.state = 'play';
  loadMap('arena', 16 * T, 14 * T + 8);
  G.cam = { x: 16 * T - VW / 2, y: 14 * T + 8 - VH / 2 };
  say([
    ['Jon', 'Welcome to VALHALLA ARENA! Chilly sends twenty waves of minions. We survive all twenty.'],
    ['Jon', 'Enemies drop kroner. Between waves we shop for upgrades. Level ups give free stats.'],
    ['Jon', 'Z swings me, X throws me. Enter pauses. Ready? Of course you are. You have ME.'],
  ], () => nextWave());
}

function nextWave() {
  A.wave++;
  const sp = waveSpec(A.wave);
  A.t = 0; A.len = sp.len; A.spawnT = 0.5; A.marks = []; A.shots = [];
  if (A.infinity) A.infT = 30;
  G.state = 'play';
  placeTurrets();
  G.banner = A.wave === 20 ? 'WAVE 20 · MINI CHILLYS' : A.wave % 5 === 0 ? `WAVE ${A.wave} · BOSS` : `WAVE ${A.wave}`; G.bannerT = 1.6;
  if (sp.bosses) {
    Sound.play('boss');
    for (let i = 0; i < sp.bosses; i++) arenaSpawn('king', 16 * T + (i ? 80 : -80) * (sp.bosses > 1 ? 1 : 0), 9 * T, true);
  }
}
function placeTurrets() {
  const p = G.player, n = A.turrets.length;
  A.turrets.forEach((t, i) => { const a = (i / Math.max(1, n)) * Math.PI * 2; t.x = clamp(p.x + Math.cos(a) * 34, 24, G.cols * T - 24); t.y = clamp(p.y + Math.sin(a) * 34, 40, G.nrows * T - 24); });
}

function arenaSpawn(type, x, y, now) {
  if (!now) { A.marks.push({ type, x, y, t: 0.8 }); return; }
  const sp = waveSpec(Math.max(1, A.wave));
  const e = makeEnemy(type, x, y);
  e.aggro = true;
  if (e.st === 'intro') e.st = type === 'king' ? 'waddle' : 'chase';
  const mul = type === 'king' ? (1 + 0.5 * Math.floor(A.wave / 5 - 1)) * 2 : sp.hpMul;
  e.hp = e.max = e.hp * mul; e.touch += sp.touchAdd;
  G.ents.push(e);
  puff(x, y, '#cfe8ff', 6);
}
function randomSpawnPoint() {
  const p = G.player;
  for (let i = 0; i < 20; i++) {
    const x = rnd(2.5, G.cols - 2.5) * T, y = rnd(3, G.nrows - 2.5) * T;
    if (Math.hypot(x - p.x, y - p.y) > 70 && !solidAt(x, y, 'walker')) return { x, y };
  }
  return { x: 3 * T, y: 4 * T };
}

function arenaKill(e) {
  A.kills++;
  const val = { penguin: 1, bat: 1, wisp: 1, draugr: 2, knight: 5, king: 25 }[e.type] || 1;
  const n = Math.min(val, 5);
  for (let i = 0; i < n; i++) G.ents.push({ kind: 'pickup', what: 'krn', value: Math.ceil(val / n), x: e.x + rnd(-6, 6), y: e.y + rnd(-6, 6), life: 30 });
  if (Math.random() < 0.04) G.ents.push({ kind: 'pickup', what: 'heart', x: e.x, y: e.y, life: 10 });
  A.xp += e.type === 'king' ? 15 : e.type === 'knight' ? 4 : e.type === 'draugr' ? 2 : 1;
  while (A.xp >= xpNeed()) { A.xp -= xpNeed(); A.lvl++; A.pendingLv++; floatText(G.player.x, G.player.y - 24, 'LEVEL UP!', '#9be08a'); Sound.play('heart'); }
}
const xpNeed = () => 5 + A.lvl * 4;

function arenaOnHit(e) {
  if (!A.chain || Math.random() > 0.2 * A.chain) return;
  const near = G.ents.filter(o => o.enemy && o.alive && o !== e && dist(o, e) < 80).sort((a, b) => dist(a, e) - dist(b, e)).slice(0, 3);
  let from = e;
  for (const o of near) {
    A.bolts.push({ x1: from.x, y1: from.y, x2: o.x, y2: o.y, t: 0.15 });
    damageEnemy(o, rollDamage(0.8), from, 'magic');
    from = o;
  }
  if (near.length) Sound.play('switch');
}

function updateArena(dt) {
  const p = G.player, sp = waveSpec(A.wave);
  // camera follows Owen
  G.cam.x = clamp(p.x - VW / 2, 0, G.cols * T - VW); G.cam.y = clamp(p.y - VH / 2, 0, G.nrows * T - VH);
  A.t += dt;
  // regen
  if (G.st.regen > 0) { A.regenT += dt; if (A.regenT > 8 / G.st.regen) { A.regenT = 0; if (p.hp < G.save.maxHp) { p.hp++; floatText(p.x, p.y - 16, '+', '#9be08a'); } } }
  // spawning with warning marks
  A.spawnT -= dt;
  const alive = G.ents.filter(e => e.enemy && e.alive).length;
  if (A.spawnT <= 0 && A.t < A.len - 1 && alive < 55) {
    A.spawnT = sp.every;
    for (let i = 0; i < sp.batch; i++) {
      const pt = randomSpawnPoint();
      arenaSpawn(Math.random() < sp.knightChance ? 'knight' : pick(sp.pool), pt.x, pt.y);
    }
  }
  updateOwenCards(dt);
  for (const m of A.marks) { m.t -= dt; if (m.t <= 0) arenaSpawn(m.type, m.x, m.y, true); }
  A.marks = A.marks.filter(m => m.t > 0);
  // Ghost Jons
  if (A.orbit) {
    for (let i = 0; i < A.orbit; i++) {
      const a = G.t * 3.2 + i * Math.PI * 2 / A.orbit, ox = p.x + Math.cos(a) * 28, oy = p.y + Math.sin(a) * 28;
      for (const e of G.ents) if (e.enemy && e.alive && Math.hypot(e.x - ox, e.y - oy) < e.r + 7 && !(e.orbCd > 0)) { e.orbCd = 0.5; damageEnemy(e, rollDamage(0.7), { x: ox, y: oy }, 'magic'); }
    }
  }
  for (const e of G.ents) if (e.orbCd > 0) e.orbCd -= dt;
  // Frost aura
  if (A.frost) {
    A.frostT += dt;
    const r = 34 + A.frost * 10;
    for (const e of G.ents) if (e.enemy && e.alive && dist(e, p) < r) e.slow = 0.3;
    if (A.frostT > 0.7) { A.frostT = 0; for (const e of G.ents.slice()) if (e.enemy && e.alive && dist(e, p) < r) damageEnemy(e, 0.35 * A.frost * G.st.dmg, p, 'magic'); }
  }
  // turrets
  for (const t of A.turrets) {
    t.cd -= dt;
    if (t.cd > 0) continue;
    const tgt = G.ents.filter(e => e.enemy && e.alive && dist(e, t) < 130).sort((a, b) => dist(a, t) - dist(b, t))[0];
    if (!tgt) continue;
    t.cd = 1.1 / G.st.atk;
    const d = dist(tgt, t) || 1;
    A.shots.push({ x: t.x, y: t.y - 6, vx: (tgt.x - t.x) / d * 170, vy: (tgt.y - t.y) / d * 170, life: 1.2 });
  }
  for (const s of A.shots) {
    s.x += s.vx * dt; s.y += s.vy * dt; s.life -= dt;
    const hit = G.ents.find(e => e.enemy && e.alive && Math.hypot(e.x - s.x, e.y - s.y) < e.r + 3);
    if (hit) { s.life = 0; damageEnemy(hit, rollDamage(1), s, 'magic'); }
    if (solidAt(s.x, s.y, 'jon')) s.life = 0;
  }
  A.shots = A.shots.filter(s => s.life > 0);
  // Penguin Pals: waddle after Owen, belly-slide into the nearest enemy
  A.pals.forEach((pl, i) => {
    pl.wob += dt * 8; pl.cd -= dt;
    if (pl.dash > 0) {
      pl.dash -= dt; pl.x += pl.dx * 200 * dt; pl.y += pl.dy * 200 * dt;
      for (const e of G.ents) if (e.enemy && e.alive && Math.hypot(e.x - pl.x, e.y - pl.y) < e.r + 6 && !(e.palCd > 0)) { e.palCd = 0.4; damageEnemy(e, rollDamage(1.5), pl, 'magic'); }
    } else {
      const tx = p.x - 16 + i * 32, ty = p.y + 14;
      pl.x += (tx - pl.x) * Math.min(1, 4 * dt); pl.y += (ty - pl.y) * Math.min(1, 4 * dt);
      if (pl.cd <= 0) {
        const tgt = G.ents.filter(e => e.enemy && e.alive && dist(e, pl) < 120).sort((a, b) => dist(a, pl) - dist(b, pl))[0];
        if (tgt) { const d = dist(tgt, pl) || 1; pl.dx = (tgt.x - pl.x) / d; pl.dy = (tgt.y - pl.y) / d; pl.dash = 0.45; pl.cd = 2; }
      }
    }
    pl.x = clamp(pl.x, 20, G.cols * T - 20); pl.y = clamp(pl.y, 36, G.nrows * T - 20);
  });
  for (const e of G.ents) if (e.palCd > 0) e.palCd -= dt;
  for (const b of A.bolts) b.t -= dt;
  A.bolts = A.bolts.filter(b => b.t > 0);
  // wave over
  if (A.t >= A.len && !G.ents.some(e => e.enemy && e.alive && e.type === 'king')) endWave();
}

function endWave() {
  for (const e of G.ents.filter(e => e.enemy)) puff(e.x, e.y, '#fff', 4);
  G.ents = G.ents.filter(e => !e.enemy);
  for (const e of G.ents) if (e.kind === 'pickup' && e.what === 'krn') { G.save.kr += e.value; }
  G.ents = G.ents.filter(e => !(e.kind === 'pickup'));
  A.marks = []; A.shots = [];
  G.jon.mode = 'follow';
  Sound.play('secret');
  if (A.wave >= ARENA_WAVES) return arenaOver(true);
  if (A.pendingLv > 0) openLevelUp(); else openShop();
}
function openLevelUp() {
  G.state = 'levelup'; A.sel = 0;
  A.choices = [...LEVEL_UPS].sort(() => Math.random() - 0.5).slice(0, 4);
}
function openShop() {
  G.state = 'shop'; A.sel = 0; A.rerolls = 0;
  rollCards();
}
function cardPrice(c) { return Math.round(c.price * (1 + 0.12 * (A.wave - 1))); }
function rollCards() {
  const avail = ARENA_CARDS.filter(c => (A.owned[c.id] || 0) < c.max);
  A.cards = [...avail].sort(() => Math.random() - 0.5).slice(0, 4).map(c => ({ ...c, sold: false }));
}
const rerollCost = () => 3 + A.wave + A.rerolls * 2;

function updateArenaMenus() {
  if (G.state === 'levelup') {
    if (just('up')) { A.sel = (A.sel + 3) % 4; Sound.play('menu'); }
    if (just('down')) { A.sel = (A.sel + 1) % 4; Sound.play('menu'); }
    if (just('a') || just('tap')) {
      A.choices[A.sel].apply(); A.pendingLv--; Sound.play('item');
      if (A.pendingLv > 0) openLevelUp(); else openShop();
    }
    return;
  }
  if (G.state === 'shop') {
    const n = A.cards.length + 1;   // last row = Next wave
    if (just('up')) { A.sel = (A.sel + n - 1) % n; Sound.play('menu'); }
    if (just('down')) { A.sel = (A.sel + 1) % n; Sound.play('menu'); }
    if (just('b')) {
      if (G.save.kr >= rerollCost()) { G.save.kr -= rerollCost(); A.rerolls++; rollCards(); A.sel = 0; Sound.play('coin'); } else Sound.play('clank');
    }
    if (just('menu')) return nextWave();
    if (just('a') || just('tap')) {
      if (A.sel === A.cards.length) return nextWave();
      const c = A.cards[A.sel];
      if (!c || c.sold) return;
      if (G.save.kr < cardPrice(c)) { Sound.play('clank'); return; }
      G.save.kr -= cardPrice(c); c.sold = true; A.owned[c.id] = (A.owned[c.id] || 0) + 1; c.apply(); Sound.play('item');
    }
    return;
  }
  if (G.state === 'arenapause') {
    if (just('menu') || just('a')) G.state = 'play';
    if (just('b')) { G.mode = 'story'; G.st = baseStats(); G.state = 'title'; G.menuSel = 0; G.titleOpts = null; }
    return;
  }
  if (G.state === 'arenaover') {
    if (just('a') || just('menu') || just('tap')) { G.mode = 'story'; G.st = baseStats(); G.state = 'title'; G.menuSel = 0; G.titleOpts = null; }
  }
}

function arenaOver(won) {
  A.won = won;
  G.state = 'arenaover';
  const reached = won ? ARENA_WAVES : A.wave;
  try { if (reached > arenaBest()) localStorage.setItem(ARENA_BEST_KEY, String(reached)); } catch (e) {}
  Sound.play(won ? 'secret' : 'hurt');
}

function say(lines, done) {
  if (!lines || !lines.length) { if (done) done(); return; }
  done = typeof noteAfter === 'function' ? noteAfter(lines, done) : done;
  G.talk = { paper: typeof isPaper === 'function' && isPaper(lines), queue: lines.slice(), done: done || null, cur: null, shown: 0, back: G.state === 'talk' ? 'play' : (G.state === 'hold' ? 'play' : G.state) };
  if (G.talk.back !== 'play' && G.talk.back !== 'cutscene') G.talk.back = 'play';
  G.state = 'talk';
  nextLine();
}
function nextLine() {
  const tk = G.talk;
  if (!tk.queue.length) {
    G.state = tk.back; G.talk = null; if (G.player) G.player.cd = 0.25;
    if (tk.done) tk.done();
    return;
  }
  tk.cur = tk.queue.shift(); tk.shown = 0;
}
function updateTalk(dt) {
  const tk = G.talk, before = Math.floor(tk.shown);
  tk.shown += dt * 55;
  if (Math.floor(tk.shown) !== before && Math.floor(tk.shown) % 3 === 0 && tk.shown < tk.cur[1].length) Sound.play('blip');
  if (just('a') || just('b') || just('tap')) { if (tk.shown < tk.cur[1].length) tk.shown = 999; else nextLine(); }
}
// Dialogue: the A Link to the Past box, with the speaker's portrait and a name plate.
const PORTRAIT_NPC = { Astrid: 'astrid', Lars: 'lars', Sven: 'sven', Ingrid: 'ingrid', Bjarne: 'bjarne', Attendant: 'attendant_ok', Commuter: 'commuter' };
function drawPortrait(who, x, y) {

  ctx.save(); ctx.translate(x, y); ctx.scale(2, 2);
  if (who === 'Jon') drawJonSprite(0, 1, 0, blink, typeof jonFaceNow === 'function' ? jonFaceNow() : null);
  else if (who === 'Owen') { const key = G.save && (G.save.voodoo || G.mode === 'arena') ? 'owen' : 'zombie'; spr(SPR[key + '_down_w0'], 0, 7); }
  else if (who === 'Penguin King') { spr(SPR.peng_down_0, 0, 6); spr(SPR.crown, 0, -6); }
  else if (who === 'Forest Giant') { ctx.scale(0.5, 0.5); spr(SPR.giant, 0, 16); }
  else if (drawPortraitExtra(who)) {}
  else if (PORTRAIT_NPC[who]) spr(SPR['npc_' + PORTRAIT_NPC[who] + (blink ? '_blink' : '')] || SPR.npc_sven, 0, 7);
  else { ctx.restore(); return false; }
  ctx.restore(); return true;
}
const HAS_PORTRAIT = who => who === 'Jon' || who === 'Owen' || who === 'Penguin King' || who === 'Forest Giant' || ['Hank', 'Draugr Captain', 'Fluffy', 'Driver', 'Announcer'].includes(who) || !!PORTRAIT_NPC[who];
function drawTalk() {
  const tk = G.talk; if (!tk) return;

  if (tk.shown >= msg.length) text('▼', bx + bw - 13, by + bh - 6 + (Math.floor(G.t * 4) % 2), '#ffd84a', 'left', false);

function objective() {

// ===== tech.js =====
// Engine and SNES-hardware techniques: a fixed 60 Hz simulation step, Mode 7, HDMA-style
// per-scanline effects, mosaic and iris transitions, an SPC700-style echo on the music,
// an optional CRT filter, and a developer overlay (` or F3).

// ---------------- fixed timestep ----------------
// The simulation always advances in 1/60 s steps, so a 120 Hz iPad and a 60 Hz laptop play
// the same game; rendering happens once per display frame. Input edges are consumed by the
// first step that sees them and kept for the next frame when no step ran.
const STEP = 1 / 60, MAX_STEPS = 6;
const PERF = { acc: 0, steps: 0, fps: 60, ms: 0, frames: 0 };
function runFrame(now) {
  const dt = clamp((now - last) / 1000, 0, 0.1); last = now;   // a clock that jumps backward never stalls the game
  PERF.acc += dt; PERF.fps += ((dt > 0 ? 1 / dt : 60) - PERF.fps) * 0.05;
  const t0 = performance.now();
  let steps = 0;
  pollGamepad();
  if (SCRIPT.open) PERF.acc = 0;
  while (PERF.acc >= STEP && steps < MAX_STEPS) {
    update(STEP); PERF.acc -= STEP; steps++;
    if (!(G.hitstop > 0)) for (const k in edge) edge[k] = false;
  }
  if (steps === MAX_STEPS) PERF.acc = 0;   // a long stall (tab hidden) never fast-forwards the game
  PERF.steps = steps;
  render(); postFx();
  if ((G.fitT = (G.fitT || 0) - dt) <= 0) { G.fitT = 0.5; fitScreen(); }
  present(); crtPass();
  const mid = musicFor(); markHeard(mid); Music.want(mid); Music.tick(); Echo.tick(mid); Ambience.tick(dt);
  PERF.ms += ((performance.now() - t0) - PERF.ms) * 0.1; PERF.frames++;
}

// ---------------- Mode 7 ----------------
// A perspective-mapped ground plane, scanline by scanline, the way the SNES did F-Zero and the
// Final Fantasy VI airship. The texture is the real overworld, 8 texels per tile.
const M7 = { tex: null, px: null, w: 0, h: 0, out: null, outC: null, horizon: 70 };
function m7TileColor(c, x, y) {
  const n = hash(x, y) % 4;
  switch (c) {
    case 'T': return n < 2 ? '#1f6a2e' : '#25793a';
    case '.': case 'f': case ',': return n ? '#4a9a3a' : '#54a844';
    case 's': return '#d8c08a';
    case '~': case 'w': return n ? '#2f68c8' : '#3a78d8';
    case 'U': return '#a0703c';
    case 'n': case 'i': return n ? '#e8eef6' : '#dbe4f0';
    case 'M': case '#': return n ? '#7a7a8c' : '#8a8a9c';
    case 'R': return '#b8402e';
    case 'H': case 'D': return '#8a5a2a';
    case 'P': case 'q': return '#e9edf2';
    case '%': return n ? '#5a3e22' : '#4e3620';
    case 'l': return '#ff6a1f';
    case 'E': case 'X': return '#1a1228';
    case 'x': return '#8a6a3a';
    case 'b': return '#3a8a3a';
    case 'o': return '#8a5a28';
    default: return '#4a9a3a';
  }
}
function buildMode7() {
  const rows = MAPS.overworld.rows, S = 8, w = rows[0].length * S, h = rows.length * S;
  const c = mkCanvas(w, h), g = c.getContext('2d');
  for (let y = 0; y < rows.length; y++) for (let x = 0; x < rows[0].length; x++) {
    const ch = rows[y][x];
    g.fillStyle = m7TileColor(ch, x, y); g.fillRect(x * S, y * S, S, S);
    if (ch === 'T') { g.fillStyle = '#0f4a1e'; g.fillRect(x * S + 1, y * S + 5, 6, 3); g.fillStyle = '#3a9a4a'; g.fillRect(x * S + 2, y * S + 1, 3, 2); }
    if (ch === 'R') { g.fillStyle = '#e05a40'; g.fillRect(x * S, y * S, S, 2); }
    if (ch === '~' && (x + y) % 3 === 0) { g.fillStyle = '#9fd0ff'; g.fillRect(x * S + 2, y * S + 3, 3, 1); }
    if (ch === '.' && hash(x, y) % 9 === 0) { g.fillStyle = '#ffd84a'; g.fillRect(x * S + 3, y * S + 3, 1, 1); }
  }
  M7.tex = c; M7.w = w; M7.h = h;
  M7.px = new Uint32Array(g.getImageData(0, 0, w, h).data.buffer);
  M7.outC = mkCanvas(VW, VH - M7.horizon);
  M7.out = M7.outC.getContext('2d').createImageData(VW, VH - M7.horizon);
}

function drawMode7(cx, cy, a, hgt, night) {

// ---------------- transitions and post effects ----------------
let MOS = null;
function mosaic(b) {

  const w = Math.ceil(VW / b), h = Math.ceil(VH / b), g = MOS.getContext('2d');
  g.imageSmoothingEnabled = false; g.clearRect(0, 0, VW, VH); g.drawImage(buf, 0, 0, w, h);
  ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.imageSmoothingEnabled = false;

}
function iris(r, cx, cy) {
  ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.rect(0, 0, VW, VH); ctx.arc(cx, cy, Math.max(0, r), 0, Math.PI * 2, true); ctx.fill('evenodd'); ctx.restore();
}
function postFx() {

// ---------------- SPC700-style echo ----------------
// The SNES sound chip had an echo buffer with feedback and a filter. Music runs through one here:
// dry everywhere, wet in stone rooms, very wet in the nightmare.
const Echo = {
  input: null, wet: null, level: 0,
  ensure() {
    const ac = Sound.ac; if (!ac || this.input) return !!this.input;
    this.input = ac.createGain(); const delay = ac.createDelay(1), fb = ac.createGain(), lp = ac.createBiquadFilter();
    this.wet = ac.createGain(); this.wet.gain.value = 0;
    delay.delayTime.value = 0.19; fb.gain.value = 0.38; lp.type = 'lowpass'; lp.frequency.value = 2600;
    this.input.connect(delay); delay.connect(lp); lp.connect(fb); fb.connect(delay); lp.connect(this.wet); this.wet.connect(ac.destination);
    return true;
  },
  attach(bus) { if (this.ensure()) bus.connect(this.input); },
  wetFor(mid) {
    if (!G.map || G.state === 'title') return mid === 'title' ? 0.22 : 0;
    if (G.map.redeye || mid === 'creepy') return 0.7;
    if (G.map.dungeon || G.map.dark || G.mapId === 'barrow') return 0.5;
    if (G.mapId === 'subway') return 0.35;
    if (G.map.interior) return 0.14;
    if (G.mode === 'arena') return 0.12;
    return 0.06;
  },
  tick(mid) {
    if (!this.ensure()) return;
    const w = this.wetFor(mid);
    if (Math.abs(w - this.level) > 0.001) { this.level = w; this.wet.gain.setTargetAtTime(w, Sound.ac.currentTime, 0.4); }
  },
};

// ---------------- CRT filter (Y) and developer overlay (` or F3) ----------------
try { G.crt = localStorage.getItem('jontuka-crt') === '1'; } catch (e) { G.crt = false; }

}
function crtPass() {
  if (!G.crt || PRESCALE < 2) return;
  const k = PRESCALE, w = cv.width, h = cv.height;
  dctx.fillStyle = 'rgba(0,0,0,0.28)';
  for (let y = 0; y < VH; y++) dctx.fillRect(0, y * k + k - 1, w, Math.max(1, k >> 2));
  // a soft vignette, like a tube's curved edges
  const gr = dctx.createRadialGradient(w / 2, h / 2, h * 0.35, w / 2, h / 2, h * 0.78);
  gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(1, 'rgba(0,0,0,0.35)');
  dctx.fillStyle = gr; dctx.fillRect(0, 0, w, h);
}
function drawDebug() {
  const lines = [
    `${PERF.fps.toFixed(0)} fps  ${PERF.ms.toFixed(1)} ms  ${PERF.steps} step${PERF.steps === 1 ? '' : 's'}`,
    `state ${G.state}  mode ${G.mode || 'story'}`,

(function bootScript() {

  if (!c) return;

    db.collection('script').onSnapshot(snap => {
      clearTimeout(timer);
      const edits = {};
      for (const d of snap.docs) { const v = d.data(); if (v && Array.isArray(v.lines)) edits[v.scene || d.id] = v.lines; }
      SCRIPT.edits = edits; applyEdits(); saveLocal(); SCRIPT.status = 'Saved for good. Works on any device.'; renderScript();
    }, () => { clearTimeout(timer); SCRIPT.status = 'Could not reach the save. Edits stay in this browser.'; renderScript(); });

      SCRIPT.ch4 = snap.docs.map(d => ({ id: d.id, ...d.data() })).filter(p => p && Array.isArray(p.lines)).sort((a, b) => (a.order || 0) - (b.order || 0));
      saveLocal(); renderScript();

})();

// ---------------- RUSH Ø: a duel at Bjarne's piano ----------------
// Notes fall into three keys. ◀ / Z / ▶ (or tap the left, middle or right of the screen) on the beat.
const RH_LANES = [{ key: '◀', f: 659 }, { key: 'Z', f: 784 }, { key: '▶', f: 988 }];
const RH_FALL = 1.5, RH_HITY = 182;
function startDuel() {
  const gap = isEasy() ? 0.62 : 0.48, toks = SCORE.bjarne.sections.A.pluck.split(/[\s|]+/).filter(t => /[A-G]/.test(t));
  const notes = [];
  for (let i = 0; i < 36; i++) {
    const tok = toks[(i * 3) % toks.length], n = { C: 0, D: 1, E: 2, F: 0, G: 1, A: 2, B: 0 }[tok[0]];
    const extra = i > 12 && i % 5 === 0 ? 0.5 : 0;      // a few quick doubles once he warms up
    notes.push({ t: 2.2 + i * gap - extra * gap, lane: n, hit: 0 });
  }
  G.rh = { t: 0, notes, hits: 0, perfect: 0, combo: 0, maxCombo: 0, flash: [0, 0, 0], judge: null, started: false };
  G.state = 'rhythm'; Sound.play('menu');
}
function rhLaneInput() {
  const out = [];
  if (just('left')) out.push(0); if (just('a') || just('down') || just('up')) out.push(1); if (just('right')) out.push(2);
  if (just('tap') && G.tapX !== undefined) out.push(G.tapX < 0.36 ? 0 : G.tapX > 0.64 ? 2 : 1);
  return out;
}
function updateRhythm(dt) {
  const r = G.rh;
  if (!r.started) {
    if (just('a') || just('tap')) { r.started = true; r.t = 0; Sound.play('save'); }
    if (just('b') || just('menu')) { G.state = 'play'; G.rh = null; say([['Bjarne', 'Another time! RUSH Ø waits for no one. Except you.']]); }
    return;
  }
  r.t += dt;
  const win = isEasy() ? 0.2 : 0.15, perfect = 0.06;
  for (const lane of rhLaneInput()) {
    r.flash[lane] = 0.15;
    const n = r.notes.filter(n => !n.hit && n.lane === lane).sort((a, b) => Math.abs(a.t - r.t) - Math.abs(b.t - r.t))[0];
    if (n && Math.abs(n.t - r.t) <= win) {
      const p = Math.abs(n.t - r.t) <= perfect;
      n.hit = 1; r.hits++; if (p) r.perfect++; r.combo++; r.maxCombo = Math.max(r.maxCombo, r.combo);
      r.judge = { text: p ? 'PERFECT!' : 'GOOD', t: 0.5, color: p ? '#ffd84a' : '#9be08a' };
      Sound.tone([[RH_LANES[lane].f * (p ? 2 : 1), 0.09, 'square']], 0.05);
    }
  }
  for (const n of r.notes) if (!n.hit && r.t > n.t + win) { n.hit = -1; r.combo = 0; r.judge = { text: 'miss', t: 0.4, color: '#ff8a8a' }; }
  for (let i = 0; i < 3; i++) r.flash[i] = Math.max(0, r.flash[i] - dt);
  if (r.judge) { r.judge.t -= dt; if (r.judge.t <= 0) r.judge = null; }
  if (r.t > r.notes[r.notes.length - 1].t + 1) finishDuel();
}
function finishDuel() {
  const r = G.rh, pct = Math.round(100 * r.hits / r.notes.length), s = G.save;
  const first = pct >= 60 && !flag('rush_cleared');
  s.rushBest = Math.max(s.rushBest || 0, pct);
  G.state = 'play'; G.rh = null;
  const lines = [['', `RUSH Ø: ${pct}% of the notes. Best streak ${r.maxCombo}. Perfect ${r.perfect}.`]];
  if (pct >= 90) lines.push(['Bjarne', 'You... you played it FASTER than me. I need to sit down. I am sitting down.']);
  else if (pct >= 60) lines.push(['Bjarne', 'MAGNIFICENT! Most people faint at note four.']);
  else lines.push(['Bjarne', 'A fine start! Rush Ø humbles everyone. Even me. Mostly me.']);
  if (first) { setFlag('rush_cleared'); s.kr += 40; lines.push(['', 'Bjarne gave you 40 kroner.']); jonXP(20); }
  lines.push(['Jon', pct >= 60 ? 'I knew every note. EVERY note. You played them. Same thing.' : 'Again! I wasn\'t ready. I was ready. Again!']);
  say(lines, writeSave);
}
function drawRhythm() {
  const r = G.rh;
  R(0, 0, VW, VH, '#20140c');
  for (let y = 0; y < VH; y += 8) R(0, y, VW, 1, '#2a1a10');
  text('RUSH Ø', VW / 2, 18, '#ffd84a', 'center', 'outline', 2);
  text('Bjarne\'s Masterpiece', VW / 2, 32, '#e8c890', 'center', false);
  spr(SPR.npc_bjarne, 30, 62, { scale: 2 }); text('Bjarne', 30, 74, '#e8c890', 'center', false);
  drawJonSprite(VW - 30, 50, Math.sin(G.t * 6) * 0.3, false, 'excited');
  const lx = l => 68 + l * 60;
  for (let l = 0; l < 3; l++) {
    const x = lx(l);
    R(x - 18, 40, 36, RH_HITY - 34, 'rgba(255,240,200,.05)');
    R(x - 1, 40, 2, RH_HITY - 40, 'rgba(255,240,200,.12)');

    text(RH_LANES[l].key, x, RH_HITY + 26, '#2a1a10', 'center', false);

  R(40, RH_HITY, 176, 2, '#ffd84a');
  if (!r.started) {

  for (const n of r.notes) {
    if (n.hit === 1) continue;
    const k = 1 - (n.t - r.t) / RH_FALL; if (k < 0 || k > 1.15) continue;
    const x = lx(n.lane), y = 40 + k * (RH_HITY - 40);

  if (r.combo >= 4) text('x' + r.combo, VW / 2, 110, '#ffd84a', 'center', 'outline');
  const done = r.notes.filter(n => n.hit === 1).length;

}
