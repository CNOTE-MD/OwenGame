<style>
  /* Layout: one centered 8:7 game screen, a short key legend under it, touch pad only on touch devices. */
  :root {
    --bg: #14121f;
    --panel: #221d38;
    --ink: #f3ecd2;
    --muted: #a79fc4;
    --axe: #8fd0ff;
    --gold: #ffd84a;
    --pixel: "Press Start 2P", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    color-scheme: dark;
  }
  html, body { background: var(--bg); color: var(--ink); }
  body { margin: 0; padding-inline: 16px; padding-block: 16px 24px; font-family: var(--pixel); font-size: 10px; line-height: 1.7; }
  main { max-width: 768px; margin-inline: auto; display: flex; flex-direction: column; gap: 14px; }
  .screen { position: relative; width: 100%; aspect-ratio: 8 / 7; background: #000; border: 3px solid var(--panel); outline: 2px solid var(--axe); }
  canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; image-rendering: crisp-edges; touch-action: none; }
  .legend { display: flex; flex-wrap: wrap; gap: 8px 20px; color: var(--muted); }
  .legend b { color: var(--gold); font-weight: normal; }
  .pad { display: none; justify-content: space-between; align-items: center; gap: 16px; user-select: none; -webkit-user-select: none; }
  @media (pointer: coarse) { .pad { display: flex; } }
  .dpad { display: grid; grid-template-columns: repeat(3, 56px); grid-template-rows: repeat(3, 56px); gap: 4px; }
  .btn { background: var(--panel); color: var(--ink); border: 2px solid var(--axe); font-family: var(--pixel); font-size: 12px; touch-action: none; border-radius: 4px; }
  .btn:active, .btn.on { background: var(--axe); color: var(--bg); }
  .btn:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
  .ab { display: grid; grid-template-columns: repeat(2, 76px); gap: 10px; }
  .ab .btn { width: 76px; height: 56px; border-radius: 28px; font-size: 9px; }
</style>
<main>
  <div class="screen"><canvas id="g" width="256" height="224" tabindex="0" aria-label="Jöntuka game screen"></canvas></div>
  <div class="legend">
    <span><b>Arrows / WASD</b> move</span>
    <span><b>Z / Space</b> swing Jon</span>
    <span><b>X / Shift</b> throw Jon</span>
    <span><b>C</b> Thunder Strike</span>
    <span><b>Enter</b> gear and quest</span>
    <span><b>M</b> sound</span>
  </div>
  <div class="pad" aria-label="Touch controls">
    <div class="dpad">
      <span></span><button class="btn" data-a="up" aria-label="Up">▲</button><span></span>
      <button class="btn" data-a="left" aria-label="Left">◀</button><span></span><button class="btn" data-a="right" aria-label="Right">▶</button>
      <span></span><button class="btn" data-a="down" aria-label="Down">▼</button><span></span>
    </div>
    <div class="ab">
      <button class="btn" data-a="menu" aria-label="Gear menu">GEAR</button>
      <button class="btn" data-a="c" aria-label="Thunder Strike">RUNE</button>
      <button class="btn" data-a="b" aria-label="Throw Jon">THROW</button>
      <button class="btn" data-a="a" aria-label="Swing Jon or talk">SWING</button>
    </div>
  </div>
</main>

// ---------- input ----------
const ACTIONS = {

  a: ['KeyZ', 'Space', 'KeyJ'], b: ['KeyX', 'KeyK', 'ShiftLeft', 'ShiftRight'], c: ['KeyC', 'KeyL'],
  menu: ['Enter', 'Escape', 'KeyP'], mute: ['KeyM'],
};
const keys = {}, virt = {}, edge = {};
const held = a => !!virt[a] || ACTIONS[a].some(c => keys[c]);

function inputVec() {
  let x = (held('right') ? 1 : 0) - (held('left') ? 1 : 0), y = (held('down') ? 1 : 0) - (held('up') ? 1 : 0);
  const m = Math.hypot(x, y);

window.addEventListener('keydown', e => {

  const off = e => { e.preventDefault(); virt[a] = false; b.classList.remove('on'); };

// ---------- sound: tiny chiptune effects ----------
const Sound = {
  ac: null, muted: false,
  unlock() { try { if (!this.ac) this.ac = new (window.AudioContext || window.webkitAudioContext)(); if (this.ac.state === 'suspended') this.ac.resume(); } catch (e) { this.ac = null; } },
  tone(seq, vol = 0.08) {
    if (this.muted || !this.ac) return;
    let t = this.ac.currentTime;
    for (const [f, d, type = 'square', f2] of seq) {
      if (f > 0) {
        const o = this.ac.createOscillator(), g = this.ac.createGain();
        o.type = type; o.frequency.setValueAtTime(f, t);
        if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
        g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0008, t + d);
        o.connect(g).connect(this.ac.destination); o.start(t); o.stop(t + d + 0.02);
      }
      t += d;
    }
  },
  noise(d, vol = 0.12, lp = 1200) {
    if (this.muted || !this.ac) return;
    const n = Math.floor(this.ac.sampleRate * d), buf = this.ac.createBuffer(1, n, this.ac.sampleRate), ch = buf.getChannelData(0);
    for (let i = 0; i < n; i++) ch[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const s = this.ac.createBufferSource(), f = this.ac.createBiquadFilter(), g = this.ac.createGain();
    f.type = 'lowpass'; f.frequency.value = lp; g.gain.value = vol;
    s.buffer = buf; s.connect(f).connect(g).connect(this.ac.destination); s.start();
  },
  play(name) {
    switch (name) {
      case 'swing': this.tone([[700, 0.07, 'square', 200]], 0.04); break;
      case 'throw': this.tone([[300, 0.06, 'triangle', 600], [600, 0.06, 'triangle', 300]], 0.06); break;
      case 'hit': this.tone([[240, 0.06, 'square', 120]], 0.07); break;
      case 'clank': this.tone([[1400, 0.04, 'triangle'], [900, 0.06, 'triangle']], 0.07); break;
      case 'hurt': this.tone([[420, 0.18, 'sawtooth', 90]], 0.07); break;
      case 'kill': this.noise(0.15, 0.1, 2000); break;
      case 'coin': this.tone([[1320, 0.05], [1980, 0.12]], 0.05); break;
      case 'heart': this.tone([[880, 0.05], [1175, 0.08]], 0.05); break;
      case 'item': this.tone([[523, 0.12], [659, 0.12], [784, 0.12], [1047, 0.45]], 0.07); break;
      case 'secret': this.tone([[784, 0.09], [740, 0.09], [622, 0.09], [440, 0.09], [415, 0.09], [659, 0.09], [831, 0.09], [1047, 0.3]], 0.06); break;
      case 'door': this.tone([[200, 0.12, 'square', 420]], 0.06); break;
      case 'fall': this.tone([[700, 0.5, 'triangle', 90]], 0.08); break;
      case 'switch': this.tone([[1200, 0.06, 'triangle'], [1600, 0.1, 'triangle']], 0.07); break;
      case 'blip': this.tone([[1100, 0.012, 'square']], 0.015); break;
      case 'menu': this.tone([[660, 0.05], [990, 0.05]], 0.04); break;
      case 'splash': this.noise(0.35, 0.12, 900); this.tone([[200, 0.3, 'sine', 800]], 0.06); break;
      case 'save': this.tone([[523, 0.1, 'triangle'], [784, 0.1, 'triangle'], [1047, 0.3, 'triangle']], 0.07); break;
      case 'thunder': this.noise(1.2, 0.35, 500); this.tone([[90, 0.9, 'sawtooth', 40]], 0.1); break;
      case 'charge': this.tone([[200, 0.4, 'sawtooth', 900]], 0.04); break;
      case 'boss': this.tone([[110, 0.2, 'sawtooth'], [104, 0.2, 'sawtooth'], [98, 0.5, 'sawtooth']], 0.08); break;
      case 'creep': this.tone([[70, 1.2, 'sine', 55]], 0.12); this.tone([[1760, 0.6, 'sine', 1700]], 0.012); break;
    }
  },
};

// ---------- drawing ----------
const R = (x, y, w, h, c) => { ctx.fillStyle = c; ctx.fillRect(Math.round(x), Math.round(y), w, h); };
function poly(pts, fill, stroke) {
  ctx.beginPath(); pts.forEach(([a, b], i) => i ? ctx.lineTo(a, b) : ctx.moveTo(a, b)); ctx.closePath();
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = 1; ctx.stroke(); }
}
function text(s, x, y, color = '#fff', align = 'left', shadow = true) {
  ctx.font = FONT; ctx.textAlign = align;
  if (shadow) { ctx.fillStyle = '#000'; ctx.fillText(s, x + 1, y + 1); }
  ctx.fillStyle = color; ctx.fillText(s, x, y);
}
function wrap(s, maxW) {
  ctx.font = FONT;
  const out = []; let line = '';
  for (const w of s.split(' ')) {
    const t = line ? line + ' ' + w : w;
    if (ctx.measureText(t).width > maxW && line) { out.push(line); line = w; } else line = t;
  }
  if (line) out.push(line);
  return out;
}
const hash = (x, y) => Math.floor(Math.abs(Math.sin(x * 12.9898 + y * 78.233) * 43758.5453)) % 100;
const HEART = [' ## ## ', '#######', '#######', ' ##### ', '  ###  ', '   #   '];
function drawHeart(x, y, fill, color = '#f22633') {
  HEART.forEach((row, yy) => [...row].forEach((ch, xx) => {
    if (ch !== '#') return;
    const lit = fill >= 1 || (fill > 0 && xx < 4);
    R(x + xx, y + yy, 1, 1, lit ? color : '#3a1820');
  }));
}

// ===== world.js =====
// Game state, maps, tiles, collision and screen-by-screen camera (like A Link to the Past).
const G = {
  state: 'title', t: 0, mode: 'story', st: null,
  save: null,                 // persistent progress (see newSave)
  mapId: '', map: null, rows: null, cols: 0, nrows: 0,
  scr: { x: 0, y: 0 }, cam: { x: 0, y: 0 }, trans: null,
  ents: [], fx: [], pending: [], roomEnemies: false,
  player: null, jon: null,
  talk: null, banner: '', bannerT: 0, shake: 0, flash: 0,
  entry: { x: 0, y: 0 },
};

function newSave() {
  return { map: 'home', x: 0, y: 0, maxHp: 6, hp: 6, kr: 0, rune: 0, potions: 0, pieces: 0,
    items: {}, flags: {}, keys: {}, bigkeys: {}, voodoo: true };
}
const SAVE_KEY = 'jontuka-save-v1';
// Stats Owen carries. Story mode uses the defaults; the Arena upgrades them.
function baseStats() { return { dmg: 1, speed: 1, atk: 1, range: 1, pickup: 28, armor: 0, regen: 0, crit: 0, knock: 1 }; }
G.st = baseStats();
function writeSave() {
  if (G.mode === 'arena') return;
  const s = G.save, p = G.player;
  if (p) { s.x = p.x; s.y = p.y; s.hp = p.hp; s.map = G.mapId; }
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(s)); } catch (e) { /* storage blocked: progress lives for this visit only */ }
}
function readSave() {
  try { const s = localStorage.getItem(SAVE_KEY); return s ? Object.assign(newSave(), JSON.parse(s)) : null; } catch (e) { return null; }
}
const flag = k => !!G.save.flags[k];
const setFlag = k => { G.save.flags[k] = true; };

// ---------- tiles ----------
const SOLID = new Set('T#MwHRDPqX+lWtOYQZxLKbV'.split(''));
function tile(tx, ty) {
  if (tx < 0 || ty < 0 || tx >= G.cols || ty >= G.nrows) return G.map.dungeon ? 'W' : 'T';
  return G.rows[ty][tx];
}
const tileAt = (x, y) => tile(Math.floor(x / T), Math.floor(y / T));
function setTile(tx, ty, c) { G.rows[ty][tx] = c; }
function screenOf(x, y) { return { x: Math.floor(x / VW), y: Math.floor(y / VH) }; }
const sameScreen = (tx, ty) => (G.map && G.map.arena) || (Math.floor(tx / SW) === G.scr.x && Math.floor(ty / SH) === G.scr.y);
function shutterClosed(tx, ty) { return sameScreen(tx, ty) && G.roomEnemies && G.ents.some(e => e.enemy && e.alive); }
function gatesDown() { return flag(G.mapId + ':gates'); }

// who: 'player' | 'walker' | 'flyer' | 'jon'
function solidTile(tx, ty, who) {
  const c = tile(tx, ty);
  if (who === 'flyer') return c === 'W' || c === 'T' || c === 'M' || c === 'Z' || c === 'V';
  if (c === 'h') return shutterClosed(tx, ty);
  if (c === 'G') return !gatesDown();
  if (who === 'jon') return SOLID.has(c) && c !== 'b' && c !== 'O' && c !== 'x' && c !== 'w' && c !== 'Q';
  if (who === 'walker' && (c === 'v' || c === '~' || c === 'E')) return true;
  return SOLID.has(c);
}
function solidAt(x, y, who) { return solidTile(Math.floor(x / T), Math.floor(y / T), who); }
function blocked(x, y, r, who, self) {
  if (solidAt(x - r, y - r, who) || solidAt(x + r, y - r, who) || solidAt(x - r, y + r, who) || solidAt(x + r, y + r, who)) return true;
  // keep actors inside the current screen
  const sx = G.scr.x * VW, sy = G.scr.y * VH;
  if (who !== 'player' && !G.map.arena && (x - r < sx || x + r > sx + VW || y - r < sy || y + r > sy + VH)) return true;
  if (who === 'player' || who === 'walker') {
    for (const e of G.ents) if (e.solid && e !== self && Math.abs(e.x - x) < 7 + r && Math.abs(e.y - y) < 7 + r) return true;
  }
  return false;
}
function tryMove(n, mx, my, r, who) {
  let hitX = false, hitY = false;
  if (!blocked(n.x + mx, n.y, r, who, n)) n.x += mx; else hitX = mx !== 0;
  if (!blocked(n.x, n.y + my, r, who, n)) n.y += my; else hitY = my !== 0;
  return { hitX, hitY };
}

// ---------- maps and screens ----------
function loadMap(id, px, py) {
  G.mapId = id; G.map = MAPS[id];
  G.rows = G.map.rows.map(r => [...r]);
  G.nrows = G.rows.length; G.cols = G.rows[0].length;
  // reapply opened doors from the save
  for (const k in G.save.flags) {
    const m = k.match(/^open:(\w+):(\d+),(\d+)$/);
    if (m && m[1] === id) setTile(+m[2], +m[3], '_');
  }
  const p = G.player;
  p.x = px; p.y = py; p.vx = p.vy = p.kx = p.ky = 0; p.launching = false; p.falling = 0; p.hold = null;
  G.jon.x = px + 10; G.jon.y = py - 14; G.jon.mode = 'follow';
  G.scr = screenOf(px, py);
  G.trans = null;
  enterScreen();
}

function enterScreen() {
  G.cam = { x: G.scr.x * VW, y: G.scr.y * VH };
  G.entry = { x: G.player.x, y: G.player.y };
  G.ents = []; G.fx = []; G.pending = [];
  const key = `clear:${G.mapId}:${G.scr.x},${G.scr.y}`;
  const cleared = flag(key);
  for (const d of G.map.ents) {
    const [tx, ty] = d.at;
    if (!sameScreen(tx, ty)) continue;
    const e = makeEnt(d, tx * T + 8, ty * T + 8);
    if (!e) continue;
    if (e.enemy && G.map.dungeon && cleared) continue;
    if (d.clear && !cleared) { G.pending.push(e); continue; }
    G.ents.push(e);
  }
  G.roomEnemies = G.ents.some(e => e.enemy);
  if (G.map.dungeon && !G.roomEnemies && !cleared) setFlag(key);
  if (G.map.dungeon && cleared) G.ents.push(...G.pending.splice(0));
  onEnterScreen();
}

function checkRoomClear() {
  if (!G.roomEnemies || G.ents.some(e => e.enemy && e.alive)) return;
  G.roomEnemies = false;
  const key = `clear:${G.mapId}:${G.scr.x},${G.scr.y}`;
  if (G.map.dungeon) setFlag(key);
  if (G.pending.length) {
    for (const e of G.pending) { G.ents.push(e); puff(e.x, e.y, '#fff'); }
    G.pending = [];
    Sound.play('secret');
  } else if (G.map.dungeon) Sound.play('door');
}

// screen transitions: when Owen walks off the edge, slide the camera to the next screen
function checkScreenEdge() {
  if (G.map.arena) return;
  const p = G.player, s = screenOf(p.x, p.y);
  if (s.x === G.scr.x && s.y === G.scr.y) return;
  const dx = Math.sign(s.x - G.scr.x), dy = Math.sign(s.y - G.scr.y);
  G.trans = { from: { ...G.cam }, to: { x: s.x * VW, y: s.y * VH }, t: 0, dx, dy };
  G.ents = G.ents.filter(e => e.keep); G.fx = [];
  G.scr = s;
}
function updateTransition(dt) {
  const tr = G.trans, p = G.player;
  tr.t += dt / 0.5;
  const k = Math.min(1, tr.t);
  G.cam.x = tr.from.x + (tr.to.x - tr.from.x) * k;
  G.cam.y = tr.from.y + (tr.to.y - tr.from.y) * k;
  p.x += tr.dx * 52 * dt; p.y += tr.dy * 52 * dt; p.walk += dt * 10;
  G.jon.x = p.x + 10; G.jon.y = p.y - 14;
  if (k >= 1) { G.trans = null; enterScreen(); }
}

// find the nearest dry, walkable tile (used when the lake spits Owen out)
function nearestDry(px, py) {
  const sx = Math.floor(px / T), sy = Math.floor(py / T);
  const seen = new Set([sx + ',' + sy]), q = [[sx, sy]];
  while (q.length) {
    const [x, y] = q.shift();
    const c = tile(x, y);
    if (c !== '~' && !solidTile(x, y, 'player') && c !== 'v' && sameScreen(x, y)) return { x: x * T + 8, y: y * T + 8 };

// Owen, Jon, enemies, people and things.

// ---------- factory ----------
function makeEnt(d, x, y) {
  const s = G.save;
  const base = { x, y, def: d, kind: d.t };
  switch (d.t) {
    case 'start': return null;
    case 'runestone': return { ...base, solid: true, talk: true };
    case 'sign': case 'plaque': return { ...base, solid: true, talk: true };
    case 'sealed': case 'cargo': return { ...base, talk: true };
    case 'npc': return { ...base, solid: true, talk: true, id: d.id, bob: Math.random() * 6 };
    case 'shop': return { ...base, talk: true, item: d.item, price: d.price };
    case 'chest': return { ...base, solid: true, talk: true, open: !!s.flags['chest:' + d.id] };
    case 'piece': case 'container': return s.flags['got:' + d.id] ? null : { ...base, kind: 'pickup', what: d.t, id: d.id, permanent: true };
    case 'warp': return { ...base, portal: !!d.portal };
    case 'flight': return { ...base };
    case 'switch': return { ...base, solid: true, hittable: true, id: d.id, cd: 0 };
    default: return makeEnemy(d.t, x, y);
  }
}
const ENEMY = {
  penguin: { hp: 2, r: 6, touch: 1, speed: 40 },
  draugr: { hp: 4, r: 6, touch: 2, speed: 20, shield: true },
  wisp: { hp: 1, r: 5, touch: 1, speed: 26, fly: true },
  bat: { hp: 1, r: 5, touch: 1, speed: 75, fly: true },
  knight: { hp: 7, r: 9, touch: 2, speed: 30, shield: true, boss: true },
  king: { hp: 10, r: 14, touch: 2, speed: 26, boss: true },
};
function makeEnemy(type, x, y) {
  const d = ENEMY[type];
  if (!d) return null;
  return { x, y, kind: 'enemy', enemy: true, alive: true, type, ...d, max: d.hp, flash: 0, kx: 0, ky: 0, t: Math.random() * 2,
    st: type === 'king' || type === 'knight' ? 'intro' : 'idle', fx: 0, fy: 1, wob: Math.random() * 6, tx: x, ty: y, bounces: 0, summoned: false };
}

// ---------- particles ----------
function puff(x, y, color = '#fff', n = 7) {
  for (let i = 0; i < n; i++) { const a = Math.random() * Math.PI * 2, s = rnd(20, 60); G.fx.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, t: 0, life: 0.4, color, size: 2 }); }
}
function updateFx(dt) {
  for (const f of G.fx) { f.t += dt; f.x += f.vx * dt; f.y += f.vy * dt; f.vx *= 0.9; f.vy *= 0.9; }
  G.fx = G.fx.filter(f => f.t < f.life);
}
function drawFx() {
  for (const f of G.fx) {
    if (f.kind === 'text') { text(f.label, f.x - G.cam.x, f.y - G.cam.y - f.t * 12, f.color, 'center'); continue; }
    R(f.x - G.cam.x, f.y - G.cam.y, f.size, f.size, f.color);
  }
}
function floatText(x, y, label, color = '#fff') { G.fx.push({ kind: 'text', x, y, vx: 0, vy: 0, t: 0, life: 0.9, label, color }); }

// ---------- Owen ----------
function makePlayer() {
  return { x: 0, y: 0, vx: 0, vy: 0, fx: 0, fy: 1, hp: G.save.hp, inv: 0, cd: 0, kx: 0, ky: 0, walk: 0,
    launching: false, lp: 0, from: null, to: null, falling: 0, bump: 0, hold: null };
}
const facing4 = p => Math.abs(p.fx) > Math.abs(p.fy) ? { x: Math.sign(p.fx), y: 0 } : { x: 0, y: Math.sign(p.fy) || 1 };

function updatePlayer(dt) {
  const p = G.player, s = G.save;
  p.inv = Math.max(0, p.inv - dt); p.cd = Math.max(0, p.cd - dt); p.bump = Math.max(0, p.bump - dt);
  if (p.falling > 0) {
    p.falling -= dt;
    if (p.falling <= 0) {
      p.x = G.entry.x; p.y = G.entry.y; p.vx = p.vy = 0;
      hurtPlayer(1, null, true);
      if (!flag('tip:pit')) { setFlag('tip:pit'); say(STORY.pit_first); }
    }
    return;
  }
  if (p.launching) {
    p.lp += dt / 0.7;
    const k = Math.min(p.lp, 1);
    p.x = p.from.x + (p.to.x - p.from.x) * k; p.y = p.from.y + (p.to.y - p.from.y) * k;
    if (p.lp >= 1) p.launching = false;
    return;
  }
  const v = inputVec();
  if (v.x || v.y) { p.fx = v.x; p.fy = v.y; p.walk += dt * 10; }
  const onIce = tileAt(p.x, p.y) === 'i';
  const spd = 72 * G.st.speed;
  if (onIce) { const k = Math.min(1, 2.2 * dt); p.vx += (v.x * spd * 1.1 - p.vx) * k; p.vy += (v.y * spd * 1.1 - p.vy) * k; }
  else { p.vx = v.x * spd; p.vy = v.y * spd; }
  const hit = tryMove(p, p.vx * dt, p.vy * dt, 5, 'player');
  if (onIce) { if (hit.hitX) p.vx *= -0.3; if (hit.hitY) p.vy *= -0.3; }
  const kl = Math.hypot(p.kx, p.ky);
  if (kl > 1) { tryMove(p, p.kx * dt, p.ky * dt, 5, 'player'); const nl = Math.max(0, kl - 520 * dt); p.kx *= nl / kl; p.ky *= nl / kl; }

  // doors that need keys
  if (v.x || v.y) {
    const f = facing4(p), c = tileAt(p.x + f.x * 9, p.y + f.y * 9);
    if ((c === 'L' || c === 'K') && p.bump <= 0) tryUnlock(Math.floor((p.x + f.x * 9) / T), Math.floor((p.y + f.y * 9) / T), c);
  }
  const here = tileAt(p.x, p.y);
  if (here === '~') {
    p.launching = true; p.lp = 0; p.from = { x: p.x, y: p.y }; p.to = nearestDry(p.x, p.y); p.inv = 1.2;
    G.jon.mode = 'follow'; Sound.play('splash'); puff(p.x, p.y, '#bfe0ff', 10);
    floatText(p.x, p.y - 20, 'Lady of the Lake!', '#bfe0ff');
    return;
  }
  if (here === 'v') { p.falling = 0.6; Sound.play('fall'); return; }

  // warps and triggers
  for (const e of G.ents) {
    if (e.kind === 'warp' && Math.abs(e.x - p.x) < 8 && Math.abs(e.y - p.y) < 8) return startWarp(e.def.to, e.def.dest);
    if (e.kind === 'flight' && Math.abs(e.x - p.x) < 9 && Math.abs(e.y - p.y) < 10) return startFlight();
  }

  // actions
  if (p.cd > 0) return;
  if (just('a')) {
    const f = facing4(p), px = p.x + f.x * 13, py = p.y + f.y * 13;
    const target = G.ents.find(e => e.talk && Math.abs(e.x - px) < 11 && Math.abs(e.y - py) < 11);
    if (target) return interact(target);
    if (tileAt(px, py) === 'D' && G.mapId === 'overworld') return say(STORY.house);
    if (G.jon.mode === 'follow') { G.jon.swing(Math.atan2(p.fy, p.fx)); Sound.play('swing'); }
  } else if (just('b') && G.jon.mode === 'follow') {
    G.jon.throw(p.x, p.y, p.fx, p.fy); Sound.play('throw');
  } else if (just('c')) {
    if (!s.items.thunder) floatText(p.x, p.y - 18, 'No rune yet', '#aab');
    else if (s.rune < RUNE_MAX) { floatText(p.x, p.y - 18, 'Rune not full', '#7fd4ff'); }
    else startThunder();
  }
}

function tryUnlock(tx, ty, c) {
  const s = G.save, p = G.player;
  p.bump = 0.6;
  if (c === 'L' && !(s.keys[G.mapId] > 0)) return say(STORY.locked);
  if (c === 'K' && !s.bigkeys[G.mapId]) return say(STORY.bossdoor);
  if (c === 'L') s.keys[G.mapId]--;
  // open the whole door (both tiles, both sides)
  const q = [[tx, ty]], seen = new Set();
  while (q.length) {
    const [x, y] = q.pop(); const k = x + ',' + y;
    if (seen.has(k) || tile(x, y) !== c) continue;
    seen.add(k); setTile(x, y, '_'); setFlag(`open:${G.mapId}:${x},${y}`);
    q.push([x + 1, y], [x - 1, y], [x, y + 1], [x, y - 1]);
  }
  Sound.play('door'); puff(tx * T + 8, ty * T + 8, '#ffd84a');
}

function hurtPlayer(dmg, from, force) {
  const p = G.player, s = G.save;
  if (!force && (p.inv > 0 || p.launching || G.state !== 'play')) return;
  if (!force && G.st.armor > 0 && Math.random() < Math.min(0.6, G.st.armor * 0.1)) { p.inv = 0.4; floatText(p.x, p.y - 18, 'BLOCK', '#9fd0ff'); Sound.play('clank'); return; }
  p.hp -= dmg; p.inv = 1; Sound.play('hurt'); G.shake = 0.15;
  if (from) { const d = Math.hypot(p.x - from.x, p.y - from.y) || 1; p.kx = (p.x - from.x) / d * 170; p.ky = (p.y - from.y) / d * 170; }
  if (p.hp > 0) return;
  if (s.potions > 0) { s.potions--; p.hp = s.maxHp; p.inv = 2; Sound.play('heart'); return say(STORY.juice); }
  if (G.mode === 'arena') { p.hp = 0; return arenaOver(false); }

// ---------- Jon ----------
function makeJon() {
  const j = { x: 0, y: 0, mode: 'follow', vx: 0, vy: 0, trav: 0, hit: [], t: 0, st: 0, base: 0, spin: 0, quip: '', qt: 0, nq: 8 };
  j.swing = a => { j.mode = 'swing'; j.st = 0; j.base = a; j.hit = []; };
  j.throw = (x, y, fx, fy) => {
    j.mode = 'out'; j.x = x; j.y = y; j.trav = 0; j.hit = [];
    const l = Math.hypot(fx, fy) || 1, sp = 200 * G.st.atk; j.vx = fx / l * sp; j.vy = fy / l * sp;
    j.target = G.save.items.homing ? findTarget(x, y, fx / l, fy / l) : null;
  };
  return j;
}
function findTarget(x, y, fx, fy) {
  let best = null, bd = 1e9;
  for (const e of G.ents) {
    if (!((e.enemy && e.alive) || e.hittable)) continue;
    const dx = e.x - x, dy = e.y - y, d = Math.hypot(dx, dy);
    if (d > 200) continue;
    const score = d - (dx * fx + dy * fy) * 0.6;   // prefer things in front
    if (score < bd) { bd = score; best = e; }
  }
  return best;
}
function updateJon(dt) {
  const j = G.jon, p = G.player;
  j.t += dt;
  const range = (G.save.items.homing ? 175 : 88) * G.st.range;
  if (j.mode === 'follow') {
    const tx = p.x + 10, ty = p.y - 14 + Math.sin(j.t * 3) * 2, k = Math.min(1, 8 * dt);
    j.x += (tx - j.x) * k; j.y += (ty - j.y) * k; j.spin = 0;
  } else if (j.mode === 'swing') {
    j.st += dt;
    const k = j.st / (0.2 / G.st.atk), a = j.base + (-1.3 + 2.6 * k);
    j.x = p.x + Math.cos(a) * 15; j.y = p.y + Math.sin(a) * 15; j.spin = a + Math.PI / 2;
    jonHits(1, 11, p, 'swing');
    cutAt(j.x, j.y);
    if (k >= 1) j.mode = 'follow';
  } else if (j.mode === 'out') {
    if (j.target && (j.target.alive || j.target.hittable) && G.ents.includes(j.target)) {
      const dx = j.target.x - j.x, dy = j.target.y - j.y, d = Math.hypot(dx, dy) || 1, sp = 210 * G.st.atk;
      const k = Math.min(1, 9 * dt); j.vx += (dx / d * sp - j.vx) * k; j.vy += (dy / d * sp - j.vy) * k;
    }
    j.x += j.vx * dt; j.y += j.vy * dt; j.trav += Math.hypot(j.vx, j.vy) * dt; j.spin += dt * 22;
    jonHits(1, 9, j, 'throw');
    if (cutAt(j.x, j.y) || j.trav > range || solidAt(j.x, j.y, 'jon')) { j.mode = 'back'; j.hit = []; }
  } else if (j.mode === 'back') {
    const dx = p.x - j.x, dy = p.y - j.y, d = Math.hypot(dx, dy) || 1;
    j.x += dx / d * 240 * G.st.atk * dt; j.y += dy / d * 240 * G.st.atk * dt; j.spin += dt * 22;
    jonHits(1, 9, j, 'throw');
    if (d < 9) j.mode = 'follow';
  }
  if (j.mode === 'out' || j.mode === 'back') {
    for (const e of G.ents) if (e.kind === 'pickup' && dist(e, j) < 10) { e.x = j.x; e.y = j.y; }   // Jon fetches loot
  }
  j.nq -= dt; j.qt = Math.max(0, j.qt - dt);
  if (j.nq <= 0) { j.nq = rnd(12, 20); j.quip = pick(STORY.quips); j.qt = 2.5; }
}
function jonHits(dmg, reach, from, how) {
  const j = G.jon;
  for (const e of G.ents.slice()) {
    if (j.hit.includes(e)) continue;
    if (e.hittable && dist(j, e) < reach + 6) { j.hit.push(e); hitSwitch(e); if (how === 'throw') j.mode = 'back'; continue; }
    if (!e.enemy || !e.alive) continue;
    if (dist(j, e) < reach + e.r) {
      j.hit.push(e);
      const blockedHit = damageEnemy(e, rollDamage(dmg), from, how);
      if (blockedHit && how === 'throw') j.mode = 'back';
      else if (!blockedHit && G.mode === 'arena') arenaOnHit(e);
    }
  }
}
function cutAt(x, y) {
  const tx = Math.floor(x / T), ty = Math.floor(y / T), c = tile(tx, ty);
  if (!sameScreen(tx, ty)) return false;
  if (c === 'b') { setTile(tx, ty, '.'); puff(tx * T + 8, ty * T + 8, '#4fbf4a', 8); Sound.play('swing'); maybeDrop(tx * T + 8, ty * T + 8, 0.4); return true; }
  if (c === 'O') { setTile(tx, ty, '_'); puff(tx * T + 8, ty * T + 8, '#8a5a3a', 8); Sound.play('kill'); maybeDrop(tx * T + 8, ty * T + 8, 0.6); return true; }
  return false;
}
function hitSwitch(e) {
  if (e.cd > 0) return;
  e.cd = 0.5;
  const k = G.mapId + ':gates';
  if (!flag(k)) { setFlag(k); Sound.play('secret'); G.shake = 0.2; floatText(e.x, e.y - 14, 'Gates lowered!', '#ffb15c'); writeSave(); }
  else Sound.play('switch');
}

// damage with Owen's stats; crits double it
function rollDamage(base) {
  let d = base * G.st.dmg;
  if (G.st.crit > 0 && Math.random() < G.st.crit) { d *= 2; G.lastCrit = true; } else G.lastCrit = false;
  return d;
}

// ---------- enemies ----------
function damageEnemy(e, dmg, from, how) {
  // how: 'swing' | 'throw' (Jon), 'thunder' (Thunder Strike), 'magic' (arena weapons)
  const jonHit = how === 'swing' || how === 'throw';
  if (e.flash > 0.05 && jonHit) return false;
  const dx = from.x - e.x, dy = from.y - e.y, d = Math.hypot(dx, dy) || 1;
  if (jonHit && e.shield && (dx / d * e.fx + dy / d * e.fy) > 0.55 && e.st !== 'charge') { Sound.play('clank'); puff(e.x + e.fx * 8, e.y + e.fy * 8, '#ffd84a', 4); return true; }
  if (e.type === 'king' && e.st !== 'daze' && how !== 'thunder') {
    if (jonHit) { Sound.play('clank'); floatText(e.x, e.y - 30, 'CLANK', '#ffd84a'); }
    return true;
  }
  if (e.type === 'king' && how === 'thunder') { e.st = 'daze'; e.t = 0; dmg = 2; }
  e.hp -= dmg; e.flash = 0.18; Sound.play('hit');
  if (G.mode === 'arena') floatText(e.x, e.y - 12, String(Math.round(dmg * 10) / 10), G.lastCrit ? '#ffd84a' : '#fff');
  const k = (e.boss ? 60 : 150) * G.st.knock; e.kx = -dx / d * k; e.ky = -dy / d * k;
  if (e.hp <= 0) killEnemy(e);
  return false;
}
function killEnemy(e) {
  e.alive = false;
  G.ents = G.ents.filter(o => o !== e);
  puff(e.x, e.y, '#fff', e.boss ? 24 : 9); Sound.play('kill');
  const s = G.save;
  if (s.items.thunder) s.rune = Math.min(RUNE_MAX, s.rune + 1);
  if (G.mode === 'arena') return arenaKill(e);
  if (!e.boss) maybeDrop(e.x, e.y, 0.65);
  if (e.type === 'king') { G.shake = 0.6; say(STORY.king_down, checkRoomClear); return; }
  checkRoomClear();
}
function maybeDrop(x, y, chance) {
  if (Math.random() > chance) return;
  const r = Math.random();
  const what = r < 0.35 ? 'heart' : r < 0.75 ? 'kr1' : r < 0.9 ? 'kr5' : 'rune';
  G.ents.push({ kind: 'pickup', what, x, y, life: 9 });
}
function spawnEnemy(type, x, y) { const e = makeEnemy(type, x, y); e.st = 'idle'; G.ents.push(e); puff(x, y, '#cfe8ff', 8); G.roomEnemies = true; }

function updateEnemy(e, dt) {
  e.flash = Math.max(0, e.flash - dt); e.wob += dt * 8; e.t += dt;
  const p = G.player, dx = p.x - e.x, dy = p.y - e.y, d = Math.hypot(dx, dy) || 1;
  const who = e.fly ? 'flyer' : 'walker', mr = e.r * 0.6;
  const kl = Math.hypot(e.kx, e.ky);
  if (kl > 1) { tryMove(e, e.kx * dt, e.ky * dt, mr, who); const nl = Math.max(0, kl - 420 * dt); e.kx *= nl / kl; e.ky *= nl / kl; }
  const toward = sp => tryMove(e, dx / d * sp * dt, dy / d * sp * dt, mr, who);
  switch (e.type) {
    case 'penguin':
      if (d < 120 || e.aggro) { toward(e.speed); e.fx = dx / d; e.fy = dy / d; }
      break;
    case 'draugr':
      if (d < 110 || e.aggro) { e.fx = dx / d; e.fy = dy / d; toward(e.speed); }
      else { if (e.t > 2) { e.t = 0; e.tx = e.x + rnd(-30, 30); e.ty = e.y + rnd(-30, 30); }
        const ax = e.tx - e.x, ay = e.ty - e.y, al = Math.hypot(ax, ay); if (al > 2) { e.fx = ax / al; e.fy = ay / al; tryMove(e, ax / al * 14 * dt, ay / al * 14 * dt, mr, who); } }
      break;
    case 'wisp': {
      const a = e.t * 2.2;
      tryMove(e, (dx / d * e.speed + Math.cos(a) * 30) * dt, (dy / d * e.speed + Math.sin(a * 1.3) * 30) * dt, mr, who);
      break; }
    case 'bat':
      if (e.t > 0.7) { e.t = 0; e.tx = p.x + rnd(-40, 40); e.ty = p.y + rnd(-40, 40); }
      { const ax = e.tx - e.x, ay = e.ty - e.y, al = Math.hypot(ax, ay) || 1; tryMove(e, ax / al * e.speed * dt, ay / al * e.speed * dt, mr, who); }
      break;
    case 'knight':
      if (e.st === 'intro') { if (G.state === 'play') { e.st = 'chase'; e.t = 0; } break; }
      if (e.st === 'chase') { e.fx = dx / d; e.fy = dy / d; toward(e.speed); if (e.t > 2.8) { e.st = 'wind'; e.t = 0; } }
      else if (e.st === 'wind') { e.fx = dx / d; e.fy = dy / d; if (e.t > 0.5) { e.st = 'charge'; e.t = 0; Sound.play('charge'); } }
      else if (e.st === 'charge') { const h = tryMove(e, e.fx * 140 * dt, e.fy * 140 * dt, mr, who); if (e.t > 0.7 || h.hitX || h.hitY) { e.st = 'chase'; e.t = 0; } }
      break;
    case 'king':
      if (e.st === 'intro') { if (G.state === 'play') { e.st = 'waddle'; e.t = 0; } break; }
      if (!e.summoned && e.hp <= 5) {
        e.summoned = true;
        if (G.mode === 'arena') { arenaSpawn('penguin', e.x - 40, e.y); arenaSpawn('penguin', e.x + 40, e.y); }
        else { spawnEnemy('penguin', G.cam.x + 40, G.cam.y + 60); spawnEnemy('penguin', G.cam.x + VW - 40, G.cam.y + 60); }
      }
      if (e.st === 'waddle') { e.fx = dx / d; e.fy = dy / d; toward(e.speed); if (e.t > 2.2) { e.st = 'wind'; e.t = 0; Sound.play('charge'); } }
      else if (e.st === 'wind') { e.fx = dx / d; e.fy = dy / d; if (e.t > 0.6) { e.st = 'slide'; e.t = 0; e.bounces = 0; } }
      else if (e.st === 'slide') {
        const h = tryMove(e, e.fx * 190 * dt, e.fy * 190 * dt, mr, who);
        if (h.hitX) e.fx *= -1; if (h.hitY) e.fy *= -1;
        if (h.hitX || h.hitY) { e.bounces++; G.shake = 0.15; Sound.play('clank'); }
        if (e.bounces >= 3 || e.t > 4) { e.st = 'daze'; e.t = 0; }
      } else if (e.st === 'daze') { if (e.t > 2.2) { e.st = 'waddle'; e.t = 0; } }
      break;
  }
  if (d < e.r + 5 && e.st !== 'daze') hurtPlayer(e.touch, e);
}

function updatePickup(e, dt) {
  if (e.life !== undefined) { e.life -= dt; if (e.life <= 0) { G.ents = G.ents.filter(o => o !== e); return; } }
  const dp = dist(e, G.player);
  if (G.mode === 'arena' && (dp < G.st.pickup || e.magnet)) { const k = Math.min(1, 9 * dt); e.x += (G.player.x - e.x) * k; e.y += (G.player.y - e.y) * k; }
  if (dp > 11) return;
  G.ents = G.ents.filter(o => o !== e);
  const s = G.save, p = G.player;
  switch (e.what) {
    case 'heart': p.hp = Math.min(s.maxHp, p.hp + 2); Sound.play('heart'); break;
    case 'kr1': s.kr += 1; Sound.play('coin'); break;
    case 'kr5': s.kr += 5; Sound.play('coin'); break;
    case 'krn': s.kr += e.value; Sound.play('coin'); break;
    case 'rune': s.rune = Math.min(RUNE_MAX, s.rune + 4); Sound.play('heart'); break;
    case 'piece': case 'container':

      giveItem(e.what);
      break;

  let body = '#1a1a38';
  if (e.flash > 0) body = '#fff'; else if (e.st === 'wind') body = '#8c1a1a';
  R(-6, 5, 12, 2, 'rgba(0,0,0,.3)');
  R(-5 + sw, -6, 10, 12, body); R(-3 + sw, -2, 6, 7, '#f2f2ff'); R(-4 + sw, -5, 8, 3, body);
  R(-6 + sw, -2, 1, 5, body); R(5 + sw, -2, 1, 5, body);
  R(-1 + sw, -3, 3, 2, '#ffa61a'); R(-3, 6, 2, 1, '#ffa61a'); R(1, 6, 2, 1, '#ffa61a');
  R(-3 + sw, -5, 2, 2, '#ff1a1a'); R(1 + sw, -5, 2, 2, '#ff1a1a');
  if (crown) { R(-4 + sw, -9, 8, 3, '#ffd84a'); R(-4 + sw, -11, 2, 2, '#ffd84a'); R(-1 + sw, -11, 2, 2, '#ffd84a'); R(2 + sw, -11, 2, 2, '#ffd84a'); R(-1 + sw, -8, 2, 1, '#e23'); }
}
function drawEnemy(e) {
  const x = Math.round(e.x - G.cam.x), y = Math.round(e.y - G.cam.y);
  ctx.save(); ctx.translate(x, y);
  switch (e.type) {
    case 'penguin': drawPenguinBody(e); break;
    case 'king':
      if (e.st === 'wind' || e.st === 'slide') ctx.translate(rnd(-1, 1), 0);
      ctx.scale(2.4, 2.4); drawPenguinBody(e, true);
      if (e.st === 'daze') for (let i = 0; i < 3; i++) { const a = G.t * 5 + i * 2.1; R(Math.cos(a) * 6 - 1, -13 + Math.sin(a) * 2, 2, 2, '#ffe066'); }
      break;
    case 'knight':
      ctx.scale(1.5, 1.5); drawPenguinBody(e);
      R(-5, -8, 10, 4, '#8a8aa0'); R(-5, -8, 10, 1, '#c9c9d9'); R(-1, -10, 2, 3, '#e23');
      R(Math.round(e.fx * 6) - 3, Math.round(e.fy * 5) - 3, 6, 8, '#6b4322'); R(Math.round(e.fx * 6) - 2, Math.round(e.fy * 5) - 2, 4, 6, '#b8b8c8');
      break;
    case 'draugr': {
      const sw = Math.round(Math.sin(e.wob * 0.5));
      const bone = e.flash > 0 ? '#fff' : '#b9c4a8';
      R(-6, 6, 12, 2, 'rgba(0,0,0,.3)');
      R(-4, 2 + sw, 3, 5, '#5a5a4a'); R(1, 2 - sw, 3, 5, '#5a5a4a');
      R(-5, -4, 10, 7, '#4a5a3a'); R(-4, -11, 8, 7, bone); R(-3, -8, 2, 2, '#111'); R(1, -8, 2, 2, '#111'); R(-2, -5, 4, 1, '#111');
      R(-5, -13, 10, 3, '#7a7a8a'); R(-1, -15, 2, 2, '#7a7a8a');
      R(Math.round(e.fx * 7) - 4, Math.round(e.fy * 5) - 4, 8, 8, '#8a2a21'); R(Math.round(e.fx * 7) - 1, Math.round(e.fy * 5) - 1, 2, 2, '#ffd84a');
      break; }
    case 'wisp': {

      R(-3, -3, 6, 6, e.flash > 0 ? '#fff' : '#cfefff'); R(-1, -5, 2, 2, '#cfefff'); R(-2, -1, 1, 1, '#123'); R(1, -1, 1, 1, '#123');

      break; }
  }
  ctx.restore();
  if (e.boss && e.alive) {

    R(bx - 1, by - 1, w + 2, 5, '#000'); R(bx, by, w * Math.max(0, e.hp / e.max), 3, '#e23');

}

function drawPerson(x, y, look, bob) {

function drawThing(e) {
  const x = Math.round(e.x - G.cam.x), y = Math.round(e.y - G.cam.y), t = G.t;

    case 'npc': return drawPerson(x, y, LOOKS[e.id] || LOOKS.sven, e.bob);
    case 'sign': R(x - 1, y, 2, 7, '#6b4322'); R(x - 7, y - 7, 14, 9, '#b07a4e'); R(x - 7, y - 7, 14, 1, '#d9a46e'); R(x - 5, y - 4, 10, 1, '#6b4322'); R(x - 5, y - 1, 7, 1, '#6b4322'); break;
    case 'plaque': R(x - 7, y - 4, 14, 7, '#c08a50'); R(x - 6, y - 3, 12, 1, '#6b4322'); R(x - 6, y, 9, 1, '#6b4322'); break;
    case 'runestone': {

      ctx.globalAlpha = 0.6 + 0.4 * Math.sin(t * 3); R(x - 1, y - 8, 2, 11, '#7fd4ff'); R(x - 3, y - 6, 6, 2, '#7fd4ff'); R(x - 3, y - 1, 2, 2, '#7fd4ff'); R(x + 1, y + 1, 2, 2, '#7fd4ff'); ctx.globalAlpha = 1;
      break; }
    case 'chest':

      R(x - 7, y - 5, 1, 11, '#ffd84a'); R(x + 6, y - 5, 1, 11, '#ffd84a'); break;
    case 'shop': drawItemIcon(e.item, x, y - 2); text(String(e.price), x, y + 12, '#fff', 'center'); break;
    case 'pickup': {
      if (e.life !== undefined && e.life < 2 && Math.floor(t * 10) % 2) break;
      const b = Math.round(Math.sin(t * 4 + e.x) * 1.5);
      if (e.what === 'heart') drawHeart(x - 3, y - 3 + b, 1);
      else if (e.what === 'kr1' || e.what === 'kr5' || e.what === 'krn') { R(x - 3, y - 3 + b, 6, 6, (e.what === 'kr5' || e.value >= 5) ? '#ffd84a' : '#d0d6e0'); R(x - 1, y - 2 + b, 2, 4, (e.what === 'kr5' || e.value >= 5) ? '#a87a10' : '#8a92a0'); }
      else if (e.what === 'rune') drawItemIcon('shard', x, y + b);

    case 'switch': {
      const on = flag(G.mapId + ':gates');
      R(x - 5, y + 2, 10, 5, '#3a3a4a'); poly([[x, y - 9], [x + 6, y - 2], [x, y + 4], [x - 6, y - 2]], on ? '#7fd4ff' : '#ff9a1f'); R(x - 2, y - 5, 2, 3, '#fff');
      break; }
    case 'warp': if (e.portal) { for (let i = 0; i < 3; i++) { const r = 4 + ((t * 10 + i * 4) % 10); ctx.strokeStyle = `rgba(127,212,255,${1 - r / 14})`; ctx.lineWidth = 1; ctx.beginPath(); ctx.ellipse(x, y, r, r * 0.6, 0, 0, Math.PI * 2); ctx.stroke(); } } break;
  }
}

const ARENA_BEST_KEY = 'jontuka-arena-best';
const A = { wave: 0, t: 0, len: 0, spawnT: 0, kills: 0, xp: 0, lvl: 1, pendingLv: 0, owned: {}, cards: [], sel: 0,

];

function arenaBest() { try { return +localStorage.getItem(ARENA_BEST_KEY) || 0; } catch (e) { return 0; } }
function waveSpec(w) {
  const pool = ['penguin'];
  if (w >= 2) pool.push('bat');
  if (w >= 3) pool.push('wisp', 'penguin');
  if (w >= 4) pool.push('draugr');
  if (w >= 7) pool.push('draugr', 'bat');
  return {
    len: Math.min(18 + (w - 1) * 3, 45),
    every: Math.max(0.22, 1.2 - w * 0.055),
    batch: 1 + Math.floor(w / 6),
    pool,
    knightChance: w >= 6 ? 0.03 + w * 0.004 : 0,
    hpMul: 1 + 0.2 * (w - 1),
    touchAdd: Math.floor(w / 8),
    bosses: w === 20 ? 2 : (w % 5 === 0 ? 1 : 0),
  };
}

function startArena() {
  G.mode = 'arena';
  G.save = newSave(); G.save.voodoo = false; G.save.map = 'arena';
  G.st = baseStats();
  G.player = makePlayer(); G.jon = makeJon(); G.player.hp = G.save.maxHp;
  Object.assign(A, { wave: 0, kills: 0, xp: 0, lvl: 1, pendingLv: 0, owned: {}, orbit: 0, frost: 0, chain: 0, turrets: [], pals: [], shots: [], bolts: [], marks: [], won: false, rerolls: 0 });
  G.state = 'play';
  loadMap('arena', 16 * T, 14 * T + 8);
  say([
    ['Jon', 'Welcome to VALHALLA ARENA! Chilly sends twenty waves of minions. We survive all twenty.'],
    ['Jon', 'Enemies drop kroner. Between waves we shop for upgrades. Level ups give free stats.'],
    ['Jon', 'Z swings me, X throws me. Enter pauses. Ready? Of course you are. You have ME.'],
  ], () => nextWave());
}

function nextWave() {
  A.wave++;
  const sp = waveSpec(A.wave);
  A.t = 0; A.len = sp.len; A.spawnT = 0.5; A.marks = []; A.shots = [];
  G.state = 'play';
  placeTurrets();
  G.banner = A.wave % 5 === 0 ? `WAVE ${A.wave} · BOSS` : `WAVE ${A.wave}`; G.bannerT = 1.6;
  if (sp.bosses) {
    Sound.play('boss');
    for (let i = 0; i < sp.bosses; i++) arenaSpawn('king', 16 * T + (i ? 80 : -80) * (sp.bosses > 1 ? 1 : 0), 6 * T, true);
  }
}
function placeTurrets() {
  const p = G.player, n = A.turrets.length;
  A.turrets.forEach((t, i) => { const a = (i / Math.max(1, n)) * Math.PI * 2; t.x = clamp(p.x + Math.cos(a) * 34, 24, G.cols * T - 24); t.y = clamp(p.y + Math.sin(a) * 34, 40, G.nrows * T - 24); });
}

function arenaSpawn(type, x, y, now) {
  if (!now) { A.marks.push({ type, x, y, t: 0.8 }); return; }
  const sp = waveSpec(Math.max(1, A.wave));
  const e = makeEnemy(type, x, y);
  e.aggro = true;
  if (e.st === 'intro') e.st = type === 'king' ? 'waddle' : 'chase';
  const mul = type === 'king' ? (1 + 0.5 * Math.floor(A.wave / 5 - 1)) * 2 : sp.hpMul;
  e.hp = e.max = e.hp * mul; e.touch += sp.touchAdd;
  G.ents.push(e);
  puff(x, y, '#cfe8ff', 6);
}
function randomSpawnPoint() {
  const p = G.player;
  for (let i = 0; i < 20; i++) {
    const x = rnd(2.5, G.cols - 2.5) * T, y = rnd(3, G.nrows - 2.5) * T;
    if (Math.hypot(x - p.x, y - p.y) > 70 && !solidAt(x, y, 'walker')) return { x, y };
  }
  return { x: 3 * T, y: 4 * T };
}

function arenaKill(e) {
  A.kills++;
  const val = { penguin: 1, bat: 1, wisp: 1, draugr: 2, knight: 5, king: 25 }[e.type] || 1;
  const n = Math.min(val, 5);
  for (let i = 0; i < n; i++) G.ents.push({ kind: 'pickup', what: 'krn', value: Math.ceil(val / n), x: e.x + rnd(-6, 6), y: e.y + rnd(-6, 6), life: 30 });
  if (Math.random() < 0.04) G.ents.push({ kind: 'pickup', what: 'heart', x: e.x, y: e.y, life: 10 });
  A.xp += e.type === 'king' ? 15 : e.type === 'knight' ? 4 : e.type === 'draugr' ? 2 : 1;
  while (A.xp >= xpNeed()) { A.xp -= xpNeed(); A.lvl++; A.pendingLv++; floatText(G.player.x, G.player.y - 24, 'LEVEL UP!', '#9be08a'); Sound.play('heart'); }
}
const xpNeed = () => 5 + A.lvl * 4;

function arenaOnHit(e) {
  if (!A.chain || Math.random() > 0.2 * A.chain) return;
  const near = G.ents.filter(o => o.enemy && o.alive && o !== e && dist(o, e) < 80).sort((a, b) => dist(a, e) - dist(b, e)).slice(0, 3);
  let from = e;
  for (const o of near) {
    A.bolts.push({ x1: from.x, y1: from.y, x2: o.x, y2: o.y, t: 0.15 });
    damageEnemy(o, rollDamage(0.8), from, 'magic');
    from = o;
  }
  if (near.length) Sound.play('switch');
}

function updateArena(dt) {
  const p = G.player, sp = waveSpec(A.wave);
  // camera follows Owen
  G.cam.x = clamp(p.x - VW / 2, 0, G.cols * T - VW); G.cam.y = clamp(p.y - VH / 2, 0, G.nrows * T - VH);
  A.t += dt;
  // regen
  if (G.st.regen > 0) { A.regenT += dt; if (A.regenT > 8 / G.st.regen) { A.regenT = 0; if (p.hp < G.save.maxHp) { p.hp++; floatText(p.x, p.y - 16, '+', '#9be08a'); } } }
  // spawning with warning marks
  A.spawnT -= dt;
  const alive = G.ents.filter(e => e.enemy && e.alive).length;
  if (A.spawnT <= 0 && A.t < A.len - 1 && alive < 55) {
    A.spawnT = sp.every;
    for (let i = 0; i < sp.batch; i++) {
      const pt = randomSpawnPoint();
      arenaSpawn(Math.random() < sp.knightChance ? 'knight' : pick(sp.pool), pt.x, pt.y);
    }
  }
  for (const m of A.marks) { m.t -= dt; if (m.t <= 0) arenaSpawn(m.type, m.x, m.y, true); }
  A.marks = A.marks.filter(m => m.t > 0);
  // Ghost Jons
  if (A.orbit) {
    for (let i = 0; i < A.orbit; i++) {
      const a = G.t * 3.2 + i * Math.PI * 2 / A.orbit, ox = p.x + Math.cos(a) * 28, oy = p.y + Math.sin(a) * 28;
      for (const e of G.ents) if (e.enemy && e.alive && Math.hypot(e.x - ox, e.y - oy) < e.r + 7 && !(e.orbCd > 0)) { e.orbCd = 0.5; damageEnemy(e, rollDamage(0.7), { x: ox, y: oy }, 'magic'); }
    }
  }
  for (const e of G.ents) if (e.orbCd > 0) e.orbCd -= dt;
  // Frost aura
  if (A.frost) {
    A.frostT += dt;
    const r = 34 + A.frost * 10;
    for (const e of G.ents) if (e.enemy && e.alive && dist(e, p) < r) e.slow = 0.3;
    if (A.frostT > 0.7) { A.frostT = 0; for (const e of G.ents.slice()) if (e.enemy && e.alive && dist(e, p) < r) damageEnemy(e, 0.35 * A.frost * G.st.dmg, p, 'magic'); }
  }
  // turrets
  for (const t of A.turrets) {
    t.cd -= dt;
    if (t.cd > 0) continue;
    const tgt = G.ents.filter(e => e.enemy && e.alive && dist(e, t) < 130).sort((a, b) => dist(a, t) - dist(b, t))[0];
    if (!tgt) continue;
    t.cd = 1.1 / G.st.atk;
    const d = dist(tgt, t) || 1;
    A.shots.push({ x: t.x, y: t.y - 6, vx: (tgt.x - t.x) / d * 170, vy: (tgt.y - t.y) / d * 170, life: 1.2 });
  }
  for (const s of A.shots) {
    s.x += s.vx * dt; s.y += s.vy * dt; s.life -= dt;
    const hit = G.ents.find(e => e.enemy && e.alive && Math.hypot(e.x - s.x, e.y - s.y) < e.r + 3);
    if (hit) { s.life = 0; damageEnemy(hit, rollDamage(1), s, 'magic'); }
    if (solidAt(s.x, s.y, 'jon')) s.life = 0;
  }
  A.shots = A.shots.filter(s => s.life > 0);
  // Penguin Pals: waddle after Owen, belly-slide into the nearest enemy
  A.pals.forEach((pl, i) => {
    pl.wob += dt * 8; pl.cd -= dt;
    if (pl.dash > 0) {
      pl.dash -= dt; pl.x += pl.dx * 200 * dt; pl.y += pl.dy * 200 * dt;
      for (const e of G.ents) if (e.enemy && e.alive && Math.hypot(e.x - pl.x, e.y - pl.y) < e.r + 6 && !(e.palCd > 0)) { e.palCd = 0.4; damageEnemy(e, rollDamage(1.5), pl, 'magic'); }
    } else {
      const tx = p.x - 16 + i * 32, ty = p.y + 14;
      pl.x += (tx - pl.x) * Math.min(1, 4 * dt); pl.y += (ty - pl.y) * Math.min(1, 4 * dt);
      if (pl.cd <= 0) {
        const tgt = G.ents.filter(e => e.enemy && e.alive && dist(e, pl) < 120).sort((a, b) => dist(a, pl) - dist(b, pl))[0];
        if (tgt) { const d = dist(tgt, pl) || 1; pl.dx = (tgt.x - pl.x) / d; pl.dy = (tgt.y - pl.y) / d; pl.dash = 0.45; pl.cd = 2; }
      }
    }
    pl.x = clamp(pl.x, 20, G.cols * T - 20); pl.y = clamp(pl.y, 36, G.nrows * T - 20);
  });
  for (const e of G.ents) if (e.palCd > 0) e.palCd -= dt;
  for (const b of A.bolts) b.t -= dt;
  A.bolts = A.bolts.filter(b => b.t > 0);
  // wave over
  if (A.t >= A.len && !G.ents.some(e => e.enemy && e.alive && e.type === 'king')) endWave();
}

function endWave() {
  for (const e of G.ents.filter(e => e.enemy)) puff(e.x, e.y, '#fff', 4);
  G.ents = G.ents.filter(e => !e.enemy);
  for (const e of G.ents) if (e.kind === 'pickup' && e.what === 'krn') { G.save.kr += e.value; }
  G.ents = G.ents.filter(e => !(e.kind === 'pickup'));
  A.marks = []; A.shots = [];
  G.jon.mode = 'follow';
  Sound.play('secret');
  if (A.wave >= ARENA_WAVES) return arenaOver(true);
  if (A.pendingLv > 0) openLevelUp(); else openShop();
}
function openLevelUp() {
  G.state = 'levelup'; A.sel = 0;
  A.choices = [...LEVEL_UPS].sort(() => Math.random() - 0.5).slice(0, 4);
}
function openShop() {
  G.state = 'shop'; A.sel = 0; A.rerolls = 0;
  rollCards();
}
function cardPrice(c) { return Math.round(c.price * (1 + 0.12 * (A.wave - 1))); }
function rollCards() {
  const avail = ARENA_CARDS.filter(c => (A.owned[c.id] || 0) < c.max);
  A.cards = [...avail].sort(() => Math.random() - 0.5).slice(0, 4).map(c => ({ ...c, sold: false }));
}
const rerollCost = () => 3 + A.wave + A.rerolls * 2;

function updateArenaMenus() {
  if (G.state === 'levelup') {
    if (just('up')) { A.sel = (A.sel + 3) % 4; Sound.play('menu'); }
    if (just('down')) { A.sel = (A.sel + 1) % 4; Sound.play('menu'); }
    if (just('a') || just('tap')) {
      A.choices[A.sel].apply(); A.pendingLv--; Sound.play('item');
      if (A.pendingLv > 0) openLevelUp(); else openShop();
    }
    return;
  }
  if (G.state === 'shop') {
    const n = A.cards.length + 1;   // last row = Next wave
    if (just('up')) { A.sel = (A.sel + n - 1) % n; Sound.play('menu'); }
    if (just('down')) { A.sel = (A.sel + 1) % n; Sound.play('menu'); }
    if (just('b')) {
      if (G.save.kr >= rerollCost()) { G.save.kr -= rerollCost(); A.rerolls++; rollCards(); A.sel = 0; Sound.play('coin'); } else Sound.play('clank');
    }
    if (just('menu')) return nextWave();
    if (just('a') || just('tap')) {
      if (A.sel === A.cards.length) return nextWave();
      const c = A.cards[A.sel];
      if (!c || c.sold) return;
      if (G.save.kr < cardPrice(c)) { Sound.play('clank'); return; }
      G.save.kr -= cardPrice(c); c.sold = true; A.owned[c.id] = (A.owned[c.id] || 0) + 1; c.apply(); Sound.play('item');
    }
    return;
  }
  if (G.state === 'arenapause') {
    if (just('menu') || just('a')) G.state = 'play';
    if (just('b')) { G.mode = 'story'; G.st = baseStats(); G.state = 'title'; G.menuSel = 0; }
    return;
  }
  if (G.state === 'arenaover') {
    if (just('a') || just('menu') || just('tap')) { G.mode = 'story'; G.st = baseStats(); G.state = 'title'; G.menuSel = 0; }
  }
}

function arenaOver(won) {
  A.won = won;
  G.state = 'arenaover';
  const reached = won ? ARENA_WAVES : A.wave;
  try { if (reached > arenaBest()) localStorage.setItem(ARENA_BEST_KEY, String(reached)); } catch (e) {}
  Sound.play(won ? 'secret' : 'hurt');
}

function say(lines, done) {
  if (!lines || !lines.length) { if (done) done(); return; }
  G.talk = { queue: lines.slice(), done: done || null, cur: null, shown: 0, back: G.state === 'talk' ? 'play' : (G.state === 'hold' ? 'play' : G.state) };
  if (G.talk.back !== 'play' && G.talk.back !== 'cutscene') G.talk.back = 'play';
  G.state = 'talk';
  nextLine();
}
function nextLine() {
  const tk = G.talk;
  if (!tk.queue.length) {
    G.state = tk.back; G.talk = null; if (G.player) G.player.cd = 0.25;
    if (tk.done) tk.done();
    return;
  }
  tk.cur = tk.queue.shift(); tk.shown = 0;
}
function updateTalk(dt) {
  const tk = G.talk, before = Math.floor(tk.shown);
  tk.shown += dt * 55;
  if (Math.floor(tk.shown) !== before && Math.floor(tk.shown) % 3 === 0 && tk.shown < tk.cur[1].length) Sound.play('blip');
  if (just('a') || just('b') || just('tap')) { if (tk.shown < tk.cur[1].length) tk.shown = 999; else nextLine(); }
}
function drawTalk() {
  const tk = G.talk; if (!tk) return;
  const [who, msg] = tk.cur;
  const inCut = tk.back === 'cutscene';
  const top = !inCut && G.player && G.player.y - G.cam.y > 140;
  const by = top ? 26 : 152;
  R(8, by - 2, 240, 66, '#fff'); R(10, by, 236, 62, '#0d0d33');
  let y = by + 12;
  if (who) { text(who, 16, y, '#ffe64d'); y += 12; }
  let left = Math.floor(tk.shown);
  for (const l of wrap(msg, 222).slice(0, who ? 4 : 5)) { text(l.slice(0, Math.max(0, left)), 16, y, '#fff', 'left', false); left -= l.length + 1; y += 10; }
  if (tk.shown >= msg.length && Math.floor(G.t * 3) % 2 === 0) text('▼', 234, by + 58, '#fff', 'left', false);
}

        R(x - 12, y - 20, 24, 50, '#7a1020'); R(x - 9, y - 30, 18, 14, flick ? '#d0ffd0' : '#e8c8b0');
        R(x - 6, y - 26, 4, 3, '#ff1a1a'); R(x + 2, y - 26, 4, 3, '#ff1a1a');
        R(x - 6, y - 19, 12, 2, '#200'); for (let i = 0; i < 4; i++) R(x - 5 + i * 3, y - 19, 1, 3, '#fff');
        for (let i = 0; i < 3; i++) { R(x - 18 - i * 2, y + 6 + i * 3, 6, 1, '#ddd'); R(x + 12 + i * 2, y + 6 + i * 3, 6, 1, '#ddd'); }
        ctx.fillStyle = `rgba(120,0,0,${0.15 + 0.1 * Math.sin(t * 3)})`; ctx.fillRect(0, 0, VW, 140);
      }
      break; }
    case 'land':
      R(0, 0, VW, 140, '#7fb6e8'); R(0, 100, VW, 40, '#549a3d'); R(0, 112, VW, 10, '#777');
      for (let x = 0; x < VW; x += 24) R(x + 4, 116, 12, 2, '#fff');
      R(40 + Math.min(t * 10 % 200, 120), 98, 70, 12, '#e9edf2');
      for (let i = 0; i < 5; i++) R(0, 60 + i * 5, VW, 1, '#9cc8ef');
      break;
  }
  text('FLIGHT 364  ·  NEW YORK → NORWAY', VW / 2, 12, '#888', 'center', false);
}
function startFlight() {
  G.state = 'cutscene'; G.cut = { i: 0 };
  Sound.play('door');
  say(STORY.flight[0].lines, nextFlightPage);
}
function nextFlightPage() {
  G.cut.i++;
  if (G.cut.i >= STORY.flight.length) {
    G.state = 'play';
    const st = MAPS.overworld.ents.find(e => e.t === 'start').at;
    loadMap('overworld', st[0] * T + 8, st[1] * T + 8);
    writeSave();
    say(STORY.arrival);
    return;
  }
  if (STORY.flight[G.cut.i].art === 'demon') Sound.play('creep');
  G.state = 'cutscene';
  say(STORY.flight[G.cut.i].lines, nextFlightPage);
}

// ===== main.js =====
// State machine and main loop.

function newGame() {
  G.mode = 'story'; G.st = baseStats();
  G.save = newSave();
  G.player = makePlayer(); G.jon = makeJon();
  const st = MAPS.home.ents.find(e => e.t === 'start').at;
  G.state = 'play';
  loadMap('home', st[0] * T + 8, st[1] * T + 8);
  say(STORY.intro);
}
function continueGame() {
  G.mode = 'story'; G.st = baseStats();
  G.save = readSave() || newSave();
  G.player = makePlayer(); G.jon = makeJon();
  G.player.hp = G.save.maxHp;
  G.state = 'play';
  if (!G.save.x) return newGame();
  loadMap(G.save.map, G.save.x, G.save.y);
}

function startWarp(to, dest) {
  G.state = 'warp'; G.warp = { to, dest, t: 0, done: false };
  Sound.play('door');
}
function updateWarp(dt) {
  const w = G.warp; w.t += dt;
  if (w.t > 0.35 && !w.done) {
    w.done = true;
    loadMap(w.to, w.dest[0] * T + 8, w.dest[1] * T + 8);
  }
  if (w.t > 0.7) { G.state = 'play'; writeSave(); }
}

function onEnterScreen() {
  const has = type => G.ents.some(e => e.type === type && e.alive);
  if (G.mapId === 'cavern' && !flag('intro:cavern')) { setFlag('intro:cavern'); say(STORY.cavern_enter); }
  if (has('knight') && !flag('intro:knight')) { setFlag('intro:knight'); Sound.play('boss'); say(STORY.knight); }
  if (has('king')) { Sound.play('boss'); say(flag('intro:king') ? [['Penguin King', 'AK! Back for more?']] : STORY.king); setFlag('intro:king'); }
  if (G.mapId === 'overworld' && flag('d1done') && !flag('chapter1_banner') && G.scr.x === 2 && G.scr.y === 0) {
    setFlag('chapter1_banner'); G.banner = STORY.chapter_done; G.bannerT = 4; Sound.play('secret'); writeSave();
  }
}

function update(dt) {
  G.t += dt;
  G.shake = Math.max(0, G.shake - dt); G.flash = Math.max(0, G.flash - dt); G.bannerT = Math.max(0, G.bannerT - dt);
  if (just('mute')) Sound.muted = !Sound.muted;
  switch (G.state) {
    case 'title': {
      const opts = titleOptions();
      if (just('up')) { G.menuSel = (G.menuSel + opts.length - 1) % opts.length; G.confirmErase = false; Sound.play('menu'); }
      if (just('down')) { G.menuSel = (G.menuSel + 1) % opts.length; G.confirmErase = false; Sound.play('menu'); }
      G.menuSel = clamp(G.menuSel, 0, opts.length - 1);
      if (just('a') || just('menu') || just('tap')) {
        const o = opts[G.menuSel];
        if (o.disabled) { Sound.play('clank'); break; }
        if (o.id === 'arena') { startArena(); break; }
        if (o.id === 'continue') continueGame();
        else if (o.id === 'new') {
          if (readSave() && !G.confirmErase) { G.confirmErase = true; break; }
          try { localStorage.removeItem(SAVE_KEY); } catch (e) {}
          newGame();
        }
      }
      return;
    }
    case 'talk': updateTalk(dt); return;
    case 'cutscene': return;
    case 'hold':
      G.player.hold.t -= dt;
      if (G.player.hold.t <= 0) { G.player.hold = null; G.state = 'play'; G.afterHold(); }
      return;
    case 'warp': updateWarp(dt); return;
    case 'menu': if (just('menu') || just('a') || just('tap')) { G.state = 'play'; Sound.play('menu'); } return;
    case 'over':
      if (just('a') || just('menu') || just('tap')) { continueGame(); }
      return;
    case 'levelup': case 'shop': case 'arenapause': case 'arenaover': updateArenaMenus(); return;
    case 'thunder': updateThunder(dt); updateFx(dt); return;
  }
  // play
  if (G.trans) { updateTransition(dt); return; }
  if (just('menu')) { G.state = G.mode === 'arena' ? 'arenapause' : 'menu'; Sound.play('menu'); return; }
  const s = G.save;
  if (s.items.thunder) { G.runeT = (G.runeT || 0) + dt; if (G.runeT > 5) { G.runeT = 0; s.rune = Math.min(RUNE_MAX, s.rune + 1); } }
  updatePlayer(dt);
  if (G.state !== 'play') return;
  updateJon(dt);
  if (G.mode === 'arena') { updateArena(dt); if (G.state !== 'play') return; }
  for (const e of G.ents.slice()) {
    if (e.kind === 'enemy' && e.alive) { if (e.slow > 0) { e.slow -= dt; updateEnemy(e, dt * 0.5); } else updateEnemy(e, dt); }
    else if (e.kind === 'pickup') updatePickup(e, dt);
    else if (e.kind === 'switch') e.cd = Math.max(0, e.cd - dt);
    if (G.state !== 'play') break;
  }
  updateFx(dt);
  if (G.state === 'play') checkScreenEdge();
}

function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, VW, VH);
  if (G.state === 'title') return drawTitle();
  if (G.state === 'cutscene' || (G.state === 'talk' && G.talk && G.talk.back === 'cutscene')) { drawCutscene(); drawTalk(); return; }
  if (G.shake > 0) ctx.setTransform(1, 0, 0, 1, Math.round(rnd(-2, 2)), Math.round(rnd(-2, 2)));
  drawMap();
  const p = G.player;
  const list = G.ents.filter(e => e.kind !== 'warp' || e.portal).map(e => ({ y: e.y, f: () => drawThing(e) }));
  list.push({ y: p.y, f: () => drawOwen(p.x - G.cam.x, p.y - G.cam.y) });
  list.sort((a, b) => a.y - b.y).forEach(o => o.f());
  if (G.mode === 'arena') drawArenaWorld();
  if (!p.hold) drawJon();
  drawFx();
  drawLightning();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  if (G.map.dungeon) { const g = ctx.createRadialGradient(p.x - G.cam.x, p.y - G.cam.y, 40, p.x - G.cam.x, p.y - G.cam.y, 200); g.addColorStop(0, 'rgba(0,0,20,0)'); g.addColorStop(1, 'rgba(0,0,20,.45)'); ctx.fillStyle = g; ctx.fillRect(0, 0, VW, VH); }
  if (G.flash > 0) { ctx.globalAlpha = Math.min(1, G.flash * 3); R(0, 0, VW, VH, G.flashColor || '#fff'); ctx.globalAlpha = 1; }
  if (G.mode === 'arena') drawArenaHud(); else drawHud();
  if (G.state === 'warp') { ctx.globalAlpha = clamp(1 - Math.abs(G.warp.t - 0.35) / 0.35, 0, 1); R(0, 0, VW, VH, '#000'); ctx.globalAlpha = 1; }
  if (G.bannerT > 0) { R(0, 92, VW, 34, 'rgba(0,0,0,.8)'); text(G.banner, VW / 2, 113, '#ffd84a', 'center'); }
  if (G.state === 'talk') drawTalk();
  if (G.state === 'menu') drawMenu();
  drawArenaMenus();
  if (G.state === 'over') {
    R(0, 0, VW, VH, 'rgba(40,0,0,.8)');
    text('GAME OVER', VW / 2, 96, '#ff6b6b', 'center');
    text('Even zombies need a nap.', VW / 2, 116, '#fff', 'center');
    text('Press Z to continue', VW / 2, 140, '#ffd84a', 'center');
    text('from your last runestone', VW / 2, 154, '#ffd84a', 'center');
  }
}

let last = performance.now();
G.menuSel = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  try { update(dt); render(); } catch (err) { console.error(err); }
  for (const k in edge) edge[k] = false;
  requestAnimationFrame(frame);
}
(document.fonts && document.fonts.load ? document.fonts.load('8px "Press Start 2P"').catch(() => {}) : Promise.resolve())
  .then(() => requestAnimationFrame(t => { last = t; frame(t); }));
window.__game = G;

</script>
